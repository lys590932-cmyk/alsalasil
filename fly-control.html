<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLY Control — Al-Salasil</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy:#0f3a52;--navy2:#1c5878;--gold:#c29449;
    --bg:#f1f5f9;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--light:#f8fafc;--cream:#fdf6e9;
    --green:#059669;--green-bg:#dcfce7;--red:#dc2626;--red-bg:#fee2e2;
    --amber:#d97706;--amber-bg:#fef3c7;--blue:#2563eb;--blue-bg:#dbeafe;--purple:#7c3aed;
  }
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  html[dir="ltr"] body{font-family:'Cairo','Segoe UI',sans-serif}

  .topbar{background:linear-gradient(135deg,#0f3a52,#1c5878);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{background:var(--gold);color:var(--navy);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .topbar h1{font-size:19px;font-weight:900}
  .topbar .sub{font-size:11px;color:#fde68a;font-weight:700;margin-top:2px}
  .btn{padding:9px 15px;border:none;border-radius:8px;font-family:'Cairo';font-weight:800;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .btn-gold{background:var(--gold);color:#fff}.btn-ghost{background:rgba(255,255,255,0.15);color:#fff}
  .cloud{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,255,255,.12);border-radius:20px;font-size:11px;font-weight:800}
  .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .langsw{display:inline-flex;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
  .langsw button{background:none;border:none;color:rgba(255,255,255,.65);padding:7px 13px;font-family:'Cairo';font-weight:900;font-size:12px;cursor:pointer;transition:all .15s}
  .langsw button.on{background:var(--gold);color:#fff}

  .tabs{background:#fff;padding:0 24px;display:flex;border-bottom:2px solid var(--border);position:sticky;top:76px;z-index:99;overflow-x:auto}
  .tab{padding:14px 18px;background:none;border:none;font-family:'Cairo';font-weight:900;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab.on{color:var(--navy);border-bottom-color:var(--gold);background:linear-gradient(180deg,transparent,rgba(194,148,73,.08))}
  .tab .bdg{background:var(--red);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px}

  .container{padding:20px 24px;max-width:1600px;margin:0 auto}
  .view{display:none}.view.on{display:block}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--border)}
  html[dir="rtl"] .kpi{border-right:5px solid var(--c)}
  html[dir="ltr"] .kpi{border-left:5px solid var(--c)}
  .kpi-l{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:6px}
  .kpi-v{font-size:26px;font-weight:900;color:var(--c);line-height:1}

  .card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:900;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .card-h .btn{padding:6px 12px;font-size:11px}
  html[dir="rtl"] .card-h .btn{margin-right:auto}
  html[dir="ltr"] .card-h .btn{margin-left:auto}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--navy);color:#fff;padding:11px 9px;text-align:center;font-weight:800;font-size:11px;white-space:nowrap}
  td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:center;font-weight:600}
  tr:nth-child(even) td{background:var(--light)}
  tr:hover td{background:var(--cream)}
  .nm{font-weight:900;color:var(--navy);white-space:nowrap}
  html[dir="rtl"] .nm{text-align:right;padding-right:14px}
  html[dir="ltr"] .nm{text-align:left;padding-left:14px}
  .txt{max-width:240px}
  html[dir="rtl"] .txt{text-align:right}
  html[dir="ltr"] .txt{text-align:left}

  .st{display:inline-block;padding:3px 10px;border-radius:8px;font-size:10px;font-weight:800}
  .g{background:var(--green-bg);color:var(--green)}.r{background:var(--red-bg);color:var(--red)}
  .a{background:var(--amber-bg);color:var(--amber)}.b{background:var(--blue-bg);color:var(--blue)}
  .thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid var(--border)}
  .act{padding:5px 11px;border:none;border-radius:7px;font-family:'Cairo';font-weight:800;font-size:11px;cursor:pointer;margin:0 2px}
  .ok{background:var(--green);color:#fff}.no{background:var(--red);color:#fff}
  .empty{padding:44px;text-align:center;color:var(--muted);font-weight:700}
  .toolbar{background:#fff;padding:12px 16px;border-radius:12px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--border)}
  .toolbar input,.toolbar select{padding:9px 13px;border:2px solid var(--border);border-radius:9px;font-family:'Cairo';font-weight:700;font-size:13px}
  .toolbar label{font-weight:800;font-size:13px;color:var(--navy)}
  .push{margin-inline-start:auto}

  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px;border:2px solid var(--border);border-radius:9px;font-family:'Cairo';font-weight:700;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2500;align-items:center;justify-content:center;padding:18px}
  .modal-bg.on{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
  .modal-h{background:linear-gradient(135deg,#0f3a52,#1c5878);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
  .modal-x{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:19px;cursor:pointer}
  .modal-b{padding:18px 20px;overflow-y:auto;flex:1}
  .modal-f{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:9px;flex-wrap:wrap}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;align-items:center;justify-content:center;padding:20px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:96%;max-height:92vh;border-radius:12px}
  .lightbox .x{position:absolute;top:20px;inset-inline-start:20px;background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:10px;font-size:24px;cursor:pointer}
  .toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:13px 22px;border-radius:10px;font-weight:800;z-index:4000;display:none}
  .toast.on{display:block}.toast.err{background:var(--red)}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo">🎛️</div>
    <div><h1 data-i18n="app_title"></h1><div class="sub" data-i18n="app_sub"></div></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="langsw">
      <button id="lgAr" onclick="setLang('ar')">عربي</button>
      <button id="lgEn" onclick="setLang('en')">EN</button>
    </div>
    <span class="cloud"><span class="dot" id="dot"></span><span id="cloudTxt"></span></span>
    <button class="btn btn-ghost" onclick="location.href='السلاسل_نظام_ادارة_السائقين_28.html'"><i class="ti ti-app-window"></i> ARK</button>
    <button class="btn btn-ghost" onclick="openSet()"><i class="ti ti-settings"></i> <span data-i18n="settings"></span></button>
    <button class="btn btn-gold" onclick="loadAll()"><i class="ti ti-refresh"></i> <span data-i18n="refresh"></span></button>
  </div>
</div>

<div class="tabs" id="tabsBar"></div>

<div class="container">

  <!-- OVERVIEW -->
  <div class="view on" id="v-overview">
    <div class="kpis" id="kOver"></div>
    <div id="alertsBox"></div>
    <div class="grid2">
      <div class="card"><div class="card-h"><i class="ti ti-alert-circle" style="color:var(--red)"></i> <span data-i18n="needs_action"></span></div>
        <div id="todoList" style="max-height:420px;overflow-y:auto"></div></div>
      <div class="card"><div class="card-h"><i class="ti ti-activity"></i> <span data-i18n="recent_activity"></span></div>
        <div id="feedList" style="max-height:420px;overflow-y:auto"></div></div>
    </div>
  </div>

  <!-- PHOTOS -->
  <div class="view" id="v-photos">
    <div class="kpis" id="kPhotos"></div>
    <div class="toolbar">
      <label data-i18n="date"></label><input type="date" id="photoDate" onchange="renderPhotos()">
      <select id="photoFilter" onchange="renderPhotos()"></select>
      <button class="btn btn-gold push" onclick="exportPhotos()"><i class="ti ti-download"></i> <span data-i18n="export"></span></button>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-camera"></i> <span data-i18n="shift_photos"></span></div>
      <div style="overflow-x:auto"><table id="tPhotos"></table></div></div>
  </div>

  <!-- SHIFTS -->
  <div class="view" id="v-shifts">
    <div class="kpis" id="kShift"></div>
    <div class="toolbar">
      <label data-i18n="date"></label><input type="date" id="shiftDate" onchange="renderShifts()">
      <select id="shiftFilter" onchange="renderShifts()"></select>
      <span class="push" style="font-size:11px;color:var(--muted);font-weight:700">
        ⚙️ <span data-i18n="grace"></span>: <b id="cfgGrace">30</b> · <span data-i18n="deduction"></span>: <b id="cfgFrac"></b></span>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-clock"></i> <span data-i18n="today_shifts"></span>
      <button class="btn btn-gold" onclick="exportShifts()"><i class="ti ti-download"></i> <span data-i18n="export"></span></button></div>
      <div style="overflow-x:auto"><table id="tShifts"></table></div></div>
    <div class="card"><div class="card-h"><i class="ti ti-cash-off"></i> <span data-i18n="auto_late_ded"></span>
      <button class="btn btn-gold" onclick="exportDeductions()"><i class="ti ti-download"></i> <span data-i18n="export"></span></button></div>
      <div style="overflow-x:auto"><table id="tLateDed"></table></div></div>
  </div>

  <!-- DAILY REPORTS -->
  <div class="view" id="v-daily">
    <div class="kpis" id="kDaily"></div>
    <div class="toolbar">
      <label data-i18n="from"></label><input type="date" id="dlFrom" onchange="renderDaily()">
      <label data-i18n="to"></label><input type="date" id="dlTo" onchange="renderDaily()">
      <select id="dlPartner" onchange="renderDaily()"></select>
      <select id="dlView" onchange="renderDaily()"></select>
      <button class="btn btn-gold push" onclick="exportDaily()"><i class="ti ti-download"></i> <span data-i18n="export"></span></button>
    </div>
    <div id="dlAlert"></div>
    <div class="card"><div class="card-h"><i class="ti ti-report-analytics"></i> <span id="dlTitle"></span></div>
      <div style="overflow-x:auto"><table id="tDaily"></table></div></div>
  </div>

  <!-- REQUESTS -->
  <div class="view" id="v-requests">
    <div class="kpis" id="kReq"></div>
    <div class="toolbar">
      <select id="reqType" onchange="renderRequests()"></select>
      <select id="reqStatus" onchange="renderRequests()"></select>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-file-text"></i> <span data-i18n="driver_requests"></span></div>
      <div style="overflow-x:auto"><table id="tReq"></table></div></div>
  </div>

  <!-- MAINTENANCE -->
  <div class="view" id="v-maint">
    <div class="kpis" id="kMaint"></div>
    <div class="toolbar">
      <select id="maintStatus" onchange="renderMaint()"></select>
      <select id="maintSev" onchange="renderMaint()"></select>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-tool"></i> <span data-i18n="issue_reports"></span></div>
      <div style="overflow-x:auto"><table id="tMaint"></table></div></div>
  </div>

  <!-- FUEL -->
  <div class="view" id="v-fuel">
    <div class="kpis" id="kFuel"></div>
    <div class="toolbar">
      <label data-i18n="month"></label><input type="month" id="fuelMonth" onchange="renderFuel()">
      <label style="display:flex;align-items:center;gap:6px;color:var(--red)">
        <input type="checkbox" id="fuelFlagged" onchange="renderFuel()"> <span data-i18n="flagged_only"></span></label>
      <button class="btn btn-gold push" onclick="exportFuel()"><i class="ti ti-download"></i> <span data-i18n="export"></span></button>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-gas-station"></i> <span data-i18n="fuel_log"></span></div>
      <div style="overflow-x:auto"><table id="tFuel"></table></div></div>
  </div>

  <!-- VIOLATIONS -->
  <div class="view" id="v-vio">
    <div class="kpis" id="kVio"></div>
    <div class="toolbar">
      <button class="btn btn-gold" onclick="openAddVio()"><i class="ti ti-plus"></i> <span data-i18n="add_violation"></span></button>
      <select id="vioStatus" onchange="renderVio()"></select>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-alert-triangle"></i> <span data-i18n="traffic_violations"></span></div>
      <div style="overflow-x:auto"><table id="tVio"></table></div></div>
  </div>

  <!-- MESSAGES -->
  <div class="view" id="v-msgs">
    <div class="card">
      <div class="card-h"><i class="ti ti-send"></i> <span data-i18n="send_notif"></span></div>
      <div style="padding:18px">
        <div class="grid2">
          <div class="fld"><label data-i18n="recipient"></label><select id="msgTo"></select></div>
          <div class="fld"><label data-i18n="priority"></label><select id="msgLevel"></select></div>
        </div>
        <div class="fld"><label data-i18n="msg_title"></label><input id="msgTitle" type="text"></div>
        <div class="fld"><label data-i18n="msg_body"></label><textarea id="msgBody" rows="4" style="resize:vertical"></textarea></div>
        <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px" id="quickMsgBtns"></div>
        <button class="btn btn-gold" onclick="sendMsg()" id="sendMsgBtn" style="width:100%;padding:14px;font-size:15px"><i class="ti ti-send"></i> <span data-i18n="send"></span></button>
      </div>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-history"></i> <span data-i18n="sent_messages"></span></div>
      <div style="overflow-x:auto"><table id="tMsgs"></table></div></div>
  </div>

  <!-- DRIVERS -->
  <div class="view" id="v-drivers">
    <div class="toolbar">
      <input type="text" id="drvSearch" oninput="renderDrivers()" style="flex:1;min-width:200px">
      <select id="drvPartner" onchange="renderDrivers()"></select>
      <button class="btn btn-gold" onclick="exportDrivers()"><i class="ti ti-download"></i> <span data-i18n="export"></span></button>
    </div>
    <div class="card"><div class="card-h"><i class="ti ti-users"></i> <span data-i18n="driver_files"></span></div>
      <div style="overflow-x:auto"><table id="tDrivers"></table></div></div>
  </div>

</div>

<!-- DRIVER MODAL -->
<div class="modal-bg" id="drvModal">
  <div class="modal" style="max-width:820px">
    <div class="modal-h">
      <div><div id="dmName" style="font-size:17px;font-weight:900"></div>
      <div id="dmSub" style="font-size:11px;color:#fde68a;font-weight:700;margin-top:2px"></div></div>
      <button class="modal-x" onclick="closeDrv()">×</button>
    </div>
    <div class="modal-b" id="dmBody"></div>
    <div class="modal-f">
      <button class="btn" style="background:var(--purple);color:#fff" onclick="msgThisDriver()"><i class="ti ti-send"></i> <span data-i18n="send_msg_btn"></span></button>
      <button class="btn" style="background:var(--red);color:#fff" onclick="addManualDeduction()"><i class="ti ti-cash-off"></i> <span data-i18n="add_deduction"></span></button>
      <button class="btn" style="background:var(--amber);color:#fff" onclick="addVioFor()"><i class="ti ti-alert-triangle"></i> <span data-i18n="add_violation"></span></button>
      <button class="btn push" style="background:var(--light);color:var(--navy);border:1px solid var(--border)" onclick="closeDrv()"><span data-i18n="close"></span></button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="setModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-h"><div style="font-size:16px;font-weight:900">⚙️ <span data-i18n="sys_settings"></span></div>
      <button class="modal-x" onclick="closeSet()">×</button></div>
    <div class="modal-b">
      <div class="fld"><label data-i18n="set_grace"></label>
        <input id="setGrace" type="number" min="0" max="180">
        <div style="font-size:11px;color:var(--muted);margin-top:4px" data-i18n="set_grace_hint"></div></div>
      <div class="fld"><label data-i18n="set_frac"></label><select id="setFrac"></select></div>
      <div class="fld"><label data-i18n="set_pre"></label><input id="setPre" type="number" min="5" max="180"></div>
      <div style="background:var(--amber-bg);padding:12px;border-radius:10px;font-size:11.5px;color:var(--amber);font-weight:700;line-height:1.7" data-i18n="set_warn"></div>
    </div>
    <div class="modal-f">
      <button class="btn" style="background:var(--light);color:var(--navy);border:1px solid var(--border);flex:1" onclick="closeSet()"><span data-i18n="cancel"></span></button>
      <button class="btn btn-gold" style="flex:2" onclick="saveSettings()"><i class="ti ti-device-floppy"></i> <span data-i18n="save"></span></button>
    </div>
  </div>
</div>

<div class="lightbox" id="lb" onclick="closeLB()"><button class="x" onclick="closeLB()">×</button><img id="lbImg"></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ i18n ═══════════ */
const I18N = {
ar:{
 app_title:'لوحة تحكم FLY', app_sub:'إدارة السائقين والعمليات اليومية',
 settings:'إعدادات', refresh:'تحديث', export:'تصدير', close:'إغلاق', cancel:'إلغاء', save:'حفظ',
 date:'📅 التاريخ:', from:'📅 من:', to:'إلى:', month:'📅 الشهر:', all:'الكل',
 // tabs
 t_overview:'نظرة عامة', t_photos:'صور الشفت', t_shifts:'الشفتات والتأخير', t_daily:'التقارير اليومية',
 t_requests:'الطلبات', t_maint:'الصيانة', t_fuel:'الوقود', t_vio:'المخالفات', t_msgs:'الرسائل', t_drivers:'السائقون',
 // overview
 needs_action:'يحتاج إجراء الآن', recent_activity:'آخر النشاطات',
 k_shifts_today:'شفتات اليوم', k_late_absent:'متأخرين + غياب', k_no_photo:'لم يرفعوا صورة', k_missing_rep:'تقارير ناقصة (أمس)',
 all_good:'✅ كل شيء تمام — لا يوجد ما يحتاج تدخّل عاجل', no_tasks:'✅ لا توجد مهام معلقة', no_activity:'لا توجد نشاطات',
 al_crit_maint:'بلاغ عطل حرج/خطير', al_crit_maint_s:'سيارات قد تكون متوقفة — راجعها فوراً',
 al_noshow:'سائق لم يسجّل حضور', al_noshow_s:'وآخرون',
 al_req:'طلب بانتظار موافقتك', al_req_s:'إجازات وسلف معلّقة',
 al_appeal:'اعتراض على مخالفة', al_appeal_s:'يحتاج قرار منك',
 al_fuel:'تعبئة وقود مشبوهة', al_fuel_s:'استهلاك غير طبيعي هذا الشهر',
 al_missrep:'تقرير يومي ناقص (أمس)', al_missrep_s:'سائقون عملوا ولم يرسلوا تقاريرهم',
 al_flagrep:'تقرير فيه فروقات', al_flagrep_s:'الساعات أو الوقود لا يطابق السجل الفعلي',
 td_photo:'مراجعة صورة', td_leave:'إجازة', td_adv:'سلفة', td_issue:'عطل',

/* ═══════════ SHIFT HELPERS ═══════════ */
function shiftDT(dateStr,hhmm){
  if(!dateStr||!hhmm) return null;
  const p=String(hhmm).split(':');
  const d=new Date(dateStr+'T00:00:00');
  d.setHours(parseInt(p[0],10)||0,parseInt(p[1],10)||0,0,0);
  return d;
}
function firstClockIn(drvId,dateStr){
  let best=null;
  CLOCKINS.forEach(c=>{
    if(c.action!=='clock_in')return;
    if(String(c.created_at||'').slice(0,10)!==dateStr)return;
    if(c.driver_id!==drvId)return;
    const x=new Date(c.created_at);
    if(!best||x<best)best=x;
  });
  return best;
}
function actualHours(drvId,dateStr){
  const day=CLOCKINS.filter(c=>String(c.created_at||'').slice(0,10)===dateStr&&c.driver_id===drvId)
                    .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let total=0,inT=null;
  day.forEach(c=>{
    if(c.action==='clock_in'&&!inT) inT=new Date(c.created_at);
    else if(c.action==='clock_out'&&inT){ total+=(new Date(c.created_at)-inT)/3600000; inT=null; }
  });
  return total>0?Math.round(total*10)/10:null;
}
function actualFuel(drvId,dateStr){
  const rows=FUEL.filter(f=>f.driver_id===drvId&&String(f.log_date)===dateStr);
  return rows.length?rows.reduce((s,f)=>s+(parseFloat(f.amount_kd)||0),0):null;
}
function auditReport(r){
  const flags=[];
  const orders=parseInt(r.orders_count)||0;
  const repHrs=parseFloat(r.duty_hours)||0;
  const repFuel=parseFloat(r.fuel_amount)||0;
  const actH=actualHours(r.driver_id,r.report_date);
  if(actH!==null&&repHrs>0){
    const d=Math.abs(repHrs-actH);
    if(d>=2) flags.push({t:t('fl_hours'),m:t('fl_hrs_diff',repHrs,actH,d.toFixed(1)),s:'high'});
    else if(d>=1) flags.push({t:t('fl_hours'),m:t('fl_hrs_small',d.toFixed(1)),s:'low'});
  } else if(repHrs>0&&actH===null){
    flags.push({t:t('fl_att'),m:t('fl_no_att',repHrs),s:'high'});
  }
  const actF=actualFuel(r.driver_id,r.report_date);
  if(repFuel>0&&actF===null) flags.push({t:t('fl_fuel'),m:t('fl_fuel_norec',fmtKD(repFuel)),s:'low'});
  else if(repFuel>0&&actF!==null&&Math.abs(repFuel-actF)>=1)
    flags.push({t:t('fl_fuel'),m:t('fl_fuel_diff',fmtKD(repFuel),fmtKD(actF)),s:'high'});
  if(orders===0&&repHrs>=4) flags.push({t:t('fl_orders'),m:t('fl_zero',repHrs),s:'high'});
  if(repHrs>0&&orders/Math.max(repHrs,1)>12) flags.push({t:t('fl_orders'),m:t('fl_rate',Math.round(orders/repHrs)),s:'low'});
  if(repHrs>16) flags.push({t:t('fl_hours'),m:t('fl_hrs_max',repHrs),s:'high'});
  return flags;
}
function timeAgo(d){
  const m=Math.round((Date.now()-d)/60000);
  if(m<1) return t('ago_now');
  if(m<60) return t('ago_m',m);
  const h=Math.round(m/60);
  if(h<24) return t('ago_h',h);
  return t('ago_d',Math.round(h/24));
}
function shiftLabel(ty){
  return ty==='off'?t('sh_off'):(ty==='holiday'?t('sh_holiday'):(ty==='evening'?t('sh_evening'):t('sh_morning')));
}

function toCSV(rows){
  if(!rows.length) return '';
  const h=Object.keys(rows[0]);
  const e=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return '﻿'+h.join(',')+'\n'+rows.map(r=>h.map(k=>e(r[k])).join(',')).join('\n');
}
function download(name,content){
  const b=new Blob([content],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

  DAILY.slice(0,12).forEach(r=>feed.push({t:new Date(r.created_at||r.report_date),ic:'📋',x:r.driver_name+' '+t('fd_rep')+' — '+(r.orders_count||0)+' '+t('fd_order')}));

/* ═══════════ SHIFTS ═══════════ */
function renderShifts(){
  const date=document.getElementById('shiftDate').value||today();
  const filt=document.getElementById('shiftFilter').value;
  document.getElementById('cfgGrace').textContent=CFG.grace;
  document.getElementById('cfgFrac').textContent=CFG.fraction===0.5?t('half_day'):(CFG.fraction===1?t('full_day'):(CFG.fraction*100)+'%');

  const daySched=SCHED.filter(s=>s.date===date);
  const byDrv={}; daySched.forEach(s=>byDrv[s.driver_id]=s);

  let rows=DRIVERS.map(d=>{
    const sh=byDrv[d.id]||null;
    let state='none', lateMin=0, ciTime=null;
    if(sh){
      if(sh.shift_type==='off'||sh.shift_type==='holiday') state='off';
      else if(sh.shift_start){
        const start=shiftDT(date,sh.shift_start);
        ciTime=firstClockIn(d.id,date);
        if(ciTime){ lateMin=Math.round((ciTime-start)/60000); state=lateMin>=CFG.grace?'late':'ontime'; }
        else { const now=new Date(); state=(now>start)?'noshow':'pending'; if(now>start) lateMin=Math.round((now-start)/60000); }
      }
    }
    return {drv:d, sh, state, lateMin, ciTime};
  });
  const lateN=rows.filter(r=>r.state==='late').length;
  const noshowN=rows.filter(r=>r.state==='noshow').length;
  const working=daySched.filter(s=>s.shift_type!=='off'&&s.shift_type!=='holiday').length;
  if(filt) rows=rows.filter(r=>r.state===filt);

  const lateDeds=DEDS.filter(x=>x.ded_type==='late'&&x.date===date&&x.status!=='cancelled');
  const lateSum=lateDeds.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);

  document.getElementById('kShift').innerHTML=kpiHTML([
    {l:t('k_day_shifts'),v:working,c:'var(--navy)'},
    {l:t('k_late'),v:lateN,c:'var(--red)'},
    {l:t('k_noshow'),v:noshowN,c:'var(--amber)'},
    {l:t('k_late_ded'),v:fmtKD(lateSum),c:'var(--purple)'},
  ]);
  setB('bLate',lateN+noshowN);

  const ST={off:[t('st_off'),'b'],ontime:[t('st_ontime'),'g'],late:[t('st_late'),'r'],
            noshow:[t('st_noshow'),'r'],pending:[t('st_pending_shift'),'a'],none:[t('st_none'),'']};
  const M=RTL()?' د':'m';
  const H=[t('c_driver'),t('c_partner'),t('c_shift'),t('c_start'),t('c_end'),t('c_clockin'),t('c_late'),t('c_status')];
  document.getElementById('tShifts').innerHTML=
    '<thead><tr>'+H.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    (rows.length?rows.map(r=>{
      const s=ST[r.state]||ST.none;
      const tm=r.ciTime?r.ciTime.toLocaleTimeString(RTL()?'ar-KW':'en-GB',{hour:'2-digit',minute:'2-digit'}):'—';
      const lateTxt=(r.state==='late'||r.state==='noshow')?`<b style="color:var(--red)">+${r.lateMin}${M}</b>`
                   :(r.state==='ontime'?(r.lateMin>0?`+${r.lateMin}${M}`:'0'):'—');
      const typ=r.sh?shiftLabel(r.sh.shift_type):'—';
      return `<tr${(r.state==='late'||r.state==='noshow')?' style="background:var(--red-bg)"':''}>
        ${nmCell(r.drv.id,r.drv.name)}<td>${esc(r.drv.partner||'—')}</td>
        <td>${typ}</td><td><b>${r.sh&&r.sh.shift_start?r.sh.shift_start:'—'}</b></td>
        <td>${r.sh&&r.sh.shift_end?r.sh.shift_end:'—'}</td><td>${tm}</td><td>${lateTxt}</td>
        <td><span class="st ${s[1]}">${s[0]}</span></td></tr>`;
    }).join('') : `<tr><td colspan="8" class="empty">${t('no_shifts_hint')}</td></tr>`)+'</tbody>';

  const allLate=DEDS.filter(x=>x.ded_type==='late').slice(0,40);
  const H2=[t('c_driver'),t('c_date'),t('c_late_min'),t('c_amount'),t('c_reason'),t('c_status'),t('c_action')];
  document.getElementById('tLateDed').innerHTML=
    '<thead><tr>'+H2.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    (allLate.length?allLate.map(x=>{
      const cancelled=x.status==='cancelled';
      return `<tr${cancelled?' style="opacity:.5"':''}>
        ${nmCell(x.driver_id,x.driver_name)}<td>${fmtD(x.date)}</td>
        <td><b style="color:var(--red)">${x.minutes_late||'—'}</b></td>
        <td style="font-weight:900;color:var(--red)">${fmtKD(x.amount)}</td>
        <td style="max-width:280px">${esc(x.reason||'')}</td>
        <td><span class="st ${cancelled?'':'r'}">${cancelled?t('st_cancelled'):t('st_active')}</span></td>
        <td>${!cancelled?`<button class="act ok" onclick="cancelLate('${x.uniq_key||x.id}')">${t('cancel_ded')}</button>`:'—'}</td></tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">${t('no_late_ded')}</td></tr>`)+'</tbody>';
}
async function cancelLate(key){
  if(!confirm(t('confirm_cancel_ded'))) return;
  try{
    let q=sb.from('deductions').update({status:'cancelled',amount:0});
    q=String(key).startsWith('LATE_')?q.eq('uniq_key',key):q.eq('id',key);
    const {error}=await q; if(error) throw error;
    toast(t('done_cancel')); await loadAll();
  }catch(e){ toast(t('err')+': '+e.message,true); }
}

/* ═══════════ DRIVERS ═══════════ */
function drvStats(id){
  const T=today(), M=T.slice(0,7);
  const ph=PHOTOS.filter(p=>p.driver_id===id);
  const phM=ph.filter(p=>String(p.photo_date).startsWith(M));
  const vio=VIO.filter(v=>v.driver_id===id);
  const vioSum=vio.reduce((s,v)=>s+(parseFloat(v.amount)||0),0);
  const ded=DEDS.filter(x=>x.driver_id===id&&x.status!=='cancelled');
  const dedM=ded.filter(x=>String(x.date).startsWith(M));
  const dedSum=dedM.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const fu=FUEL.filter(f=>f.driver_id===id);
  const fuM=fu.filter(f=>String(f.log_date).startsWith(M));
  const fuSum=fuM.reduce((s,f)=>s+(parseFloat(f.amount_kd)||0),0);
  const rq=REQS.filter(r=>r.driver_id===id);
  const mt=MAINT.filter(m=>m.driver_id===id);
  const dlM=DAILY.filter(r=>r.driver_id===id&&String(r.report_date).startsWith(M));
  const dlOrders=dlM.reduce((s,r)=>s+(parseInt(r.orders_count)||0),0);
  const dlHours=dlM.reduce((s,r)=>s+(parseFloat(r.duty_hours)||0),0);
  const dlFlags=dlM.filter(r=>auditReport(r).some(f=>f.s==='high')).length;
  const schM=SCHED.filter(s=>s.driver_id===id&&String(s.date).startsWith(M)&&s.shift_type!=='off'&&s.shift_type!=='holiday');
  let onTime=0, late=0, absent=0;
  schM.forEach(s=>{
    if(!s.shift_start) return;
    if(s.date>T) return;
    const ci=firstClockIn(id,s.date);
    if(!ci){ absent++; return; }
    const lm=Math.round((ci-shiftDT(s.date,s.shift_start))/60000);
    if(lm>=CFG.grace) late++; else onTime++;
  });
  return {ph,phM,vio,vioSum,ded,dedM,dedSum,fu,fuM,fuSum,rq,mt,schM,onTime,late,absent,dlM,dlOrders,dlHours,dlFlags};
}

function dailyRange(){
  let f=document.getElementById('dlFrom').value;
  let to=document.getElementById('dlTo').value;
  if(!f||!to){
    const d=new Date(); const t2=d.toISOString().slice(0,10);
    d.setDate(d.getDate()-6); const f2=d.toISOString().slice(0,10);
    if(!f){ f=f2; document.getElementById('dlFrom').value=f2; }
    if(!to){ to=t2; document.getElementById('dlTo').value=t2; }
  }
  return {from:f, to:to};
}

function renderDaily(){
  const {from,to}=dailyRange();
  const view=document.getElementById('dlView').value;

  const parts=[...new Set(DRIVERS.map(d=>d.partner).filter(Boolean))];
  const ps=document.getElementById('dlPartner'), pc=ps.value;
  ps.innerHTML=`<option value="">${t('all_partners')}</option>`+parts.map(p=>`<option value="${p}">${p}</option>`).join('');
  ps.value=pc;
  const pf=ps.value;

  const drvOf=id=>DRIVERS.find(d=>d.id===id);
  let reps=DAILY.filter(r=>r.report_date>=from&&r.report_date<=to);
  if(pf) reps=reps.filter(r=>{const d=drvOf(r.driver_id); return d&&d.partner===pf;});

  const totOrders=reps.reduce((s,r)=>s+(parseInt(r.orders_count)||0),0);
  const flaggedCount=reps.filter(r=>auditReport(r).some(f=>f.s==='high')).length;

  let expected=0;
  const dset=new Set();
  for(let d=new Date(from); d<=new Date(to); d.setDate(d.getDate()+1)) dset.add(d.toISOString().slice(0,10));
  let drvList=DRIVERS; if(pf) drvList=DRIVERS.filter(d=>d.partner===pf);
  const today0=today();
  drvList.forEach(d=>{
    dset.forEach(ds=>{
      if(ds>today0) return;
      const sh=SCHED.find(s=>s.driver_id===d.id&&s.date===ds);
      if(sh&&sh.shift_type!=='off'&&sh.shift_type!=='holiday') expected++;
    });
  });
  const coverage=expected?Math.round(reps.length/expected*100):null;

  document.getElementById('kDaily').innerHTML=kpiHTML([
    {l:t('k_reports'),v:reps.length+(expected?' / '+expected:''),c:'var(--navy)'},
    {l:t('k_coverage'),v:coverage===null?'—':coverage+'%',c:coverage===null?'var(--muted)':(coverage>=90?'var(--green)':(coverage>=70?'var(--amber)':'var(--red)'))},
    {l:t('k_orders'),v:totOrders.toLocaleString(RTL()?'ar-KW':'en-US'),c:'var(--green)'},
    {l:t('k_flags'),v:flaggedCount,c:flaggedCount?'var(--red)':'var(--green)'},
  ]);
  setB('bDaily', flaggedCount);

  document.getElementById('dlAlert').innerHTML = flaggedCount
    ? `<div style="background:var(--red-bg);border:1px solid rgba(220,38,38,.35);border-radius:12px;padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:11px">
        <span style="font-size:22px">⚠️</span>
        <div style="flex:1"><b style="color:var(--red)">${flaggedCount} ${t('flag_banner')}</b>
        <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px">${t('flag_banner_s')}</div></div>
        <button class="btn" style="background:var(--red);color:#fff" onclick="document.getElementById('dlView').value='flagged';renderDaily()">${t('show_them')}</button></div>`
    : '';

  const T=document.getElementById('tDaily');
  const TT=document.getElementById('dlTitle');

  if(view==='missing'){
    TT.textContent=t('dl_missing_t');
    let rows=[];
    drvList.forEach(d=>{
      dset.forEach(ds=>{
        if(ds>today0) return;
        const sh=SCHED.find(s=>s.driver_id===d.id&&s.date===ds);
        if(!sh||sh.shift_type==='off'||sh.shift_type==='holiday') return;
        if(!reps.some(r=>r.driver_id===d.id&&r.report_date===ds)) rows.push({d,ds,sh});
      });
    });
    rows.sort((a,b)=>b.ds.localeCompare(a.ds));
    const H=[t('c_date'),t('c_driver'),t('c_partner'),t('c_shift'),t('c_clocked'),t('c_action')];
    T.innerHTML='<thead><tr>'+H.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
      (rows.length?rows.slice(0,200).map(x=>{
        const ci=firstClockIn(x.d.id,x.ds);
        return `<tr style="background:var(--red-bg)">
          <td>${fmtD(x.ds)}</td>${nmCell(x.d.id,x.d.name)}
          <td>${esc(x.d.partner||'—')}</td>
          <td>${x.sh.shift_start||''} - ${x.sh.shift_end||''}</td>
          <td>${ci?`<span class="st g">${t('yes')}</span>`:`<span class="st r">${t('no')}</span>`}</td>
          <td><button class="act" style="background:var(--purple);color:#fff" onclick="remindReport('${x.d.id}','${x.ds}')">${t('remind')}</button></td></tr>`;
      }).join('') : `<tr><td colspan="6" class="empty">${t('all_reports_in')}</td></tr>`)+'</tbody>';
    return;
  }

  if(view==='summary'){
    TT.textContent=t('dl_summary_t')+' ('+fmtD(from)+' → '+fmtD(to)+')';
    const by={};
    reps.forEach(r=>{
      if(!by[r.driver_id]) by[r.driver_id]={id:r.driver_id,name:r.driver_name,days:0,orders:0,hours:0,fuel:0,flags:0};
      const b=by[r.driver_id];
      b.days++; b.orders+=parseInt(r.orders_count)||0;
      b.hours+=parseFloat(r.duty_hours)||0; b.fuel+=parseFloat(r.fuel_amount)||0;
      if(auditReport(r).some(f=>f.s==='high')) b.flags++;
    });
    const list=Object.values(by).sort((a,b)=>b.orders-a.orders);
    const H=['#',t('c_driver'),t('c_partner'),t('c_days'),t('c_orders'),t('c_per_day'),t('c_hours'),t('c_per_hr'),t('c_fuel'),t('c_diffs')];
    T.innerHTML='<thead><tr>'+H.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
      (list.length?list.map((b,i)=>{
        const d=drvOf(b.id)||{};
        const perDay=b.days?(b.orders/b.days).toFixed(1):'—';
        const perHr=b.hours?(b.orders/b.hours).toFixed(1):'—';
        const medal=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
        return `<tr><td style="font-size:15px">${medal}</td>
          ${nmCell(b.id,b.name)}
          <td>${esc(d.partner||'—')}</td><td>${b.days}</td>
          <td><b style="color:var(--green)">${b.orders}</b></td>
          <td><b>${perDay}</b></td><td>${b.hours.toFixed(1)}</td><td>${perHr}</td>
          <td>${fmtKD(b.fuel)}</td>
          <td>${b.flags?`<span class="st r">${b.flags} ⚠️</span>`:`<span class="st g">${t('clean')}</span>`}</td></tr>`;
      }).join('') : `<tr><td colspan="10" class="empty">${t('no_reports')}</td></tr>`)+'</tbody>';
    return;
  }

  let list=reps.slice().sort((a,b)=>b.report_date.localeCompare(a.report_date));
  if(view==='flagged'){
    list=list.filter(r=>auditReport(r).some(f=>f.s==='high'));
    TT.textContent=t('dl_flagged_t');
  } else {
    TT.textContent=t('dl_title')+' ('+fmtD(from)+' → '+fmtD(to)+')';
  }

  const H=[t('c_date'),t('c_driver'),t('c_partner'),t('c_orders'),t('from').replace('📅 ','').replace(':',''),t('to').replace(':',''),
           t('c_rep_hrs'),t('c_act_hrs'),t('c_fuel'),t('c_card'),t('c_notes'),t('c_audit')];
  T.innerHTML='<thead><tr>'+H.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    (list.length?list.slice(0,400).map(r=>{
      const d=drvOf(r.driver_id)||{};
      const flags=auditReport(r);
      const hi=flags.some(f=>f.s==='high');
      const actH=actualHours(r.driver_id,r.report_date);
      const repHrs=parseFloat(r.duty_hours)||0;
      const hDiff=(actH!==null&&repHrs>0)?Math.abs(repHrs-actH):null;
      const hCol=hDiff===null?'var(--muted)':(hDiff>=2?'var(--red)':(hDiff>=1?'var(--amber)':'var(--green)'));
      return `<tr${hi?' style="background:var(--red-bg)"':''}>
        <td>${fmtD(r.report_date)}</td>${nmCell(r.driver_id,r.driver_name)}
        <td>${esc(d.partner||r.partner||'—')}</td>
        <td><b style="color:var(--green);font-size:14px">${r.orders_count||0}</b></td>
        <td>${r.duty_from||'—'}</td><td>${r.duty_to||'—'}</td>
        <td><b>${repHrs||'—'}</b></td>
        <td style="color:${hCol};font-weight:800">${actH===null?'—':actH}</td>
        <td>${r.fuel_amount?fmtKD(r.fuel_amount):'—'}</td>
        <td>${r.card_balance?fmtKD(r.card_balance):'—'}</td>
        <td style="max-width:180px;font-size:11px">${esc(r.notes||'')}</td>
        <td style="max-width:230px">${
          flags.length
            ? flags.map(f=>`<div style="font-size:10.5px;font-weight:800;color:${f.s==='high'?'var(--red)':'var(--amber)'};margin-bottom:2px">${f.s==='high'?'🔴':'🟡'} ${esc(f.m)}</div>`).join('')
            : `<span class="st g">${t('audited_ok')}</span>`
        }</td></tr>`;
    }).join('') : `<tr><td colspan="12" class="empty">${view==='flagged'?t('no_flags'):t('no_reports')}</td></tr>`)+'</tbody>';
}

async function remindReport(drvId, dateStr){
  const d=DRIVERS.find(x=>x.id===drvId);
  if(!confirm(t('confirm_remind', d?d.name:drvId, dateStr))) return;
  try{
    const {error}=await sb.from('messages').insert({
      recipient:drvId, level:'warn', title:t('rem_title'),
      body:t('rem_body', dateStr), created_at:new Date().toISOString()
    });
    if(error) throw error;
    toast(t('done_remind')); await loadAll();
  }catch(e){ toast(t('err')+': '+e.message,true); }
}

/* ═══════════ SETTINGS ═══════════ */
function openSet(){
  document.getElementById('setGrace').value=CFG.grace;
  document.getElementById('setFrac').value=String(CFG.fraction);
  document.getElementById('setPre').value=CFG.prealert;
  document.getElementById('setModal').style.display='flex';
}
function closeSet(){ document.getElementById('setModal').style.display='none'; }
async function saveSettings(){
  const g=parseInt(document.getElementById('setGrace').value,10)||30;
  const f=parseFloat(document.getElementById('setFrac').value)||0.5;
  const p=parseInt(document.getElementById('setPre').value,10)||30;
  try{
    const {error}=await sb.from('app_settings').upsert([
      {key:'late_grace_minutes',value:String(g),updated_at:new Date().toISOString()},
      {key:'late_deduct_fraction',value:String(f),updated_at:new Date().toISOString()},
      {key:'prealert_minutes',value:String(p),updated_at:new Date().toISOString()},
    ],{onConflict:'key'});
    if(error) throw error;
    CFG={grace:g,fraction:f,prealert:p};
    toast(t('done_settings')); closeSet(); await loadAll();
  }catch(e){ toast(t('err')+': '+e.message,true); }
}

/* ═══════════ EXPORTS ═══════════ */
const XH = k => t(k).replace(/[📅📌✍️👤⚡🔍]/g,'').trim();
function exportDrivers(){
  const rows=DRIVERS.map(d=>{
    const s=drvStats(d.id);
    const tot=s.onTime+s.late+s.absent;
    const o={};
    o[XH('c_code')]=d.id; o[XH('c_driver')]=d.name; o[XH('c_partner')]=d.partner||'';
    o[XH('c_car')]=d.car||''; o[XH('dm_nat')]=d.nationality||''; o[XH('dm_phone')]=d.sim||'';
    o[XH('dm_salary')]=d.salary_base||''; o[XH('dm_compliance')+' %']=tot?Math.round(s.onTime/tot*100):'';
    o[XH('dm_ontime')]=s.onTime; o[XH('dm_late')]=s.late; o[XH('dm_absent')]=s.absent;
    o[XH('c_mo_reports')]=s.dlM.length; o[XH('dm_orders')]=s.dlOrders; o[XH('dm_hours')]=s.dlHours.toFixed(1);
    o[XH('dm_flags')]=s.dlFlags; o[XH('c_violations')]=s.vio.length; o[XH('c_amount')]=s.vioSum.toFixed(3);
    o[XH('c_mo_ded')]=s.dedSum.toFixed(3); o[XH('dm_fuel_t')]=s.fuSum.toFixed(3);
    o[XH('t_photos')]=s.phM.length;
    return o;
  });
  download('drivers_'+today()+'.csv', toCSV(rows)); toast(t('done_export'));
}
function exportFuel(){
  const mo=document.getElementById('fuelMonth').value;
  let list=FUEL.slice();
  if(mo) list=list.filter(f=>String(f.log_date||'').startsWith(mo));
  const rows=list.map(f=>{
    const o={};
    o[XH('c_date')]=f.log_date; o[XH('c_driver')]=f.driver_name; o[XH('c_car')]=f.car_plate||'';
    o[XH('c_amount')]=f.amount_kd; o[XH('c_odo')]=f.odometer||''; o[XH('c_km_since')]=f.km_since_last||'';
    o[XH('c_km_kd')]=(f.km_since_last&&f.amount_kd)?(f.km_since_last/f.amount_kd).toFixed(1):'';
    o[XH('c_station')]=f.station||''; o[XH('k_susp')]=f.flagged?t('yes'):t('no');
    return o;
  });
  if(!rows.length){ toast(t('no_export'),true); return; }
  download('fuel_'+(mo||today())+'.csv', toCSV(rows)); toast(t('done_export'));
}
function exportShifts(){
  const date=document.getElementById('shiftDate').value||today();
  const daySched=SCHED.filter(s=>s.date===date);
  const byDrv={}; daySched.forEach(s=>byDrv[s.driver_id]=s);
  const rows=DRIVERS.map(d=>{
    const sh=byDrv[d.id];
    const ci=sh&&sh.shift_start?firstClockIn(d.id,date):null;
    const lm=(ci&&sh&&sh.shift_start)?Math.round((ci-shiftDT(date,sh.shift_start))/60000):'';
    const o={};
    o[XH('c_date')]=date; o[XH('c_driver')]=d.name; o[XH('c_partner')]=d.partner||'';
    o[XH('c_shift')]=sh?sh.shift_type:'—'; o[XH('c_start')]=sh?(sh.shift_start||''):''; o[XH('c_end')]=sh?(sh.shift_end||''):'';
    o[XH('c_clockin')]=ci?ci.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):t('st_noshow');
    o[XH('c_late_min')]=lm===''?'':lm;
    o[XH('c_status')]=!sh?t('st_none'):((sh.shift_type==='off'||sh.shift_type==='holiday')?t('st_off'):(ci?(lm>=CFG.grace?t('st_late'):t('st_ontime')):t('st_noshow')));
    return o;
  });
  download('shifts_'+date+'.csv', toCSV(rows)); toast(t('done_export'));
}
function exportDeductions(){
  const rows=DEDS.map(x=>{
    const o={};
    o[XH('c_date')]=x.date; o[XH('c_driver')]=x.driver_name; o[XH('c_type')]=x.ded_type||'manual';
    o[XH('c_amount')]=x.amount; o[XH('c_late_min')]=x.minutes_late||'';
    o[XH('c_reason')]=x.reason||''; o[XH('c_status')]=x.status==='cancelled'?t('st_cancelled'):t('st_active');
    return o;
  });
  if(!rows.length){ toast(t('no_export'),true); return; }
  download('deductions_'+today()+'.csv', toCSV(rows)); toast(t('done_export'));
}
function exportPhotos(){
  const date=document.getElementById('photoDate').value||today();
  const dayPhotos=PHOTOS.filter(p=>p.photo_date===date);
  const byId={}; dayPhotos.forEach(p=>byId[p.driver_id]=p);
  const rows=DRIVERS.map(d=>{
    const p=byId[d.id]; const o={};
    o[XH('c_date')]=date; o[XH('c_driver')]=d.name; o[XH('c_partner')]=d.partner||'';
    o[XH('k_uploaded')]=p?t('yes'):t('no');
    o[XH('c_time')]=p?new Date(p.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
    o[XH('c_status')]=p?(p.status==='approved'?t('s_approved'):(p.status==='rejected'?t('s_rejected'):t('s_pending'))):t('f_missing');
    o[XH('c_selfie')]=p?(p.selfie_url||''):''; o[XH('c_box')]=p?(p.box_url||''):'';
    return o;
  });
  download('shift_photos_'+date+'.csv', toCSV(rows)); toast(t('done_export'));
}
function exportDaily(){
  const {from,to}=dailyRange();
  const pf=document.getElementById('dlPartner').value;
  const drvOf=id=>DRIVERS.find(d=>d.id===id);
  let reps=DAILY.filter(r=>r.report_date>=from&&r.report_date<=to);
  if(pf) reps=reps.filter(r=>{const d=drvOf(r.driver_id); return d&&d.partner===pf;});
  if(!reps.length){ toast(t('no_export'),true); return; }
  const rows=reps.map(r=>{
    const d=drvOf(r.driver_id)||{};
    const actH=actualHours(r.driver_id,r.report_date);
    const actF=actualFuel(r.driver_id,r.report_date);
    const flags=auditReport(r); const o={};
    o[XH('c_date')]=r.report_date; o[XH('c_driver')]=r.driver_name; o[XH('c_partner')]=d.partner||r.partner||'';
    o[XH('c_orders')]=r.orders_count||0; o['From']=r.duty_from||''; o['To']=r.duty_to||'';
    o[XH('c_rep_hrs')]=r.duty_hours||0; o[XH('c_act_hrs')]=actH===null?'':actH;
    o[XH('c_diffs')]=(actH!==null&&r.duty_hours)?Math.abs(r.duty_hours-actH).toFixed(1):'';
    o[XH('c_fuel')]=r.fuel_amount||0; o[XH('c_receipt')]=actF===null?'':actF.toFixed(3);
    o[XH('c_card')]=r.card_balance||''; o[XH('c_notes')]=r.notes||'';
    o[XH('c_audit')]=flags.map(f=>f.m).join(' | ');
    return o;
  });
  download('daily_reports_'+from+'_'+to+'.csv', toCSV(rows)); toast(t('done_export'));
}

/* ═══════════ INIT ═══════════ */
window.addEventListener('DOMContentLoaded',async()=>{
  document.getElementById('shiftDate').value=today();
  document.getElementById('photoDate').value=today();
  document.getElementById('fuelMonth').value=today().slice(0,7);
  applyLang();
  renderTabs();
  setCloud('connecting',t('cl_connecting'));
  sb=supabase.createClient(SUPA_URL,SUPA_KEY);
  await loadAll();
  ['shift_photos','driver_requests','maintenance_reports','fuel_logs','driver_violations',
   'schedules','deductions','clockin','messages','daily_reports'].forEach(tb=>{
    sb.channel('adm_'+tb).on('postgres_changes',{event:'*',schema:'public',table:tb},()=>{
      clearTimeout(window._rt); window._rt=setTimeout(loadAll,600);
    }).subscribe();
  });
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&sb) loadAll(); });
</script>
