<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>السلاسل كونكت</title>
<meta name="description" content="منصة التواصل الداخلي لشركة السلاسل — قنوات، رسائل خاصة، ملفات، إعلانات ومكالمات">
<meta name="theme-color" content="#004e6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Connect">
<link rel="manifest" href="connect-manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ═════════════ TOKENS ═════════════ */
:root{
  --petrol:#004e6d; --crimson:#9a232e;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-d:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --rail:72px; --side:340px; --info:340px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root,[data-theme="light"]{
  --bg:#e9f0f3; --bg2:#dfe8ec; --panel:#ffffff; --panel2:#f4f8fa; --panel3:#eaf1f4;
  --line:#dce6eb; --line2:#c9d7de;
  --text:#0b2430; --text2:#33505c; --muted:#6a8591; --faint:#9db1ba;
  --brand:#004e6d; --brand2:#0a6d93; --brand-soft:#e1f0f6; --brand-ink:#ffffff;
  --accent:#9a232e; --accent-soft:#fbe9eb;
  --ok:#0f8a5f; --ok-soft:#e2f6ee; --warn:#b7791f; --warn-soft:#fdf3e1;
  --own1:#0b6d93; --own2:#004e6d; --own-ink:#ffffff; --own-sub:rgba(255,255,255,.72);
  --other:#ffffff; --other-ink:#0b2430; --other-line:#e1e9ed;
  --chat-bg:#eef4f6; --pattern:rgba(0,78,109,.045);
  --shadow:0 1px 2px rgba(8,35,48,.06),0 8px 24px rgba(8,35,48,.08);
  --shadow-lg:0 20px 60px rgba(8,35,48,.18),0 4px 14px rgba(8,35,48,.08);
  --rail-bg:#003a52; --rail-ink:#bfe0ec; --rail-active:#ffffff;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#05141b; --bg2:#071b24; --panel:#0a1f29; --panel2:#0d2733; --panel3:#11303e;
  --line:rgba(157,189,201,.12); --line2:rgba(157,189,201,.2);
  --text:#e4f0f4; --text2:#bcd3dc; --muted:#87a7b3; --faint:#5d7b87;
  --brand:#2a9ccb; --brand2:#4bb6e0; --brand-soft:rgba(42,156,203,.14); --brand-ink:#ffffff;
  --accent:#ff5c68; --accent-soft:rgba(255,92,104,.13);
  --ok:#34c78f; --ok-soft:rgba(52,199,143,.13); --warn:#f0b54a; --warn-soft:rgba(240,181,74,.12);
  --own1:#0d6a8f; --own2:#00435e; --own-ink:#ffffff; --own-sub:rgba(255,255,255,.66);
  --other:#112f3c; --other-ink:#e4f0f4; --other-line:rgba(157,189,201,.1);
  --chat-bg:#061922; --pattern:rgba(127,199,227,.035);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 24px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.3);
  --rail-bg:#031017; --rail-ink:#7fa8b8; --rail-active:#ffffff;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand2)}
img,video{display:block;max-width:100%}
svg{flex-shrink:0}
::selection{background:var(--brand);color:#fff}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ═════════════ BUTTONS / INPUTS ═════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r);
  font-weight:600;font-size:14.5px;transition:transform .15s var(--ease),background .2s,box-shadow .2s,opacity .2s;white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 6px 18px rgba(0,78,109,.28)}
.btn-primary:hover{box-shadow:0 8px 24px rgba(0,78,109,.38)}
.btn-danger{background:linear-gradient(135deg,#c23542,var(--crimson));color:#fff;box-shadow:0 6px 18px rgba(154,35,46,.28)}
.btn-ghost{background:var(--panel2);color:var(--text)}
.btn-ghost:hover{background:var(--panel3)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin{width:18px;height:18px}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--text2);transition:background .15s,color .15s,transform .15s var(--ease);position:relative}
.ibtn:hover{background:var(--panel3);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn.sm{width:32px;height:32px;border-radius:9px}
.ibtn.on{color:var(--brand2);background:var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text2)}
.input,.select,.textarea{width:100%;height:46px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--panel2);padding:0 14px;
  outline:none;transition:border .2s,box-shadow .2s,background .2s;font-size:15px}
.textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 4px var(--brand-soft);background:var(--panel)}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all .18s var(--ease)}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;
  display:inline-grid;place-items:center;line-height:1;animation:pop .35s var(--spring)}
.badge.red{background:var(--accent)}
.badge.gray{background:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand2)}
.tag.red{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line2);transition:background .2s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(-18px)}
[dir="ltr"] .switch.on::after{transform:translateX(18px)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite;opacity:.8}

/* ═════════════ AVATAR ═════════════ */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;flex-shrink:0;position:relative;display:grid;place-items:center;
  font-weight:700;font-size:calc(var(--s)*.38);color:#fff;background:var(--c,#0a6d93);user-select:none}
.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.av.sq{border-radius:30%}
.av .dot{position:absolute;bottom:0;inset-inline-end:0;width:calc(var(--s)*.3);height:calc(var(--s)*.3);min-width:10px;min-height:10px;border-radius:50%;
  background:var(--faint);border:2.5px solid var(--panel);transition:background .3s}
.av .dot.on{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse-dot 2.4s infinite}
.av.emoji{background:var(--panel3);font-size:calc(var(--s)*.5)}
.av-stack{display:flex}
.av-stack .av{border:2px solid var(--panel);margin-inline-start:-10px}
.av-stack .av:first-child{margin-inline-start:0}

/* ═════════════ AUTH ═════════════ */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;background:#021118;z-index:50}
.auth-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.auth-bg .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 18s ease-in-out infinite}
.auth-bg .b1{width:520px;height:520px;background:#004e6d;top:-120px;inset-inline-start:-80px}
.auth-bg .b2{width:420px;height:420px;background:#9a232e;bottom:-140px;inset-inline-end:-60px;animation-delay:-6s;opacity:.55}
.auth-bg .b3{width:360px;height:360px;background:#0a8bb8;top:40%;inset-inline-start:45%;animation-delay:-12s;opacity:.4}
.auth-bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(127,199,227,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,199,227,.06) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.auth-wrap{position:relative;width:100%;max-width:980px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.auth-hero{color:#e4f0f4;padding:10px}
.auth-hero .logo{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo-mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(140deg,#0a8bb8,#004e6d 55%,#00334a);display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(0,78,109,.5),inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden}
.logo-mark::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#ff5c68;bottom:7px;inset-inline-end:7px;box-shadow:0 0 0 3px #00334a}
.logo-mark svg{width:30px;height:30px;color:#fff}
.auth-hero h1{font-family:var(--font-d);font-size:40px;line-height:1.25;font-weight:800;letter-spacing:-.5px}
.auth-hero h1 em{font-style:normal;background:linear-gradient(90deg,#7fc7e3,#ff8f98);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-hero p{color:#9dbdc9;font-size:16.5px;margin-top:14px;max-width:440px}
.auth-feats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.auth-feat{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(127,199,227,.12);
  font-size:14px;color:#cfe4ec;backdrop-filter:blur(8px);animation:rise .6s var(--ease) both}
.auth-feat svg{width:20px;height:20px;color:#7fc7e3}
.auth-card{background:rgba(10,31,41,.72);border:1px solid rgba(127,199,227,.16);border-radius:26px;padding:30px;backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 30px 80px rgba(0,0,0,.5);color:#e4f0f4;animation:rise .7s var(--ease) both}
.auth-card .input,.auth-card .select{background:rgba(255,255,255,.05);border-color:rgba(127,199,227,.18);color:#e4f0f4}
.auth-card .input:focus,.auth-card .select:focus{background:rgba(255,255,255,.08);border-color:#4bb6e0;box-shadow:0 0 0 4px rgba(75,182,224,.15)}
.auth-card .select option{background:#0a1f29}
.auth-card .field label{color:#9dbdc9}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.05);border-radius:14px;padding:4px;margin-bottom:22px;position:relative}
.seg button{height:40px;border-radius:11px;font-weight:600;color:#9dbdc9;position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:11px;background:linear-gradient(135deg,#0a6d93,#004e6d);
  transition:inset-inline-start .35s var(--spring);inset-inline-start:4px;box-shadow:0 4px 14px rgba(0,78,109,.5)}
.seg.second .pill{inset-inline-start:calc(50%)}
.auth-form{display:grid;gap:14px}
.auth-form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-err{background:rgba(255,92,104,.12);color:#ff9aa2;border:1px solid rgba(255,92,104,.25);padding:10px 14px;border-radius:12px;font-size:13.5px;animation:shake .4s}
.auth-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;color:#87a7b3}
.auth-foot button{color:#7fc7e3;font-weight:600}
.pw-wrap{position:relative}
.pw-wrap .ibtn{position:absolute;inset-inline-end:4px;top:3px;color:#87a7b3}
.pending-card{text-align:center;max-width:440px;margin:auto}
.hourglass{width:96px;height:96px;margin:0 auto 22px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(10,139,184,.25),rgba(0,78,109,.25));
  border:1px solid rgba(127,199,227,.2);position:relative}
.hourglass svg{width:44px;height:44px;color:#7fc7e3;animation:flip 2.6s var(--ease) infinite}
.hourglass::before,.hourglass::after{content:'';position:absolute;inset:-8px;border-radius:36px;border:1.5px solid rgba(127,199,227,.25);animation:ripple 2.6s infinite}
.hourglass::after{animation-delay:1.3s}

/* ═════════════ APP SHELL ═════════════ */
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) var(--side) 1fr;grid-template-rows:minmax(0,1fr);background:var(--bg)}
#app>*{min-height:0}
#app.info-open{grid-template-columns:var(--rail) var(--side) 1fr var(--info)}
.rail{background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;padding:14px 0 calc(14px + var(--safe-b));gap:6px;position:relative;z-index:3}
.rail .logo-mark{width:44px;height:44px;border-radius:14px;margin-bottom:14px;cursor:pointer}
.rail .logo-mark svg{width:24px;height:24px}
.rail .logo-mark::after{width:11px;height:11px;bottom:6px;inset-inline-end:6px;box-shadow:0 0 0 2px #00334a}
.rail-btn{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--rail-ink);position:relative;transition:all .2s var(--ease)}
.rail-btn svg{width:23px;height:23px}
.rail-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.rail-btn.on{background:rgba(255,255,255,.12);color:var(--rail-active)}
.rail-btn.on::before{content:'';position:absolute;inset-inline-start:-10px;top:14px;bottom:14px;width:4px;border-radius:4px;background:#ff5c68;animation:grow-y .3s var(--spring)}
.rail-btn .badge{position:absolute;top:4px;inset-inline-end:2px;border:2px solid var(--rail-bg);height:20px}
.rail-btn .tip{position:absolute;inset-inline-start:62px;background:#0b2430;color:#fff;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;
  pointer-events:none;opacity:0;transform:translateX(6px);transition:all .18s;box-shadow:var(--shadow)}
[dir="ltr"] .rail-btn .tip{transform:translateX(-6px)}
.rail-btn:hover .tip{opacity:1;transform:none}
.rail-sp{flex:1}
.rail .me{cursor:pointer;margin-top:6px;border-radius:50%;transition:transform .2s var(--spring)}
.rail .me:hover{transform:scale(1.07)}
.rail .me .dot{border-color:var(--rail-bg)}

/* sidebar */
.side{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:relative;z-index:2}
.side-h{padding:18px 18px 10px;display:flex;align-items:center;gap:8px}
.side-h h2{font-family:var(--font-d);font-size:21px;font-weight:700;flex:1;letter-spacing:-.2px}
.search{position:relative;margin:4px 16px 10px}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid transparent;background:var(--panel2);padding-inline:40px 12px;outline:none;font-size:14.5px;transition:all .2s}
.search input:focus{border-color:var(--brand2);background:var(--panel);box-shadow:0 0 0 4px var(--brand-soft)}
.filters{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.side-list{flex:1;padding:4px 8px 16px}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);padding:14px 12px 6px;display:flex;align-items:center;gap:6px;letter-spacing:.2px;text-transform:uppercase}
.sec-t button{margin-inline-start:auto;color:var(--muted)}
.ci{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:14px;cursor:pointer;position:relative;transition:background .15s;
  animation:rise .35s var(--ease) both}
.ci:hover{background:var(--panel2)}
.ci.on{background:var(--brand-soft)}
.ci.on::before{content:'';position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--brand2)}
.ci .meta{flex:1;min-width:0}
.ci .l1{display:flex;align-items:center;gap:6px}
.ci .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ci .tm{font-size:11.5px;color:var(--muted);flex-shrink:0}
.ci .l2{display:flex;align-items:center;gap:6px;margin-top:2px}
.ci .pv{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ci.unread .nm{font-weight:700}
.ci.unread .pv{color:var(--text2);font-weight:500}
.ci.unread .tm{color:var(--brand2);font-weight:600}
.ci .typing-pv{color:var(--ok);font-weight:600}
.ci .ico-s{width:15px;height:15px;color:var(--faint)}
.ci .mention-dot{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.notif-card{margin:6px 16px 4px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#00334a);color:#fff;display:flex;gap:12px;align-items:center;
  animation:rise .5s var(--ease) both;box-shadow:0 10px 24px rgba(0,78,109,.25)}
.notif-card .bell{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;animation:ring 2.5s infinite}
.notif-card b{font-size:14px;display:block}
.notif-card span{font-size:12.5px;opacity:.8}
.notif-card .btn{height:32px;background:#fff;color:var(--petrol);padding:0 12px;font-size:13px}
.empty{padding:50px 24px;text-align:center;color:var(--muted)}
.empty .art{width:120px;height:120px;margin:0 auto 18px;border-radius:40px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand2);position:relative}
.empty .art svg{width:52px;height:52px}
.empty h3{color:var(--text);font-family:var(--font-d);font-size:19px;margin-bottom:6px}
.fab{display:none;position:absolute;bottom:calc(20px + var(--safe-b));inset-inline-end:20px;width:56px;height:56px;border-radius:18px;
  background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;place-items:center;box-shadow:0 12px 28px rgba(0,78,109,.4);
  transition:transform .2s var(--spring);z-index:5}
.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab svg{width:26px;height:26px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;background:var(--chat-bg);position:relative;overflow:hidden}
.main::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:1;
  background-image:radial-gradient(var(--pattern) 1.2px,transparent 1.2px);background-size:22px 22px}
.chat-h{height:68px;padding:0 16px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:4;flex-shrink:0;padding-top:0}
.chat-h .back{display:none}
.chat-h .ttl{flex:1;min-width:0;cursor:pointer}
.chat-h .ttl b{display:block;unicode-bidi:plaintext;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h .ttl span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.chat-h .ttl span.typing{color:var(--ok);font-weight:600}
.chat-h .acts{display:flex;gap:2px}
.pin-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;position:relative;z-index:3;
  animation:slide-down .3s var(--ease)}
.pin-bar svg{width:16px;height:16px;color:var(--brand2)}
.pin-bar .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.msgs{flex:1;min-height:0;padding:16px 0 8px;position:relative;z-index:1;display:flex;flex-direction:column}
.msgs-in{max-width:880px;width:100%;margin:0 auto;padding:0 18px;display:flex;flex-direction:column}
.welcome{margin:30px auto 20px;text-align:center;max-width:420px;animation:rise .6s var(--ease)}
.welcome .av{margin:0 auto 14px}
.welcome h3{font-family:var(--font-d);font-size:20px}
.welcome p{color:var(--muted);font-size:14px;margin-top:4px}
.day{align-self:center;margin:16px 0 10px;font-size:12px;font-weight:600;color:var(--text2);background:color-mix(in srgb,var(--panel) 85%,transparent);
  padding:5px 14px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.06);backdrop-filter:blur(6px);position:sticky;top:6px;z-index:2}
.new-div{display:flex;align-items:center;gap:12px;margin:12px 0;color:var(--accent);font-size:12px;font-weight:700}
.new-div::before,.new-div::after{content:'';flex:1;height:1px;background:var(--accent);opacity:.4}
.sys{align-self:center;font-size:12.5px;color:var(--muted);margin:8px 0;padding:4px 12px;border-radius:8px;background:color-mix(in srgb,var(--panel) 60%,transparent);text-align:center}

/* message */
.m{display:flex;gap:8px;align-items:flex-end;margin-top:2px;position:relative;max-width:100%}
.m.first{margin-top:12px}
.m.own{flex-direction:row-reverse}
.m .av{--s:34px;align-self:flex-end;visibility:hidden}
.m.last .av{visibility:visible}
.m.own .av{display:none}
.m.anim{animation:msg-in .38s var(--spring) both}
.m.own.anim{animation-name:msg-in-own}
.m .col{display:flex;flex-direction:column;max-width:min(76%,620px);min-width:0;align-items:flex-start}
.m.own .col{align-items:flex-end}
.m .who{font-size:12.5px;font-weight:700;margin:0 12px 3px;display:flex;gap:6px;align-items:center}
.m .who .role{font-weight:500;color:var(--muted);font-size:11.5px}
.bub{position:relative;background:var(--other);color:var(--other-ink);border:1px solid var(--other-line);padding:8px 12px 6px;border-radius:18px;
  box-shadow:0 1px 1.5px rgba(0,0,0,.05);max-width:100%;word-wrap:break-word;overflow-wrap:anywhere;transition:box-shadow .2s, transform .2s}
.m.own .bub{background:linear-gradient(160deg,var(--own1),var(--own2));color:var(--own-ink);border-color:transparent}
.m:not(.own).last .bub{border-end-start-radius:6px}
.m.own.last .bub{border-end-end-radius:6px}
.m.flash .bub{animation:flash 1.4s var(--ease)}
.bub .txt{white-space:pre-wrap;font-size:15px;line-height:1.55}
.bub .txt.big{font-size:38px;line-height:1.2}
.bub .txt a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.m:not(.own) .bub .txt a{color:var(--brand2)}
.bub .txt code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:rgba(127,127,127,.16);padding:1px 5px;border-radius:5px}
.bub .mention{font-weight:700;color:var(--brand2);background:var(--brand-soft);padding:0 4px;border-radius:5px}
.m.own .bub .mention{color:#fff;background:rgba(255,255,255,.18)}
.bub .mention.me{background:var(--accent-soft);color:var(--accent)}
.bub .foot{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:2px;float:inline-end;margin-inline-start:12px;position:relative;top:4px;user-select:none}
.m.own .bub .foot{color:var(--own-sub)}
.bub .foot svg{width:16px;height:16px}
.bub .foot .read{color:#7fe0ff}
.bub .foot .fail{color:var(--accent)}
.bub::after{content:'';display:block;clear:both}
.bub.media-only{padding:4px;background:var(--other)}
.m.own .bub.media-only{background:var(--own2)}
.bub.media-only .foot{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(0,0,0,.5);color:#fff;padding:2px 8px;border-radius:10px;top:auto;margin:0;backdrop-filter:blur(6px)}
.bub.deleted{font-style:italic;color:var(--muted);background:transparent;border:1px dashed var(--line2)}
.m.own .bub.deleted{background:transparent;color:var(--muted)}
.edited{font-style:italic;opacity:.8}
.quote{display:flex;gap:8px;padding:6px 10px;border-radius:10px;margin:2px -4px 6px;background:rgba(127,127,127,.1);border-inline-start:3px solid var(--brand2);cursor:pointer;font-size:13px;max-width:100%}
.m.own .quote{background:rgba(255,255,255,.12);border-color:#7fe0ff}
.quote b{display:block;font-size:12.5px;color:var(--brand2)}
.m.own .quote b{color:#bdeeff}
.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:-6px;padding:0 8px;position:relative;z-index:1}
.react{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .15s var(--spring);animation:pop .35s var(--spring)}
.react b{font-size:12px;font-weight:600;color:var(--text2)}
.react.mine{background:var(--brand-soft);border-color:var(--brand2)}
.react:hover{transform:scale(1.08)}
.hover-bar{position:absolute;top:-18px;inset-inline-end:8px;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(4px) scale(.96);transition:all .15s var(--ease);z-index:5}
.m.own .hover-bar{inset-inline-end:auto;inset-inline-start:8px}
.m:hover .hover-bar{opacity:1;pointer-events:auto;transform:none}
.hover-bar .ibtn{width:32px;height:32px;border-radius:9px}
.hover-bar .ibtn svg{width:17px;height:17px}
.hover-bar .q{font-size:17px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;transition:transform .15s var(--spring)}
.hover-bar .q:hover{transform:scale(1.3);background:var(--panel2)}
@media (hover:none){.hover-bar{display:none}}

/* announcement */
.ann{width:min(560px,100%);border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:rise .4s var(--ease) both;margin-top:12px}
.m.own .ann{align-self:flex-end}
.ann-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,var(--brand),#00334a);color:#fff}
.ann.important .ann-h{background:linear-gradient(135deg,#c48a1b,#8a5a00)}
.ann.urgent .ann-h{background:linear-gradient(135deg,#c23542,#7a1620)}
.ann-h svg{width:20px;height:20px}
.ann-h b{flex:1;font-size:14px}
.ann-h small{opacity:.8;font-size:12px}
.ann-b{padding:14px 16px 6px}
.ann-b .who{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.ann-b .who .av{--s:30px;visibility:visible!important;display:grid!important}
.ann-b .txt{font-size:15.5px;white-space:pre-wrap;line-height:1.7}
.ann-f{display:flex;align-items:center;gap:10px;padding:10px 16px 14px;flex-wrap:wrap}
.ack-prog{flex:1;min-width:150px;cursor:pointer}
.ack-prog .bar{height:6px;border-radius:6px;background:var(--panel3);overflow:hidden;margin-top:6px}
.ack-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5be0ac);border-radius:6px;transition:width .8s var(--ease)}
.ack-prog small{font-size:12px;color:var(--muted)}
.acked{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;font-size:13.5px}
.acked svg{width:18px;height:18px}

/* attachments */
.gal{display:grid;gap:3px;border-radius:14px;overflow:hidden;max-width:min(420px,100%);width:420px}
.gal.n1{grid-template-columns:1fr;width:auto}
.gal.n2{grid-template-columns:1fr 1fr}
.gal.n3{grid-template-columns:1fr 1fr}
.gal.n3 .gi:first-child{grid-column:span 2}
.gal.n4,.gal.nN{grid-template-columns:1fr 1fr}
.gi{position:relative;background:var(--panel3);overflow:hidden;cursor:zoom-in;aspect-ratio:1;min-height:80px}
.gal.n1 .gi{aspect-ratio:auto;max-height:420px}
.gal.n1 .gi img{max-height:420px;width:auto;max-width:100%;min-width:160px}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease),opacity .3s;opacity:0}
.gi img.ld,.gi video.ld{opacity:1}
.gi:hover img{transform:scale(1.03)}
.gi .more{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;backdrop-filter:blur(2px)}
.gi .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.gi .play span{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.gi .play svg{width:24px;height:24px;margin-inline-start:3px}
.gi .dur{position:absolute;bottom:8px;inset-inline-start:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:6px}
.shimmer{background:linear-gradient(100deg,var(--panel3) 30%,var(--panel2) 50%,var(--panel3) 70%);background-size:300% 100%;animation:shimmer 1.4s infinite}
.file{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(127,127,127,.08);min-width:240px;max-width:360px;margin:2px 0 4px;
  border:1px solid rgba(127,127,127,.12);transition:background .15s;cursor:pointer;text-decoration:none;color:inherit}
.file:hover{background:rgba(127,127,127,.14)}
.m.own .file{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}
.fi{width:44px;height:50px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;position:relative;flex-shrink:0;letter-spacing:.3px;
  background:var(--fc,#5f7b87);clip-path:polygon(0 0,70% 0,100% 24%,100% 100%,0 100%)}
.fi::after{content:'';position:absolute;top:0;right:0;width:30%;height:24%;background:rgba(255,255,255,.35);clip-path:polygon(0 0,100% 100%,0 100%)}
[dir="rtl"] .fi{clip-path:polygon(0 0,70% 0,100% 24%,100% 100%,0 100%)}
.file .fn{unicode-bidi:plaintext;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fs{font-size:12px;opacity:.7}
.file .dl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.15);flex-shrink:0}
.file .dl svg{width:18px;height:18px}
.voice{display:flex;align-items:center;gap:10px;min-width:240px;max-width:320px;padding:4px 0 2px}
.voice .pp{width:42px;height:42px;border-radius:50%;background:var(--brand2);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .15s var(--spring)}
.m.own .voice .pp{background:#fff;color:var(--own2)}
.voice .pp:active{transform:scale(.9)}
.voice .pp svg{width:20px;height:20px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:34px;cursor:pointer;direction:ltr}
.wave i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3;transition:opacity .15s,transform .15s}
.wave i.p{opacity:1}
.voice .vt{direction:ltr;font-size:11.5px;opacity:.75;display:flex;justify-content:space-between;margin-top:-2px}
.voice .spd{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(127,127,127,.18);flex-shrink:0}
.callmsg{display:flex;align-items:center;gap:10px;padding:2px 0}
.callmsg .ci2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.m.own .callmsg .ci2{background:rgba(255,255,255,.16);color:#fff}
.callmsg .ci2.miss{background:var(--accent-soft);color:var(--accent)}
.callmsg .ci2 svg{width:19px;height:19px}

/* composer */
.composer{position:relative;z-index:4;padding:8px 16px calc(12px + var(--safe-b));flex-shrink:0}
.composer-in{max-width:880px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:border .2s,box-shadow .2s;overflow:hidden}
.composer-in:focus-within{border-color:color-mix(in srgb,var(--brand2) 50%,var(--line))}
.cmp-reply{display:flex;align-items:center;gap:10px;padding:10px 14px 0;animation:slide-up .25s var(--ease)}
.cmp-reply .quote{flex:1;margin:0;min-width:0}
.cmp-files{display:flex;gap:8px;padding:12px 12px 0;overflow-x:auto}
.cf{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--panel3);flex-shrink:0;animation:pop .3s var(--spring);display:grid;place-items:center}
.cf img,.cf video{width:100%;height:100%;object-fit:cover}
.cf .fi{width:34px;height:40px;font-size:9px}
.cf .x{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.cf .x svg{width:14px;height:14px}
.cf .nm{position:absolute;bottom:0;inset-inline:0;font-size:10px;padding:2px 5px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf .prog{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center}
.ring{width:42px;height:42px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .2s}
.cmp-opts{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap;align-items:center;animation:slide-up .25s var(--ease)}
.cmp-row{display:flex;align-items:flex-end;gap:4px;padding:6px}
.cmp-row textarea{flex:1;border:0;outline:0;background:transparent;resize:none;padding:10px 8px;max-height:180px;min-height:44px;font-size:15.5px;line-height:1.5}
.cmp-row textarea::placeholder{color:var(--faint)}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand2),var(--brand));
  box-shadow:0 6px 16px rgba(0,78,109,.35);transition:transform .25s var(--spring),box-shadow .2s;flex-shrink:0}
.send:active{transform:scale(.88)}
.send svg{width:21px;height:21px;transition:transform .3s var(--spring)}
[dir="rtl"] .send .i-send{transform:scaleX(-1)}
.send.mic{background:var(--panel3);color:var(--text2);box-shadow:none}
.send.mic:hover{color:var(--brand2)}
.readonly-bar{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:18px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);font-size:14px}
.readonly-bar svg{width:18px;height:18px}
.rec{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 12px;animation:slide-up .25s var(--ease)}
.rec .dotrec{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.rec .tm{font-variant-numeric:tabular-nums;font-weight:600;min-width:48px}
.rec .live{flex:1;display:flex;align-items:center;gap:2px;height:36px;overflow:hidden;direction:ltr;justify-content:flex-end}
.rec .live i{width:3px;border-radius:3px;background:var(--brand2);flex-shrink:0;animation:pop .2s}
.drop{position:absolute;inset:12px;border-radius:24px;border:2.5px dashed var(--brand2);background:color-mix(in srgb,var(--brand-soft) 80%,var(--panel));
  z-index:20;display:grid;place-items:center;text-align:center;color:var(--brand2);font-weight:700;font-size:18px;animation:fade .2s}
.drop svg{width:56px;height:56px;margin:0 auto 10px;animation:bob 1.4s ease-in-out infinite}
.typing-ind{display:flex;align-items:center;gap:8px;padding:2px 22px 0;height:22px;font-size:12.5px;color:var(--muted);max-width:880px;margin:0 auto;width:100%}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand2);animation:typing 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.jump{position:absolute;bottom:96px;inset-inline-end:24px;width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;
  color:var(--text2);z-index:6;animation:pop .3s var(--spring);border:1px solid var(--line)}
.jump .badge{position:absolute;top:-6px;inset-inline-end:-4px}
.mention-pop{position:absolute;bottom:100%;inset-inline:16px;max-width:400px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);
  padding:6px;z-index:30;animation:slide-up .2s var(--ease);max-height:280px}
.mention-pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.mention-pop .it.on,.mention-pop .it:hover{background:var(--brand-soft)}
.mention-pop .it .av{--s:30px}

/* main empty */
.main-empty{flex:1;display:grid;place-items:center;text-align:center;position:relative;z-index:1;padding:30px}
.main-empty .hero-art{width:220px;height:180px;margin:0 auto 24px;position:relative}
.main-empty h2{font-family:var(--font-d);font-size:26px;margin-bottom:8px}
.main-empty p{color:var(--muted);max-width:380px;margin:0 auto}
.kb{display:flex;gap:8px;justify-content:center;margin-top:20px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.kb kbd{font-family:inherit;background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;padding:2px 8px;border-radius:6px;font-size:12px}

/* info panel */
.info{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-width:0;animation:slide-in-side .3s var(--ease)}
.info-h{height:68px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.info-h b{flex:1;font-size:16px}
.info-body{flex:1;padding-bottom:24px}
.info-top{text-align:center;padding:26px 20px 18px;border-bottom:1px solid var(--line)}
.info-top .av{margin:0 auto 12px}
.info-top h3{font-family:var(--font-d);font-size:19px}
.info-top p{color:var(--muted);font-size:13.5px;margin-top:4px}
.info-acts{display:flex;justify-content:center;gap:10px;margin-top:16px}
.info-acts button{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;padding:10px 4px;border-radius:14px;background:var(--panel2);font-size:12px;font-weight:600;color:var(--text2);transition:all .15s}
.info-acts button:hover{background:var(--brand-soft);color:var(--brand2)}
.info-acts svg{width:20px;height:20px}
.info-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.info-sec h4{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.info-sec h4 button{margin-inline-start:auto;font-size:12.5px;color:var(--brand2);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.media-grid .gi{aspect-ratio:1;border-radius:8px}
.mem{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;cursor:pointer}
.mem:hover{background:var(--panel2)}
.mem .av{--s:36px}
.mem b{font-size:14px;font-weight:600;display:block}
.mem small{font-size:12px;color:var(--muted)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;border-radius:10px}
.set-row:hover{background:var(--panel2)}
.set-row .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--text2)}
.set-row .ico svg{width:18px;height:18px}
.set-row.danger{color:var(--accent)}
.set-row.danger .ico{background:var(--accent-soft);color:var(--accent)}

/* pages (directory/admin/calls) */
.page{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1;background:var(--chat-bg)}
.page-h{padding:22px 28px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-h h1{font-family:var(--font-d);font-size:26px;flex:1}
.page-b{flex:1;padding:8px 28px 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;transition:transform .2s var(--ease),box-shadow .2s;cursor:pointer;
  animation:rise .4s var(--ease) both;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;inset-inline:0;height:56px;background:linear-gradient(135deg,var(--c,var(--brand)),transparent);opacity:.18}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard .av{margin:0 auto 12px;--s:68px}
.pcard b{display:block;font-size:15.5px}
.pcard small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pcard .acts{display:flex;gap:6px;justify-content:center;margin-top:14px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;animation:rise .4s var(--ease) both}
.stat small{color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-size:28px;font-family:var(--font-d);margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:18px;overflow:hidden;animation:rise .4s var(--ease) both}
.panel-h{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px;flex:1}
.trow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trow:last-child{border-bottom:0}
.trow .av{--s:40px}
.trow .who{flex:1;min-width:160px}
.trow .who b{display:block;font-size:14.5px}
.trow .who small{color:var(--muted);font-size:12.5px}
.trow .select{height:36px;width:auto;font-size:13px;padding:0 10px;border-radius:10px}
.code-box{display:flex;align-items:center;gap:12px;padding:18px;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,monospace;font-size:28px;font-weight:700;letter-spacing:6px;padding:10px 18px;border-radius:14px;background:var(--brand-soft);color:var(--brand2);direction:ltr}
.call-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.call-row:hover{background:var(--panel2)}
.call-row .ic{width:20px;height:20px}
.call-row .ic.miss{color:var(--accent)}.call-row .ic.ok{color:var(--ok)}

/* ═════════════ OVERLAYS ═════════════ */
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,12,17,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
.ov.closing{animation:fade .2s reverse forwards}
.modal{width:100%;max-width:480px;max-height:min(88vh,800px);background:var(--panel);border-radius:26px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  animation:modal-in .35s var(--spring);overflow:hidden;border:1px solid var(--line)}
.ov.closing .modal{animation:modal-out .2s var(--ease) forwards}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.modal-h h3{flex:1;font-family:var(--font-d);font-size:19px}
.modal-b{padding:6px 20px 20px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:10px;padding:14px 20px 20px;border-top:1px solid var(--line)}
.modal-f .btn{flex:1}
.pick-list{max-height:300px;margin-top:8px}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;cursor:pointer;transition:background .15s}
.pick:hover{background:var(--panel2)}
.pick .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;transition:all .2s var(--spring);color:#fff}
.pick.on .chk{background:var(--brand2);border-color:var(--brand2);transform:scale(1.05)}
.pick .chk svg{width:15px;height:15px;opacity:0;transform:scale(.4);transition:all .2s var(--spring)}
.pick.on .chk svg{opacity:1;transform:none}
.pick .av{--s:38px}
.sel-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.sel-chips .chip{background:var(--brand-soft);color:var(--brand2);border-color:transparent;animation:pop .25s var(--spring)}
.kind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kind{padding:14px 10px;border-radius:16px;border:2px solid var(--line);text-align:center;cursor:pointer;transition:all .2s var(--ease)}
.kind svg{width:26px;height:26px;color:var(--brand2);margin:0 auto 6px}
.kind b{display:block;font-size:14px}
.kind small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.kind.on{border-color:var(--brand2);background:var(--brand-soft);transform:translateY(-2px)}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-row button{width:40px;height:40px;border-radius:12px;font-size:21px;background:var(--panel2);transition:all .15s var(--spring)}
.emoji-row button.on{background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand2);transform:scale(1.08)}
.color-row{display:flex;gap:8px}
.color-row button{width:30px;height:30px;border-radius:50%;background:var(--c);transition:transform .2s var(--spring)}
.color-row button.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--c);transform:scale(1.1)}

/* popover / menu / sheet */
.pop{position:fixed;z-index:120;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;min-width:200px;animation:pop-in .2s var(--spring);transform-origin:var(--ox,50%) var(--oy,0)}
.menu-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;width:100%;text-align:start}
.menu-it:hover{background:var(--panel2)}
.menu-it svg{width:18px;height:18px;color:var(--text2)}
.menu-it.danger,.menu-it.danger svg{color:var(--accent)}
.menu-sep{height:1px;background:var(--line);margin:4px 6px}
.quick-react{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.quick-react button{font-size:24px;width:42px;height:42px;border-radius:12px;transition:transform .15s var(--spring)}
.quick-react button:hover{transform:scale(1.25);background:var(--panel2)}
.emoji-pop{width:340px;max-width:calc(100vw - 20px);height:360px;display:flex;flex-direction:column;padding:0}
.emoji-tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.emoji-tabs button{flex:1;height:34px;border-radius:9px;font-size:18px;opacity:.55;transition:all .15s}
.emoji-tabs button.on{opacity:1;background:var(--panel2)}
.emoji-grid{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;align-content:start}
.emoji-grid button{font-size:23px;height:38px;border-radius:9px;transition:transform .12s var(--spring)}
.emoji-grid button:hover{background:var(--panel2);transform:scale(1.2)}
.sheet-ov{position:fixed;inset:0;z-index:110;background:rgba(2,12,17,.45);animation:fade .2s;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--panel);border-radius:26px 26px 0 0;padding:8px 10px calc(14px + var(--safe-b));animation:sheet-in .35s var(--spring);max-height:85vh;overflow:auto}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 10px}
.sheet-ov.closing{animation:fade .2s reverse forwards}
.sheet-ov.closing .sheet{animation:sheet-out .2s var(--ease) forwards}

/* toast / in-app notification */
#toasts{position:fixed;top:calc(14px + var(--safe-t));inset-inline:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:min(420px,100%);padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--line);box-shadow:var(--shadow-lg);cursor:pointer;animation:toast-in .5s var(--spring);position:relative;overflow:hidden}
.toast.out{animation:toast-out .3s var(--ease) forwards}
.toast .meta{flex:1;min-width:0}
.toast b{display:block;font-size:14px}
.toast span{display:block;font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .av{--s:42px}
.toast .tbar{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:var(--brand2);animation:tbar 5s linear forwards}
.toast.simple{flex-direction:row;width:auto;max-width:min(420px,100%);padding:10px 16px;gap:10px;font-weight:600;font-size:14px}
.toast.simple svg{width:20px;height:20px}
.toast.t-ok svg{color:var(--ok)} .toast.t-err svg{color:var(--accent)} .toast.t-info svg{color:var(--brand2)}
.toast.urgent{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--panel))}

/* urgent ann modal */
.urgent-modal{max-width:520px;text-align:center}
.urgent-modal .siren{width:84px;height:84px;margin:24px auto 8px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative}
.urgent-modal .siren svg{width:40px;height:40px;animation:ring 1.2s infinite}
.urgent-modal .siren::before,.urgent-modal .siren::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ripple 1.8s infinite}
.urgent-modal .siren::after{animation-delay:.9s}
.urgent-modal .body{font-size:16.5px;line-height:1.8;white-space:pre-wrap;text-align:start;background:var(--panel2);border-radius:16px;padding:16px;margin-top:14px;max-height:40vh;overflow:auto}

/* lightbox */
.lb{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.94);display:flex;flex-direction:column;animation:fade .25s}
.lb-h{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 14px 12px;color:#fff}
.lb-h .ibtn{color:#fff}
.lb-h .ibtn:hover{background:rgba(255,255,255,.12)}
.lb-h b{display:block;font-size:14.5px}
.lb-h small{opacity:.65;font-size:12.5px}
.lb-b{flex:1;display:grid;place-items:center;position:relative;overflow:hidden;touch-action:none}
.lb-b img,.lb-b video{max-width:96vw;max-height:calc(100vh - 150px);object-fit:contain;animation:zoom-in .35s var(--spring);transition:transform .2s;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-nav.prev{inset-inline-start:16px}.lb-nav.next{inset-inline-end:16px}
.lb-thumbs{display:flex;gap:6px;justify-content:center;padding:10px 10px calc(14px + var(--safe-b));overflow-x:auto}
.lb-thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;opacity:.45;cursor:pointer;transition:all .2s;flex-shrink:0}
.lb-thumbs img.on{opacity:1;box-shadow:0 0 0 2px #fff}

/* ═════════════ CALL ═════════════ */
.call{position:fixed;inset:0;z-index:160;background:radial-gradient(ellipse at top,#0a3a4f,#020d12 70%);color:#fff;display:flex;flex-direction:column;animation:fade .3s}
.call.mini{inset:auto;bottom:calc(90px + var(--safe-b));inset-inline-end:16px;width:220px;height:auto;border-radius:20px;box-shadow:var(--shadow-lg);cursor:pointer;overflow:hidden;animation:pop-in .3s var(--spring)}
.call.mini .call-grid,.call.mini .call-ctrl,.call.mini .call-h .ibtn{display:none}
.call.mini .call-h{padding:12px 14px}
.call-h{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--safe-t)) 20px 10px}
.call-h .grow b{font-size:17px;display:block}
.call-h .grow small{opacity:.7;font-size:13px;font-variant-numeric:tabular-nums}
.call-h .ibtn{color:#fff}.call-h .ibtn:hover{background:rgba(255,255,255,.12)}
.call-grid{flex:1;display:grid;gap:10px;padding:10px 16px;grid-template-columns:repeat(var(--cols,1),1fr);grid-auto-rows:1fr;min-height:0}
.tile{position:relative;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tile .who{position:absolute;bottom:12px;inset-inline-start:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:4px 10px;border-radius:10px;font-size:13px;display:flex;gap:6px;align-items:center}
.tile .who svg{width:14px;height:14px;color:#ff8f98}
.tile .av{--s:110px;font-size:40px;transition:box-shadow .15s}
.tile.speaking{border-color:#34c78f;box-shadow:inset 0 0 0 2px #34c78f}
.tile.speaking .av{box-shadow:0 0 0 6px rgba(52,199,143,.3),0 0 0 14px rgba(52,199,143,.12)}
.tile .st{position:absolute;top:12px;inset-inline-start:12px;font-size:12.5px;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:8px}
.self-view{position:absolute;bottom:calc(120px + var(--safe-b));inset-inline-end:20px;width:120px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.2);z-index:3;background:#000;cursor:grab;transition:opacity .3s}
.self-view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.call-ctrl{display:flex;justify-content:center;gap:14px;padding:16px 16px calc(26px + var(--safe-b));flex-wrap:wrap}
.cbtn{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;transition:all .2s var(--spring);backdrop-filter:blur(10px)}
.cbtn:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.cbtn.off{background:#fff;color:#0b2430}
.cbtn.end{background:#e5484d;width:72px;border-radius:30px}
.cbtn.end:hover{background:#f2555a}
.cbtn.accept{background:#22c55e;animation:bounce-call 1.4s infinite}
.cbtn svg{width:26px;height:26px}
.ringing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ringing .av{--s:132px;font-size:46px;position:relative}
.ringing .av::before,.ringing .av::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(127,199,227,.5);animation:ripple 2s infinite}
.ringing .av::after{animation-delay:1s}
.ringing h2{font-family:var(--font-d);font-size:28px;margin-top:22px}
.ringing p{opacity:.7}

/* page mode (directory / admin / calls) */
#app.page-mode,#app.page-mode.info-open{grid-template-columns:var(--rail) 1fr}
#app.page-mode .side{display:none}
#app.page-mode .page{grid-column:2 / -1}
/* mobile bottom nav */
.bnav{display:none}

/* ═════════════ RESPONSIVE ═════════════ */
@media (max-width:1180px){
  #app.info-open{grid-template-columns:var(--rail) var(--side) 1fr}
  .info{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(360px,100%);z-index:40;box-shadow:var(--shadow-lg)}
}
@media (max-width:900px){
  body{font-size:15.5px}
  #app,#app.info-open{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .side{grid-row:1;grid-column:1;border:0}
  .main,.page{grid-row:1 / span 2;grid-column:1;position:fixed;inset:0;z-index:30;transform:translateX(-100%);transition:transform .38s var(--ease);visibility:hidden}
  [dir="ltr"] .main,[dir="ltr"] .page{transform:translateX(100%)}
  #app.show-main .main{transform:none;visibility:visible}
  #app.page-mode .page{position:relative;grid-row:1;grid-column:1;z-index:2;transform:none;transition:none;visibility:visible;inset:auto}
  #app.page-mode,#app.page-mode.info-open{grid-template-columns:1fr}
  .chat-h{padding-top:var(--safe-t);height:calc(62px + var(--safe-t))}
  .chat-h .back{display:inline-grid}
  .side-h{padding-top:calc(16px + var(--safe-t))}
  .page-h{padding:calc(16px + var(--safe-t)) 18px 8px}
  .page-h h1{font-size:23px}
  .page-b{padding:6px 14px 30px}
  .bnav{display:flex;grid-row:2;grid-column:1;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + var(--safe-b));z-index:10}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);position:relative;border-radius:14px;transition:color .2s}
  .bnav button svg{width:24px;height:24px;transition:transform .3s var(--spring)}
  .bnav button.on{color:var(--brand2)}
  .bnav button.on svg{transform:translateY(-2px) scale(1.08)}
  .bnav button.on::before{content:'';position:absolute;top:2px;width:44px;height:30px;border-radius:12px;background:var(--brand-soft);z-index:-1;animation:pop .3s var(--spring)}
  .bnav .badge{position:absolute;top:0;inset-inline-start:calc(50% + 4px);height:18px;min-width:18px;font-size:10.5px}
  .fab{bottom:20px;display:grid}
  .side-list{padding-bottom:96px}
  .info{width:100%!important;animation:sheet-in .35s var(--ease)}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .pcard{padding:16px 10px}
  .pcard .av{--s:56px}
  .stat b{font-size:22px}
  .trow .who{min-width:120px}
  .m .col{max-width:84%}
  .msgs-in{padding:0 10px}
  .composer{padding:6px 8px calc(8px + var(--safe-b))}
  .auth-wrap{grid-template-columns:1fr;gap:24px;max-width:460px}
  .auth-hero{text-align:center;padding:0}
  .auth-hero .logo{justify-content:center;margin-bottom:14px}
  .auth-hero h1{font-size:28px}
  .auth-hero p,.auth-feats{display:none}
  .auth-card{padding:22px}
  .modal{max-width:100%;border-radius:24px}
  .ov{padding:12px;align-items:end}
  .ov .modal{max-height:92vh}
  .self-view{width:96px;bottom:calc(110px + var(--safe-b))}
  .cbtn{width:56px;height:56px}
  .jump{bottom:90px;inset-inline-end:14px}
  .call-grid{grid-template-columns:1fr!important}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ═════════════ KEYFRAMES ═════════════ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pop-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes msg-in{from{opacity:0;transform:translateY(14px) scale(.96);transform-origin:bottom right}to{opacity:1;transform:none}}
@keyframes msg-in-own{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes modal-in{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes modal-out{to{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet-out{to{transform:translateY(100%)}}
@keyframes slide-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide-down{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes slide-in-side{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes toast-in{0%{opacity:0;transform:translateY(-30px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(-20px) scale(.95)}}
@keyframes tbar{from{width:100%}to{width:0}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.08)}66%{transform:translate(-40px,30px) scale(.94)}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes flip{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}50%{transform:rotate(-6deg)}}
@keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 4px var(--warn)}}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes zoom-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes bounce-call{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

/* ═══════════════════════════════════════════════════════════════
   LUXE GLASS — طبقة التصميم الفاخر (زجاج مغبّش + أورورا + هوية السلاسل)
   ═══════════════════════════════════════════════════════════════ */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --font:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-d:'Readex Pro','IBM Plex Sans Arabic',sans-serif;
  --blur:22px; --r:14px; --r-lg:20px; --r-xl:28px;
}
:root,[data-theme="light"]{
  --bg:#dfeaef;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.48); --glass-3:rgba(255,255,255,.78);
  --glass-line:rgba(255,255,255,.75); --glass-edge:rgba(0,52,74,.09);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.9);
  --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.55); --panel3:rgba(230,240,244,.8);
  --line:rgba(0,52,74,.08); --line2:rgba(0,52,74,.16);
  --text:#082230; --text2:#2c4a57; --muted:#5d7a87; --faint:#90a8b2;
  --brand:#00587a; --brand2:#0a7aa5; --brand-soft:rgba(10,122,165,.11);
  --own1:#1290bd; --own2:#00557a; --other:rgba(255,255,255,.86); --other-line:rgba(255,255,255,.9);
  --chat-bg:transparent;
  --a1:#7fd0ee; --a2:#f3a6b0; --a3:#a7e3d2; --a4:#c9d8ff; --a-op:.55;
  --rail-bg:linear-gradient(180deg,#00435e,#002a3c); --rail-ink:#a9d6e6;
  --shadow:0 1px 1px rgba(0,40,60,.04),0 6px 24px -6px rgba(0,40,60,.14);
  --shadow-lg:0 30px 80px -20px rgba(0,40,60,.35),0 8px 24px -8px rgba(0,40,60,.16);
  --glow:0 0 0 1px rgba(10,122,165,.18),0 10px 30px -8px rgba(10,122,165,.45);
}
[data-theme="dark"]{
  --bg:#020b10;
  --glass:rgba(9,27,36,.58); --glass-2:rgba(12,34,45,.46); --glass-3:rgba(9,25,33,.82);
  --glass-line:rgba(255,255,255,.07); --glass-edge:rgba(0,0,0,.4);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.06);
  --panel:rgba(11,30,40,.72); --panel2:rgba(255,255,255,.045); --panel3:rgba(255,255,255,.075);
  --line:rgba(160,210,230,.09); --line2:rgba(160,210,230,.17);
  --text:#e6f3f8; --text2:#bdd6e0; --muted:#86a9b6; --faint:#5a7c89;
  --brand:#2aa3d4; --brand2:#4cc0ea; --brand-soft:rgba(76,192,234,.13);
  --own1:#1290bd; --own2:#00476a; --other:rgba(22,52,66,.78); --other-line:rgba(255,255,255,.06);
  --chat-bg:transparent;
  --a1:#0a6d93; --a2:#8a1f2b; --a3:#0b6b63; --a4:#16306a; --a-op:.6;
  --rail-bg:linear-gradient(180deg,rgba(2,18,26,.85),rgba(1,10,15,.92)); --rail-ink:#7fa8b8;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 8px 28px -8px rgba(0,0,0,.6);
  --shadow-lg:0 40px 90px -20px rgba(0,0,0,.8),0 10px 30px -10px rgba(0,0,0,.5);
  --glow:0 0 0 1px rgba(76,192,234,.25),0 10px 34px -8px rgba(42,163,212,.55);
}
body{background:var(--bg);font-feature-settings:"ss01","kern"}
h1,h2,h3,.side-h h2,.page-h h1,.modal-h h3{font-family:var(--font-d);letter-spacing:-.2px}

/* ─── أورورا + حبيبات ─── */
#aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
#aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--a-op);will-change:transform;animation:aur 28s ease-in-out infinite}
#aurora .a1{width:62vmax;height:62vmax;background:var(--a1);top:-22vmax;inset-inline-start:-14vmax}
#aurora .a2{width:46vmax;height:46vmax;background:var(--a2);bottom:-20vmax;inset-inline-end:-10vmax;animation-delay:-9s;animation-duration:34s}
#aurora .a3{width:40vmax;height:40vmax;background:var(--a3);top:30%;inset-inline-start:38%;animation-delay:-17s;opacity:calc(var(--a-op) * .7)}
#aurora .a4{width:36vmax;height:36vmax;background:var(--a4);top:-10vmax;inset-inline-end:10%;animation-delay:-5s;animation-duration:40s;opacity:calc(var(--a-op) * .6)}
#aurora .grain{position:absolute;inset:-50%;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes aur{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,-4vmax) scale(1.1)}66%{transform:translate(-5vmax,5vmax) scale(.92)}}

/* ─── الإطار العام زجاج ─── */
#app{background:transparent;z-index:1}
.glass,.side,.info,.chat-h,.page-h,.composer-in,.modal,.pop,.sheet,.toast,.bnav,.mention-pop{
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%)}
.side{background:var(--glass);border-inline-end:1px solid var(--glass-line);box-shadow:var(--glass-hi)}
.main,.page{background:transparent}
.main::before{background-image:var(--wall);background-size:280px 280px;opacity:1}
.main::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 120%,color-mix(in srgb,var(--bg) 55%,transparent),transparent 60%);z-index:0}
.info{background:var(--glass-3);border-inline-start:1px solid var(--glass-line)}

/* ─── الشريط الجانبي (Rail) ─── */
.rail{background:var(--rail-bg);box-shadow:inset -1px 0 0 rgba(255,255,255,.05),8px 0 30px -12px rgba(0,0,0,.4);position:relative}
[dir="rtl"] .rail{box-shadow:inset 1px 0 0 rgba(255,255,255,.05),-8px 0 30px -12px rgba(0,0,0,.4)}
.rail-btn{z-index:1;border-radius:16px}
.rail-btn.on{background:transparent;color:#fff}
.rail-btn.on::before{display:none}
.rail-btn.on svg{filter:drop-shadow(0 0 8px rgba(127,199,227,.7))}
.rail-ind{position:absolute;top:0;inset-inline-start:10px;width:52px;border-radius:16px;z-index:0;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px -6px rgba(0,0,0,.45);
  transition:transform .5s cubic-bezier(.3,1.4,.5,1),height .3s,opacity .2s}
.rail-ind::after{content:'';position:absolute;inset-inline-start:-10px;top:22%;bottom:22%;width:4px;border-radius:4px;background:linear-gradient(#ff8f98,#ff5c68);box-shadow:0 0 12px #ff5c68}
.rail-btn .tip{background:var(--glass-3);color:var(--text);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* ─── الشعار ─── */
.logo-mark{background:radial-gradient(120% 120% at 20% 10%,#18a6d6 0%,#00587a 45%,#002a3c 100%);box-shadow:0 10px 26px -6px rgba(0,88,122,.7),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(0,0,0,.3)}
.logo-mark::after{display:none}
.logo-mark .logo-svg{width:62%;height:62%;overflow:visible}
.logo-mark:hover .lk1{animation:link-l .6s var(--spring)}
.logo-mark:hover .lk2{animation:link-r .6s var(--spring)}
@keyframes link-l{50%{transform:translate(-2px,2px) rotate(-38deg)}}
@keyframes link-r{50%{transform:translate(2px,-2px) rotate(-38deg)}}
.lk-dot{animation:dot-pulse 2.6s ease-in-out infinite;transform-origin:38.5px 9.5px}
@keyframes dot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* ─── الأفاتار ─── */
.av{background:linear-gradient(140deg,color-mix(in srgb,var(--c,#0a6d93) 55%,#fff),var(--c,#0a6d93) 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -2px rgba(0,0,0,.25);text-shadow:0 1px 2px rgba(0,0,0,.25);font-family:var(--font-d);font-weight:600}
.av.emoji{background:linear-gradient(140deg,var(--glass-3),var(--panel3));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px -3px rgba(0,0,0,.2),0 0 0 1px var(--line)}
.av .dot{border-color:var(--glass-3)}
.av .dot.on{background:radial-gradient(circle at 35% 35%,#6ff0a7,#16b45a)}
.av.sq{border-radius:32%}

/* ─── القائمة الجانبية ─── */
.side-h h2{font-size:23px;font-weight:700;background:linear-gradient(90deg,var(--text),color-mix(in srgb,var(--text) 60%,var(--brand2)));-webkit-background-clip:text;background-clip:text;color:transparent}
.search input{background:var(--panel2);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.search input:focus{background:var(--glass-3);box-shadow:var(--glow)}
.chip{background:var(--panel2);border-color:var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip.on{background:linear-gradient(135deg,var(--brand2),var(--brand));border-color:transparent;box-shadow:0 6px 16px -6px rgba(10,122,165,.7)}
.sec-t{font-family:var(--font-d);font-weight:600;letter-spacing:.4px;font-size:11.5px}
.ci{border-radius:18px;margin:1px 0;transition:background .25s,transform .25s var(--spring),box-shadow .25s}
.ci:hover{background:var(--panel2);transform:translateX(0) scale(1.005)}
.ci.on{background:linear-gradient(135deg,color-mix(in srgb,var(--brand2) 16%,transparent),color-mix(in srgb,var(--brand2) 6%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand2) 25%,transparent),0 8px 24px -14px rgba(10,122,165,.6)}
.ci.on::before{background:linear-gradient(var(--brand2),#ff5c68);width:3px;top:14px;bottom:14px;box-shadow:0 0 10px var(--brand2)}
.ci .nm{font-family:var(--font-d);font-weight:500;letter-spacing:-.1px}
.ci.unread .nm{font-weight:700}
.badge{background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 3px 10px -2px rgba(10,122,165,.6);font-family:var(--font-d)}
.badge.red,.ci .mention-dot{background:linear-gradient(135deg,#ff7a84,#d6303f);box-shadow:0 3px 10px -2px rgba(230,50,65,.65)}
.notif-card{background:linear-gradient(135deg,#0a7aa5,#003a52 70%);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.notif-card::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.fab{border-radius:20px;box-shadow:0 14px 30px -8px rgba(0,88,122,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.fab::after{content:'';position:absolute;inset:-6px;border-radius:24px;border:2px solid rgba(76,192,234,.4);animation:ripple 2.4s infinite;pointer-events:none}

/* ─── هيدر المحادثة ─── */
.chat-h{background:var(--glass);border-bottom:0;box-shadow:var(--glass-hi);position:relative}
.chat-h::after{content:'';position:absolute;inset-inline:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand2) 45%,transparent),color-mix(in srgb,#ff5c68 35%,transparent),transparent)}
.chat-h .ttl b{font-family:var(--font-d);font-weight:600;font-size:16.5px}
.chat-h .ibtn{border-radius:14px}
.chat-h .ibtn:hover{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
#aCall,#vCall{color:var(--brand2)}
.pin-bar{background:var(--glass-2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}

/* ─── الرسائل ─── */
.day{background:var(--glass-3);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:var(--font-d);font-weight:500;box-shadow:var(--shadow)}
.sys{background:var(--glass-2);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px}
.new-div{font-family:var(--font-d)}
.new-div::before,.new-div::after{background:linear-gradient(90deg,transparent,var(--accent));opacity:.6}
.new-div::after{background:linear-gradient(90deg,var(--accent),transparent)}
.welcome .av{box-shadow:0 20px 40px -14px rgba(0,0,0,.4),0 0 0 6px var(--glass-2)}
.welcome h3{font-size:22px}
.bub{border-radius:20px;background:var(--other);border:1px solid var(--other-line);box-shadow:0 1px 1px rgba(0,0,0,.04),0 6px 18px -10px rgba(0,30,45,.35);padding:9px 13px 7px}
.m.own .bub{background:linear-gradient(155deg,var(--own1) 0%,var(--own2) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 24px -12px rgba(0,85,122,.75)}
.m.own .bub.media-only,.bub.media-only{background:var(--other);padding:4px}
.m.own .bub.media-only{background:linear-gradient(155deg,var(--own1),var(--own2))}
/* ذيل الفقاعة */
.m.last .bub:not(.media-only):not(.deleted)::before{content:'';position:absolute;bottom:-1px;width:14px;height:18px;background:inherit;pointer-events:none}
.m.last:not(.own) .bub:not(.media-only):not(.deleted)::before{inset-inline-start:-7px;background:var(--other);
  -webkit-mask:radial-gradient(circle at 0 0,transparent 13px,#000 13.5px);mask:radial-gradient(circle at 0 0,transparent 13px,#000 13.5px)}
[dir="ltr"] .m.last:not(.own) .bub:not(.media-only):not(.deleted)::before{-webkit-mask:radial-gradient(circle at 0 0,transparent 13px,#000 13.5px);mask:radial-gradient(circle at 0 0,transparent 13px,#000 13.5px);transform:none}
[dir="rtl"] .m.last:not(.own) .bub:not(.media-only):not(.deleted)::before{-webkit-mask:radial-gradient(circle at 100% 0,transparent 13px,#000 13.5px);mask:radial-gradient(circle at 100% 0,transparent 13px,#000 13.5px)}
.m.own.last .bub:not(.media-only):not(.deleted)::before{inset-inline-end:-7px;background:var(--own2)}
[dir="ltr"] .m.own.last .bub:not(.media-only):not(.deleted)::before{-webkit-mask:radial-gradient(circle at 100% 0,transparent 13px,#000 13.5px);mask:radial-gradient(circle at 100% 0,transparent 13px,#000 13.5px)}
[dir="rtl"] .m.own.last .bub:not(.media-only):not(.deleted)::before{-webkit-mask:radial-gradient(circle at 0 0,transparent 13px,#000 13.5px);mask:radial-gradient(circle at 0 0,transparent 13px,#000 13.5px)}
.m:not(.own).last .bub{border-end-start-radius:4px}
.m.own.last .bub{border-end-end-radius:4px}
.m.first:not(.last):not(.own) .bub{border-end-start-radius:8px}
.m:not(.first):not(.last):not(.own) .bub{border-start-start-radius:8px;border-end-start-radius:8px}
.m.last:not(.first):not(.own) .bub{border-start-start-radius:8px}
.m.own.first:not(.last) .bub{border-end-end-radius:8px}
.m.own:not(.first):not(.last) .bub{border-start-end-radius:8px;border-end-end-radius:8px}
.m.own.last:not(.first) .bub{border-start-end-radius:8px}
.m .who{font-family:var(--font-d);font-weight:600}
.m.anim{animation:msg-pop .55s cubic-bezier(.2,1.3,.4,1) both}
.m.own.anim{animation:msg-fly .6s cubic-bezier(.2,1.25,.35,1) both}
@keyframes msg-pop{0%{opacity:0;transform:translateY(18px) scale(.9);filter:blur(4px)}60%{filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes msg-fly{0%{opacity:0;transform:translateY(42px) scale(.78);filter:blur(6px)}55%{opacity:1;filter:blur(0)}100%{transform:none}}
.bub .foot .read{color:#8ff0ff;filter:drop-shadow(0 0 4px rgba(143,240,255,.6))}
.react{background:var(--glass-3);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 4px 12px -4px rgba(0,0,0,.25)}
.react.mine{background:linear-gradient(135deg,color-mix(in srgb,var(--brand2) 28%,var(--glass-3)),var(--glass-3));border-color:color-mix(in srgb,var(--brand2) 55%,transparent)}
.hover-bar{background:var(--glass-3);border:1px solid var(--glass-line);border-radius:16px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow-lg)}
.quote{background:color-mix(in srgb,var(--brand2) 9%,transparent);border-inline-start-width:3px;border-radius:12px}
.gal{border-radius:16px;box-shadow:0 10px 26px -14px rgba(0,0,0,.5)}
.gi::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));opacity:0;transition:opacity .3s;pointer-events:none}
.gi:hover::after{opacity:1}
.gi .play span{width:60px;height:60px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px -6px rgba(0,0,0,.5);transition:transform .3s var(--spring)}
.gi:hover .play span{transform:scale(1.12)}
.file{border-radius:16px;background:color-mix(in srgb,var(--panel3) 70%,transparent)}
.fi{box-shadow:0 6px 14px -6px var(--fc)}
.voice .pp{background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 6px 16px -6px rgba(10,122,165,.8)}
.voice .pp:hover{transform:scale(1.06)}
.wave i{border-radius:3px}
.wave i.p{opacity:1;background:linear-gradient(var(--brand2),var(--brand))}
.m.own .wave i.p{background:#fff}

/* مؤشر الكتابة كفقاعة */
.typing-ind{height:auto;min-height:0;padding:0 18px;max-width:880px}
.typing-ind:not(:empty){padding:4px 18px 2px}
.typing-bub{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:18px 18px 18px 6px;background:var(--other);border:1px solid var(--other-line);box-shadow:var(--shadow);animation:msg-pop .4s var(--spring);font-size:12.5px;color:var(--muted)}
[dir="rtl"] .typing-bub{border-radius:18px 18px 6px 18px}
.typing-bub .av{--s:22px;font-size:9px}
.dots i{background:var(--muted);width:7px;height:7px}

/* ─── الإعلانات ─── */
.ann{border-radius:24px;background:var(--glass-3);border:1px solid var(--glass-line);box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);position:relative}
.ann-h{background:linear-gradient(120deg,#0a7aa5,#004e6d 55%,#002f44);position:relative;overflow:hidden;padding:14px 18px}
.ann-h::after{content:'';position:absolute;inset:0;background:radial-gradient(60% 140% at 100% 0,rgba(255,255,255,.22),transparent 60%)}
.ann.important .ann-h{background:linear-gradient(120deg,#e0a02a,#a8680a 60%,#6d4100)}
.ann.urgent .ann-h{background:linear-gradient(120deg,#ff5c68,#c2283a 55%,#6e101b)}
.ann.urgent{box-shadow:0 0 0 1px rgba(255,92,104,.35),0 30px 70px -24px rgba(230,50,65,.55)}
.ann.urgent .ann-h svg{animation:ring 1.6s infinite}

const Sound = {
  ctx: null,
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (this.ctx?.state === 'suspended') this.ctx.resume(); return this.ctx; },
  tone(freqs, { dur = .14, gap = .09, type = 'sine', vol = .16 } = {}) {
    if (!store.get('sound', true)) return;
    const c = this.ensure(); if (!c) return;
    let t0 = c.currentTime + .01;
    for (const f of freqs) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
      t0 += gap;
    }
  },
  msg() { this.tone([880, 1320], { dur: .16, gap: .08, vol: .12 }); },
  mention() { this.tone([784, 1047, 1319], { dur: .18, gap: .09, vol: .15, type: 'triangle' }); },
  sent() { this.tone([1200], { dur: .06, vol: .05 }); },
  urgent() { this.tone([988, 740, 988, 740], { dur: .22, gap: .2, vol: .2, type: 'square' }); },
  ringTimer: null,
  ring(on, outgoing) {
    clearInterval(this.ringTimer); this.ringTimer = null;
    if (!on) return;
    const play = () => outgoing ? this.tone([440, 480], { dur: .9, gap: 0, vol: .06 }) : this.tone([659, 784, 988, 784], { dur: .2, gap: .17, vol: .18, type: 'triangle' });

  },
};
