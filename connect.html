function toEmail(id) {
  id = String(id || '').trim();
  if (id.includes('@')) return id.toLowerCase();
  const digits = id.replace(/[^\d]/g, '').replace(/^00/, '');
  if (digits.length >= 7) return `${digits}@${CFG.phoneDomain}`;
  return id.toLowerCase();
}
function safeName(n) {
  const e = ext(n); const base = String(n || 'file').replace(/\.[^.]+$/, '');
  const slug = base.normalize('NFKD').replace(/[^\w\-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'file';
  return e ? `${slug}.${e.replace(/[^\w]/g, '')}` : slug;
}

  /* messages */
  async messages(conv, { before, limit = 50 } = {}) {

    if (before) q = q.lt('created_at', before);
    const { data, error } = await q; this.err(error); return (data || []).reverse();
  }
  async message(id) { const { data } = await this.sb.from('cx_messages').select('*').eq('id', id).maybeSingle(); return data; }
  async reactions(ids) { if (!ids.length) return []; const { data } = await this.sb.from('cx_reactions').select('message_id,user_id,emoji').in('message_id', ids); return data || []; }
  async acks(ids) { if (!ids.length) return []; const { data } = await this.sb.from('cx_acks').select('message_id,user_id,acked_at').in('message_id', ids); return data || []; }
  async media(conv) {
    const { data } = await this.sb.from('cx_messages').select('id,sender_id,attachments,created_at,body,kind').eq('conversation_id', conv)
      .in('kind', ['media']).is('deleted_at', null).order('created_at', { ascending: false }).limit(200);
    return data || [];
  }
  async pinned(conv) { const { data } = await this.sb.from('cx_messages').select('*').eq('conversation_id', conv).eq('pinned', true).is('deleted_at', null).order('created_at', { ascending: false }).limit(20); return data || []; }
  async send(m) {
    const row = { conversation_id: m.conversation_id, sender_id: this.uid, kind: m.kind || 'text', body: m.body ?? null, attachments: m.attachments || [],
      reply_to: m.reply_to || null, mentions: m.mentions || [], priority: m.priority || 'normal', requires_ack: !!m.requires_ack, client_id: m.client_id };
    const { data, error } = await this.sb.from('cx_messages').insert(row).select().single();
    if (error && error.code === '23505') { const { data: d } = await this.sb.from('cx_messages').select('*').eq('sender_id', this.uid).eq('client_id', m.client_id).maybeSingle(); return d; }
    this.err(error);
    this.notify({ message_id: data.id });
    return data;
  }
  async updateMessage(id, patch) { const { data, error } = await this.sb.from('cx_messages').update(patch).eq('id', id).select().single(); this.err(error); return data; }
  async react(mid, emoji, on) {
    if (on) { const { error } = await this.sb.from('cx_reactions').insert({ message_id: mid, user_id: this.uid, emoji }); if (error && error.code !== '23505') this.err(error); }
    else { const { error } = await this.sb.from('cx_reactions').delete().eq('message_id', mid).eq('user_id', this.uid).eq('emoji', emoji); this.err(error); }
  }
  async ack(mid) { const { error } = await this.sb.from('cx_acks').insert({ message_id: mid, user_id: this.uid }); if (error && error.code !== '23505') this.err(error); }

  /* files */
  async upload(path, file, onProgress) {
    const tok = await this.token();
    const url = `${CFG.url}/storage/v1/object/${CFG.bucket}/${path.split('/').map(encodeURIComponent).join('/')}`;
    return new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open('POST', url);
      x.setRequestHeader('Authorization', 'Bearer ' + tok);
      x.setRequestHeader('apikey', CFG.key);
      x.setRequestHeader('x-upsert', 'false');
      x.setRequestHeader('cache-control', 'max-age=31536000');
      if (file.type) x.setRequestHeader('Content-Type', file.type);
      x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
      x.onload = () => (x.status >= 200 && x.status < 300) ? res(path) : rej(new Error('upload ' + x.status + ' ' + x.responseText));
      x.onerror = () => rej(new Error('network'));
      x.send(file);
    });
  }
  async urls(paths) {
    const now = Date.now(), need = [...new Set(paths.filter(p => p && !(this.urlCache.get(p)?.exp > now)))];
    if (need.length) {
      for (let i = 0; i < need.length; i += 100) {
        const { data } = await this.sb.storage.from(CFG.bucket).createSignedUrls(need.slice(i, i + 100), 3600 * 6);
        (data || []).forEach(d => d.signedUrl && this.urlCache.set(d.path, { url: d.signedUrl, exp: now + 3600 * 5.5 * 1000 }));
      }
    }
    const out = {}; paths.forEach(p => { const c = this.urlCache.get(p); if (c) out[p] = c.url; }); return out;
  }
  async url(path) { return (await this.urls([path]))[path]; }
  cached(p) { const c = this.urlCache.get(p); return c && c.exp > Date.now() ? c.url : null; }
  filePath(conv, name) { return `${conv}/${uid()}/${safeName(name)}`; }
  avatarPath(name) { return `avatars/${this.uid}/${Date.now()}_${safeName(name)}`; }

  async updateCall(id, patch) { const { data } = await this.sb.from('cx_calls').update(patch).eq('id', id).select().maybeSingle(); return data; }

  /* realtime */
  realtime(h) {
    const me = this.uid;
    const ch = this.sb.channel('cx-db-' + me.slice(0, 8))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cx_messages' }, p => h.msgInsert(p.new))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'cx_messages' }, p => h.msgUpdate(p.new))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cx_reactions' }, p => h.reaction(p.eventType, p.new, p.old))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cx_acks' }, p => h.ack(p.new))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cx_calls' }, p => h.call(p.eventType, p.new))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cx_participants', filter: `user_id=eq.${me}` }, p => h.myPart(p.eventType, p.new, p.old))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'cx_participants' }, p => h.part(p.new))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cx_members' }, p => h.member(p.eventType, p.new))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'cx_conversations' }, p => h.conv(p.new))
      .subscribe(st => h.status && h.status(st));
    this.channels.push(ch);
  }
  presence(meta, onSync) {
    const ch = this.sb.channel('cx-presence', { config: { presence: { key: this.uid } } });
    ch.on('presence', { event: 'sync' }, () => onSync(new Set(Object.keys(ch.presenceState()))))
      .subscribe(async st => { if (st === 'SUBSCRIBED') await ch.track(meta); });
    this.channels.push(ch); this.presenceCh = ch;
  }
  typing(onTyping) {
    const ch = this.sb.channel('cx-typing', { config: { broadcast: { self: false } } });
    ch.on('broadcast', { event: 't' }, ({ payload }) => onTyping(payload)).subscribe();
    this.channels.push(ch); this.typingCh = ch;
  }
  sendTyping(conv) { this.typingCh?.send({ type: 'broadcast', event: 't', payload: { c: conv, u: this.uid } }); }
  signal(callId) {
    const ch = this.sb.channel('cx-call-' + callId, { config: { broadcast: { self: false, ack: false } } });
    const handlers = {};
    ch.on('broadcast', { event: 'sig' }, ({ payload }) => handlers.sig && handlers.sig(payload));
    const ready = new Promise(r => ch.subscribe(st => st === 'SUBSCRIBED' && r()));
    this.channels.push(ch);
    return {
      ready, on: (e, cb) => handlers[e] = cb,
      send: p => ch.send({ type: 'broadcast', event: 'sig', payload: { ...p, from: this.uid } }),
      close: () => { this.sb.removeChannel(ch); this.channels = this.channels.filter(c => c !== ch); },
    };
  }

  /* push */
  notify(body) { this.sb.functions.invoke(CFG.pushFn, { body }).catch(() => {}); }
  async savePush(sub) {
    const j = sub.toJSON();
    const { error } = await this.sb.from('cx_push_subs').upsert({ user_id: this.uid, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200), fail_count: 0 }, { onConflict: 'endpoint' });
    this.err(error);
  }
  async removePush(endpoint) { await this.sb.from('cx_push_subs').delete().eq('endpoint', endpoint); }
}

function errMsg(e) {

  if (S.view === 'anns') return c.kind === 'announce';
  if (S.filter === 'unread') return c.unread > 0 || c.pending_acks > 0;
  if (S.filter === 'channel') return c.kind === 'channel' || c.kind === 'announce';
  if (S.filter === 'dm') return c.kind === 'dm';
  if (S.filter === 'group') return c.kind === 'group';

async function squareThumb(url) {
  const { img, w, h: hh } = await imgDims(url); if (!img) return null;
  const s = Math.min(w, hh), cv = document.createElement('canvas'); cv.width = cv.height = 320;
  cv.getContext('2d').drawImage(img, (w - s) / 2, (hh - s) / 2, s, s, 0, 0, 320, 320);
  const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85)); return b ? new File([b], 'avatar.jpg', { type: 'image/jpeg' }) : null;
}

  /* انتقال سلس بين الشاشات (View Transitions) */
  vt(fn) {

/* ═══════════════════════════════════════════════════════════════
   Calls — WebRTC mesh (حتى 8 أشخاص) + إشارات عبر Supabase Realtime
   ═══════════════════════════════════════════════════════════════ */
const Call = {
  cur: null, ring: null,

  /* ── outgoing ── */
  async start(convId, media) {
    if (this.cur) return toast(t('callBusy'), 'err');
    const c = S.conv.get(convId); if (!c) return;
    const local = await this.getMedia(media); if (!local) return;
    let row;
    try { row = await B.startCall(convId, media); } catch (e) { local.getTracks().forEach(t => t.stop()); return toast(errMsg(e), 'err'); }
    this.setup(row, local, 'caller');
    this.render('outgoing');
    Sound.ring(true, true);
    if (DEMO && !B.multi) setTimeout(() => this.cur && this.cur.id === row.id && !this.cur.answered && this.handle({ t: 'demo-join', from: c.kind === 'dm' ? c.other_id : [...chatOf(convId).parts.keys()].find(u => u !== S.me.user_id) || 'u-khaled' }), 2600);
    this.cur.noAnswer = setTimeout(() => { if (this.cur && this.cur.id === row.id && !this.cur.answered) { toast(t('noAnswer'), 'info'); this.end('missed'); } }, 45000);
  },
  async getMedia(media) {
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: media === 'video' ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } : false });
    } catch (e) {
      console.warn(e);
      if (media === 'video') { try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); toast(t('callMicErr'), 'err'); return s; } catch {} }
      toast(t('callMicErr'), 'err'); return null;
    }
  },
  setup(row, local, role) {
    const sig = B.signal(row.id);
    this.cur = { id: row.id, conv: row.conversation_id, media: row.media, row, local, role, sig, peers: new Map(), answered: false, t0: null,
      mic: true, cam: row.media === 'video', facing: 'user', screen: null, mini: false };

    window.addEventListener('beforeunload', this._unload = () => this.cur && this.cur.sig.send({ t: 'bye' }));

  },

  /* ── incoming ── */
  onRow(type, row) {
    if (!row) return;
    if (type === 'INSERT' && row.started_by !== S.me.user_id && row.status === 'ringing' && Date.now() - new Date(row.started_at) < 50000) {
      if (this.cur) return; // مشغول
      return this.incoming(row);
    }
    if (type === 'UPDATE') {
      if (this.ring && this.ring.id === row.id && (row.status === 'ended' || (row.joined || []).includes(S.me.user_id))) {
        const missed = row.status === 'ended' && !row.answered_at;
        this.stopRing(); if (missed) toast(`${t('missed')} · ${convName(S.conv.get(row.conversation_id))}`, 'info');
      }
      if (this.cur && this.cur.id === row.id) { this.cur.row = row; if (row.status === 'ended' && !this.cur.peers.size) this.end(null, true); }
    }
  },
  async fromPush(id, action) {
    const row = await B.getCall(id); if (!row || row.status === 'ended') return toast(t('callEnded'), 'info');
    if (action === 'decline') return this.decline(row);

  },
  incoming(row, autoAccept) {
    if (this.ring) return;
    this.ring = row;
    const c = S.conv.get(row.conversation_id), who = memberOf(row.started_by);
    const el = h(`<div class="call" id="ringUI"><div class="call-h"><div class="grow"><b>${esc(c ? convName(c) : '')}</b><small>${row.media === 'video' ? t('incomingV') : t('incomingA')}</small></div></div>
      <div class="ringing">${avHTML(who, 132)}<h2>${esc(who.display_name)}</h2><p>${row.media === 'video' ? t('incomingV') : t('incomingA')}${c && c.kind !== 'dm' ? ' · ' + esc(convName(c)) : ''}</p></div>
      <div class="call-ctrl"><button class="cbtn end" id="rDec" title="${t('decline')}">${ic('phoneOff')}</button><button class="cbtn accept" id="rAcc" title="${t('accept')}">${ic(row.media === 'video' ? 'video' : 'phone')}</button></div></div>`);
    document.body.appendChild(el); hydrate(el);
    Sound.ring(true); navigator.vibrate?.([400, 200, 400, 200, 400]);
    $('#rAcc').onclick = () => this.accept(row);
    $('#rDec').onclick = () => this.decline(row);
    this.ring._tm = setTimeout(() => this.stopRing(), 45000);
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted' && !S.pushOn) {
      navigator.serviceWorker?.getRegistration('./connect').then(r => r?.showNotification(who.display_name, { body: row.media === 'video' ? t('incomingV') : t('incomingA'), tag: 'call-' + row.id, requireInteraction: true, data: { url: `?call=${row.id}` } }));
    }
    if (autoAccept) this.accept(row);
  },
  stopRing() { if (!this.ring) return; clearTimeout(this.ring._tm); this.ring = null; Sound.ring(false); $('#ringUI')?.remove(); navigator.vibrate?.(0); },
  async accept(row) {
    this.stopRing();
    if (this.cur) return toast(t('callBusy'), 'err');
    const local = await this.getMedia(row.media); if (!local) return;
    await this.setup(row, local, 'callee');
    this.cur.answered = true; this.cur.t0 = Date.now();
    this.render('connecting');
    this.cur.sig.send({ t: 'hello' });
    const joined = [...new Set([...(row.joined || []), S.me.user_id])];
    B.updateCall(row.id, { status: 'active', answered_at: row.answered_at || new Date().toISOString(), joined }).catch(() => {});
  },
  async decline(row) {
    this.stopRing();
    const c = S.conv.get(row.conversation_id);
    const sig = B.signal(row.id); await sig.ready; sig.send({ t: 'decline' }); setTimeout(() => sig.close(), 1500);
    if (c?.kind === 'dm') B.updateCall(row.id, { status: 'ended', ended_at: new Date().toISOString() }).catch(() => {});
  },

  /* ── signaling ── */
  async handle(p) {
    const C = this.cur; if (!C || !p || p.from === S.me.user_id) return;
    if (p.to && p.to !== S.me.user_id) return;
    try {
      if (p.t === 'hello') { this.answeredBy(p.from); this.peer(p.from); return; }
      if (p.t === 'desc') {
        this.answeredBy(p.from);
        const P = this.peer(p.from), pc = P.pc, d = p.d;
        const collision = d.type === 'offer' && (P.making || pc.signalingState !== 'stable');
        P.ignore = !P.polite && collision; if (P.ignore) return;

      if (p.t === 'decline') { if (S.conv.get(C.conv)?.kind === 'dm') { toast(t('decline'), 'info'); this.end('declined'); } return; }
      if (p.t === 'state') { const P = C.peers.get(p.from); if (P) { P.mic = p.mic; P.cam = p.cam; this.paintTiles(); } return; }
      if (p.t === 'demo-join') { this.answeredBy(p.from); C.peers.set(p.from, { fake: true, mic: true, cam: false }); this.paintTiles(); this._demoTalk = setInterval(() => { const tl = $(`.tile[data-u="${p.from}"]`); tl && tl.classList.toggle('speaking', Math.random() > .45); }, 600); }
    } catch (e) { console.warn('sig', e); }
  },
  answeredBy(u) {
    const C = this.cur; if (C.answered && C.t0) { if (!C.peers.has(u)) setTimeout(() => this.paintTiles(), 0); return; }
    C.answered = true; C.t0 = Date.now(); clearTimeout(C.noAnswer); Sound.ring(false);
    this.render('active');
  },
  peer(u) {
    const C = this.cur; let P = C.peers.get(u); if (P && P.pc) return P;
    const pc = new RTCPeerConnection({ iceServers: CFG.ice });
    P = { pc, polite: S.me.user_id < u, making: false, ignore: false, stream: new MediaStream(), mic: true, cam: C.media === 'video' };
    C.peers.set(u, P);
    C.local.getTracks().forEach(tr => pc.addTrack(tr, C.local));

  },
  dropPeer(u) { const P = this.cur?.peers.get(u); if (!P) return; try { P.pc?.close(); } catch {} P.raf && cancelAnimationFrame(P.raf); this.cur.peers.delete(u); this.paintTiles(); },
  meter(u, P) {

        $(`.tile[data-u="${u}"]`)?.classList.toggle('speaking', lvl > 18); P.raf = requestAnimationFrame(loop); };
      loop();
    } catch {}
  },

  /* ── UI ── */
  render(state) {
    const C = this.cur; if (!C) return;
    const c = S.conv.get(C.conv);
    let el = $('#callUI');
    if (!el) { el = h('<div class="call" id="callUI"></div>'); document.body.appendChild(el); }
    C.state = state;
    const remoteName = c ? convName(c) : '';
    if (state === 'outgoing') {
      el.innerHTML = `<div class="call-h"><div class="grow"><b>${esc(remoteName)}</b><small>${C.media === 'video' ? t('videoT') : t('audio')}</small></div></div>
        <div class="ringing">${c?.kind === 'dm' ? avHTML(memberOf(c.other_id), 132) : convAvHTML(c, 132, false)}<h2>${esc(remoteName)}</h2><p>${t('ringingT')}</p></div>
        ${C.media === 'video' ? `<div class="self-view" id="selfV"><video autoplay muted playsinline></video></div>` : ''}
        <div class="call-ctrl">${this.ctrlHTML()}</div>`;
    } else {
      el.innerHTML = `<div class="call-h"><button class="ibtn" id="cMin" title="minimize">${ic('minimize')}</button><div class="grow"><b>${esc(remoteName)}</b><small id="cTime">${state === 'connecting' ? t('connecting') : '0:00'}</small></div></div>
        <div class="call-grid" id="cGrid"></div>
        <div class="self-view ${C.cam || C.screen ? '' : 'hidden'}" id="selfV"><video autoplay muted playsinline></video></div>
        <div class="call-ctrl">${this.ctrlHTML()}</div>`;
      $('#cMin').onclick = e => { e.stopPropagation(); this.minimize(true); };
      this.paintTiles(); this.tick();
    }
    const sv = $('#selfV video'); if (sv) { sv.srcObject = C.local; if (C.screen) sv.style.transform = 'none'; }

    el.onclick = () => C.mini && this.minimize(false);
    this.dragSelf();
  },
  ctrlHTML() {
    const C = this.cur, mob = S.mobile;
    return `<button class="cbtn ${C.mic ? '' : 'off'}" data-k="mic" title="mic">${ic(C.mic ? 'mic' : 'micOff')}</button>
      <button class="cbtn ${C.cam ? '' : 'off'}" data-k="cam" title="camera">${ic(C.cam ? 'video' : 'videoOff')}</button>
      ${mob && C.cam ? `<button class="cbtn" data-k="flip">${ic('flip')}</button>` : ''}
      ${!mob && navigator.mediaDevices?.getDisplayMedia ? `<button class="cbtn ${C.screen ? 'off' : ''}" data-k="screen" title="${t('screen')}">${ic('monitor')}</button>` : ''}
      <button class="cbtn end" data-k="end" title="end">${ic('phoneOff')}</button>`;
  },
  bindCtrl() { $$('#callUI .cbtn').forEach(b => b.onclick = e => { e.stopPropagation(); this.ctrl(b.dataset.k); }); },
  async ctrl(k) {
    const C = this.cur; if (!C) return;
    if (k === 'end') return this.end(C.answered ? null : 'missed');
    if (k === 'mic') { C.mic = !C.mic; C.local.getAudioTracks().forEach(tr => tr.enabled = C.mic); }
    if (k === 'cam') {
      const vt = C.local.getVideoTracks()[0];
      if (vt) { C.cam = !C.cam; vt.enabled = C.cam; }
      else { try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: C.facing } }); const tr = s.getVideoTracks()[0]; C.local.addTrack(tr); C.peers.forEach(P => P.pc && P.pc.addTrack(tr, C.local)); C.cam = true; } catch { return toast(t('callMicErr'), 'err'); } }
    }
    if (k === 'flip') {
      C.facing = C.facing === 'user' ? 'environment' : 'user';
      try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: C.facing } }); const nt = s.getVideoTracks()[0], old = C.local.getVideoTracks()[0];
        C.peers.forEach(P => P.pc?.getSenders().find(x => x.track?.kind === 'video')?.replaceTrack(nt)); if (old) { C.local.removeTrack(old); old.stop(); } C.local.addTrack(nt); } catch {}
    }

      if (C.screen) { this.stopScreen(); }

        try { const s = await navigator.mediaDevices.getDisplayMedia({ video: true }); const st = s.getVideoTracks()[0]; C.screen = st;
          C.peers.forEach(P => { const snd = P.pc?.getSenders().find(x => x.track?.kind === 'video'); snd ? snd.replaceTrack(st) : P.pc?.addTrack(st, C.local); });
          st.onended = () => this.stopScreen();
          const sv = $('#selfV video'); if (sv) { sv.srcObject = new MediaStream([st]); sv.style.transform = 'none'; }
        } catch {}
      }
    }
    C.sig.send({ t: 'state', mic: C.mic, cam: C.cam || !!C.screen });
    const ctl = $('#callUI .call-ctrl'); if (ctl) { ctl.innerHTML = this.ctrlHTML(); this.bindCtrl(); }
    const sv = $('#selfV'); if (sv) { sv.classList.toggle('hidden', !(C.cam || C.screen) && C.state !== 'outgoing'); if (!C.screen) { $('video', sv).srcObject = C.local; $('video', sv).style.transform = ''; } }
  },
  stopScreen() {
    const C = this.cur; if (!C?.screen) return; C.screen.stop();
    const cam = C.local.getVideoTracks()[0];
    C.peers.forEach(P => P.pc?.getSenders().find(x => x.track === C.screen)?.replaceTrack(cam || null));
    C.screen = null; this.ctrl('noop');
  },
  paintTiles() {
    const C = this.cur, g = $('#cGrid'); if (!C || !g) return;
    const ids = [...C.peers.keys()];
    g.style.setProperty('--cols', ids.length <= 1 ? 1 : ids.length <= 4 ? 2 : 3);
    if (!ids.length) { g.innerHTML = `<div class="tile"><div style="text-align:center">${convAvHTML(S.conv.get(C.conv), 110, false)}<p style="margin-top:16px;opacity:.7">${t('connecting')}</p></div></div>`; hydrate(g); return; }
    // نحافظ على عناصر الفيديو الموجودة
    $$('.tile', g).forEach(tl => { if (!tl.dataset.u || !C.peers.has(tl.dataset.u)) tl.remove(); });
    ids.forEach(u => {
      const P = C.peers.get(u), m = memberOf(u);
      let tl = $(`.tile[data-u="${u}"]`, g);
      if (!tl) { tl = h(`<div class="tile" data-u="${u}"><video autoplay playsinline></video>${avHTML(m, 110)}<div class="who"></div><span class="st hidden"></span></div>`); g.appendChild(tl); hydrate(tl); }
      const v = $('video', tl);
      if (P.stream && v.srcObject !== P.stream) { v.srcObject = P.stream; v.play?.().catch(() => {}); }
      const hasV = P.stream && P.stream.getVideoTracks().some(x => x.readyState === 'live' && !x.muted) && P.cam !== false;
      v.style.opacity = hasV ? 1 : 0; $('.av', tl).style.display = hasV ? 'none' : '';
      $('.who', tl).innerHTML = `${P.mic === false ? ic('micOff') : ''}${esc(m.display_name)}`;
      const st = $('.st', tl); const bad = P.state && !['connected', 'new', 'connecting'].includes(P.state);
      st.classList.toggle('hidden', !bad && P.state !== 'connecting'); st.textContent = P.state === 'connecting' ? t('connecting') : P.state || '';

    });
  },
  tick() {

  },
  minimize(on) { const C = this.cur; if (!C) return; C.mini = on; $('#callUI').classList.toggle('mini', on); },
  dragSelf() {

  /* ── end ── */
  async end(status, remote) {

    clearTimeout(C.noAnswer); clearInterval(this._tick); clearInterval(this._demoTalk); Sound.ring(false);
    window.removeEventListener('beforeunload', this._unload);

    setTimeout(() => C.sig.close(), 800);
    C.peers.forEach(P => { try { P.pc?.close(); } catch {} P.raf && cancelAnimationFrame(P.raf); });
    C.local.getTracks().forEach(tr => tr.stop()); C.screen?.stop();
    const el = $('#callUI'); if (el) { el.style.transition = 'opacity .3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }
    const dur = C.t0 ? Math.round((Date.now() - C.t0) / 1000) : 0;
    toast(`${t('callEnded')}${dur ? ' · ' + fmtDur(dur) : ''}`, 'info');
    const conv = S.conv.get(C.conv);
    const last = conv?.kind === 'dm' || C.peers.size === 0;
    if (last && !remote) B.updateCall(C.id, { status: 'ended', ended_at: new Date().toISOString() }).catch(() => {});
    if (C.role === 'caller') {
      const st = status || (C.answered ? 'done' : 'missed');
      dispatch({ conversation_id: C.conv, kind: 'call', body: JSON.stringify({ media: C.media, dur, status: st, call: C.id }), mentions: [] });
    }
  },
};
