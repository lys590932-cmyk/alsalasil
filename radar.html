<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>رادار السلاسل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;800&display=swap">
<style>
/* Layout: operations console — dark-petrol nav rail on the start side, light working canvas; pulse band → KPI sparks → boards. Semantic green/red only for performance. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#f1f5f7; --surface-3:#e8eef1; --line:#e0e7eb; --line-2:#cfdbe1;
  --ink:#0e2630; --ink-2:#4b6570; --ink-3:#8399a2;
  --brand:#004e6d; --brand-2:#9a232e; --accent:#0b6b90; --accent-soft:#e3f0f5;
  --side:#032d40; --side-2:#0a3c53; --side-ink:#d8e8ee; --side-mute:#86a7b4;
  --good:#127a45; --good-bg:#e1f3e8; --bad:#b42f3a; --bad-bg:#fbe6e8; --bad-strong:#c0392b; --abs-bg:#f5bcc1; --abs-ink:#8a1c25; --warn:#9a6400; --warn-bg:#fdf1d8; --new:#e9b730; --new-bg:#fff5d6;
  --moto:#9a232e; --car:#0b6b90;
  --shadow:0 1px 1px rgba(10,40,55,.04),0 2px 8px rgba(10,40,55,.05);
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071820; --surface:#0d222c; --surface-2:#112b36; --surface-3:#163542; --line:#1b3a47; --line-2:#24495a;
  --ink:#e3eef2; --ink-2:#9ab6c1; --ink-3:#6c8b97;
  --brand:#0b4a66; --brand-2:#ff6b75; --accent:#7cc4e0; --accent-soft:#12394a;
  --side:#04141b; --side-2:#0c2733; --side-ink:#d8e8ee; --side-mute:#7997a3;
  --good:#5fd394; --good-bg:#0f3624; --bad:#ff7b85; --bad-bg:#3a161a; --bad-strong:#d9434f; --abs-bg:#6b2a31; --abs-ink:#ffd3d7; --warn:#f2b84b; --warn-bg:#36290d; --new:#f2c94c; --new-bg:#352d10;
  --moto:#ff8a93; --car:#7cc4e0; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071820; --surface:#0d222c; --surface-2:#112b36; --surface-3:#163542; --line:#1b3a47; --line-2:#24495a;
  --ink:#e3eef2; --ink-2:#9ab6c1; --ink-3:#6c8b97;
  --brand:#0b4a66; --brand-2:#ff6b75; --accent:#7cc4e0; --accent-soft:#12394a;
  --side:#04141b; --side-2:#0c2733; --side-ink:#d8e8ee; --side-mute:#7997a3;
  --good:#5fd394; --good-bg:#0f3624; --bad:#ff7b85; --bad-bg:#3a161a; --bad-strong:#d9434f; --abs-bg:#6b2a31; --abs-ink:#ffd3d7; --warn:#f2b84b; --warn-bg:#36290d; --new:#f2c94c; --new-bg:#352d10;
  --moto:#ff8a93; --car:#7cc4e0; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
button,select,input{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--new);outline-offset:2px}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px calc(16px + env(safe-area-inset-bottom,0px));padding-inline-start:max(14px,env(safe-area-inset-left,0px));gap:14px;overflow-y:auto}
html[dir="ltr"] .side{padding-inline-start:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.links{width:36px;height:24px;position:relative;flex:none}
.links i{position:absolute;top:3px;width:21px;height:17px;border:3px solid #e9f4f8;border-radius:9px}
.links i:first-child{inset-inline-start:0}.links i:last-child{inset-inline-start:13px;border-color:#ff6b75}
.brand h1{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:0;line-height:1.3;color:#fff}
.brand small{display:block;font-size:11.5px;color:var(--side-mute);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--side-mute);padding:10px 10px 4px;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-ink);padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13.5px;text-align:start;width:100%;opacity:.86}
.nv svg{width:18px;height:18px;flex:none;opacity:.8}
.nv:hover{background:var(--side-2);opacity:1}
.nv[aria-current="page"]{background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.06));opacity:1;font-weight:600;box-shadow:inset 3px 0 0 #ff6b75}
html[dir="rtl"] .nv[aria-current="page"]{box-shadow:inset -3px 0 0 #ff6b75;background:linear-gradient(270deg,rgba(255,255,255,.12),rgba(255,255,255,.06))}
.nv .c{margin-inline-start:auto;font-size:11px;font-weight:600;border-radius:20px;padding:0 7px;background:rgba(255,255,255,.1);direction:ltr}
.nv .c.r{background:rgba(255,107,117,.2);color:#ffb3b9}.nv .c.g{background:rgba(95,211,148,.18);color:#9ef0c2}
.side-foot{margin-top:auto;display:grid;gap:8px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:9px 12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-weight:600;font-size:13px}
.sbtn:hover{background:rgba(255,255,255,.12)}
.sbtn.hero{background:#fff;color:#023a51;border-color:transparent}
.sbtn.hero:hover{background:#e9f4f8}
.sbtn svg{width:16px;height:16px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sstat{font-size:11.5px;color:var(--side-mute);display:grid;gap:3px;padding:8px 4px 0;border-top:1px solid rgba(255,255,255,.08)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--side-mute);margin-inline-end:6px;vertical-align:1px}
.dot.ok{background:#5fd394}.dot.warn{background:#f2b84b}

.main{min-width:0;padding-block:18px 10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.top .ttl{min-width:0}
.top h2{font-family:var(--f-disp);font-size:24px;font-weight:800;margin:0;letter-spacing:-.2px;line-height:1.25;text-wrap:balance}
.top .meta{color:var(--ink-2);font-size:12.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-inline-start:auto}
.fld{display:flex;align-items:center;gap:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;overflow:hidden;height:36px}
.fld span{font-size:11.5px;color:var(--ink-3);padding-inline:10px 4px;font-weight:600;white-space:nowrap}
.fld select{border:0;background:transparent;padding:0 8px;height:100%;font-weight:600;max-width:170px;cursor:pointer}
.fld select option{color:#0e2630;background:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 13px;height:36px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.mtabs{display:none}

/* ===== cards & grids ===== */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (min-width:1280px){.kpis{grid-template-columns:repeat(8,minmax(0,1fr))}.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.span2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:1100px){.span2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.card h3 .sub{font-weight:500;color:var(--ink-3);font-size:12px}
.card h3 .act{margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--ink-3);text-transform:uppercase}
.kpi{padding:14px 16px 10px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.25;margin-top:2px;direction:ltr;unicode-bidi:isolate;text-align:start}
html[dir="rtl"] .kpi .val{text-align:right}
.kpi .val small{font-size:13px;font-weight:600;color:var(--ink-3)}
.kpi .cmp{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:20px}
.spark{display:block;width:100%;height:30px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:0 7px;font-size:11px;font-weight:700;direction:ltr;line-height:18px}
.chip.g{background:var(--good-bg);color:var(--good)}.chip.r{background:var(--bad-bg);color:var(--bad)}.chip.n{background:var(--surface-3);color:var(--ink-2)}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:19px}
.pill.g{background:var(--good-bg);color:var(--good)}.pill.r{background:var(--bad-bg);color:var(--bad)}.pill.n{background:var(--surface-3);color:var(--ink-2)}.pill.y{background:var(--warn-bg);color:var(--warn)}
.veh{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid currentColor;white-space:nowrap;line-height:16px}
.veh.M{color:var(--moto)}.veh.C{color:var(--car)}
.chart{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}

/* pulse band */
.pulse{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden;margin-bottom:14px}
.pulse .pa{padding:20px 22px;display:grid;gap:12px;align-content:start}
.pulse .pb{padding:20px 22px;background:var(--surface-2);border-inline-start:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-content:center}
@media (max-width:900px){.pulse{grid-template-columns:1fr}.pulse .pb{border-inline-start:0;border-top:1px solid var(--line)}}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1;direction:ltr;unicode-bidi:isolate}
.big span{color:var(--ink-2);font-size:14px}
.track{position:relative;height:14px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.track .a{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:8px}
html[dir="rtl"] .track .a{background:linear-gradient(270deg,var(--brand),var(--accent))}
.track .f{position:absolute;inset-block:0;background:repeating-linear-gradient(135deg,var(--new) 0 6px,var(--new-bg) 6px 11px);opacity:.9}
.track .m{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.vsplit{display:flex;flex-wrap:wrap;gap:10px}
.vs{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface-2)}
.vs b{font-size:18px;font-weight:700}
.trackx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);gap:10px;flex-wrap:wrap}
.ms{display:grid;gap:2px}
.ms .k{font-size:11.5px;color:var(--ink-2);font-weight:600}
.ms .v{font-size:20px;font-weight:700;direction:ltr;unicode-bidi:isolate;text-align:start}
html[dir="rtl"] .ms .v{text-align:right}
.ms .s{font-size:11.5px;color:var(--ink-3)}

/* leaderboard */
.lead{display:grid;gap:2px}
.lr{display:grid;grid-template-columns:20px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 6px;border-radius:9px;cursor:pointer}
.lr:hover{background:var(--surface-2)}
.lr .rk{font-size:12px;color:var(--ink-3);text-align:center;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:.3px;direction:ltr}
.av.C{background:linear-gradient(135deg,#0b6b90,#004e6d)}.av.M{background:linear-gradient(135deg,#c2414b,#9a232e)}
.lr .who{min-width:0;display:grid;gap:4px}
.lr .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
html[dir="rtl"] .lr .who b{text-align:right}
.lr .v{font-weight:700;direction:ltr;text-align:end;font-size:13.5px}
.lr .v small{display:block;font-weight:500;color:var(--ink-3);font-size:11px}
.meter{height:5px;border-radius:4px;background:var(--surface-3);overflow:hidden;position:relative}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:var(--accent)}
.meter i.g{background:var(--good)}.meter i.y{background:var(--warn)}.meter i.r{background:var(--bad)}

/* tables */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:72vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:11.5px;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;letter-spacing:.2px}
th[data-k]:hover{color:var(--ink)}
th .arr{opacity:.7;font-size:9px;margin-inline-start:4px}
tbody tr:last-child td{border-bottom:0}
td.name{text-align:start;font-weight:600;direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] td.name{text-align:right}
td.note{text-align:start;white-space:normal;min-width:300px;color:var(--ink-2);font-size:12.5px;line-height:1.5}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
td.g{background:var(--good-bg);color:var(--good);font-weight:700}td.r{background:var(--bad-bg);color:var(--bad);font-weight:700}
td.name.g,td.name.r{background:none}
td.name.g{box-shadow:inset 3px 0 0 var(--good)}td.name.r{box-shadow:inset 3px 0 0 var(--bad)}
html[dir="rtl"] td.name.g{box-shadow:inset -3px 0 0 var(--good)}html[dir="rtl"] td.name.r{box-shadow:inset -3px 0 0 var(--bad)}
td.name.g,td.name.r{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 12px;height:36px;min-width:0}
.filters input{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);height:36px}
.seg button{border:0;background:none;padding:0 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bar{display:inline-block;vertical-align:middle;width:56px;height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-inline-start:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}.bar i.g{background:var(--good)}.bar i.y{background:var(--warn)}.bar i.r{background:var(--bad)}.bar i.a{background:var(--accent)}

/* matrix */
.mx td,.mx th{padding:6px 7px;font-size:12px}
.mx td.c{min-width:36px;font-weight:500}
.mx td.lo{background:var(--bad-bg);color:var(--bad);font-weight:700}
.mx td.hi{background:var(--good-bg);color:var(--good);font-weight:700}
.mx td.pt{background:var(--warn-bg);color:var(--warn);font-weight:700}
.mx td.ab{background:var(--abs-bg);color:var(--abs-ink);font-weight:700;text-decoration:line-through}
.mx th.newd{background:var(--new-bg);color:var(--warn)}
.mx td.stick,.mx th.stick{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1}
.mx th.stick{z-index:3;background:var(--surface-2)}

/* insights */
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 22px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ins .tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;white-space:nowrap;margin-top:3px}
.tag.ov{background:var(--accent-soft);color:var(--accent)}.tag.up{background:var(--good-bg);color:var(--good)}.tag.dn{background:var(--bad-bg);color:var(--bad)}.tag.wt{background:var(--warn-bg);color:var(--warn)}.tag.in{background:var(--surface-3);color:var(--ink-2)}
.mini{display:grid;gap:2px}
.mini .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 6px;border-radius:8px}
.mini .row:hover{background:var(--surface-2);cursor:pointer}
.mini .rk{font-size:12px;color:var(--ink-3);text-align:center}
.mini .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
html[dir="rtl"] .mini .nm{text-align:right}
.mini .v{font-size:12.5px;color:var(--ink-2)}

/* messages */
.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.8;max-height:560px;overflow:auto;border:1px solid var(--line)}
.msgbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,20,28,.5);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(580px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.25);padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px))}
.drawer header{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.drawer h2{margin:0;font-size:20px;direction:ltr}
.drawer .x{margin-inline-start:auto}
.drawer .av{width:46px;height:46px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}

<script>
/* ═══ ARK bridge: رادار السلاسل يحفظ في Supabase بدل قاعدة الآرتيفاكت ═══ */
(function(){
  const URL0 = 'https://pqpowedqewjgkrzvmgyv.supabase.co/rest/v1/';
  const KEY  = 'sb_publishable_EX532ME5SLrt26Gp3YkRXQ_rt9-oaRT';
  const H = (extra) => Object.assign({apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json'}, extra||{});
  const api = async (path, opt) => { const r = await fetch(URL0+path, opt); if(!r.ok){ const t = await r.text().catch(()=> ''); const e = new Error('HTTP '+r.status+' '+t.slice(0,160)); e.code = r.status; throw e; } return r.status === 204 ? null : r.json().catch(()=>null); };
  const upsert = (table, rows, conflict) => api(table + (conflict?'?on_conflict='+conflict:''), {method:'POST', headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}), body:JSON.stringify(rows)});

  /* أيام الرادار → جدول keeta_daily (اللي بيقرا منه مسيّر الرواتب في ARK) */
  async function syncDaily(dayKey, rows){
    const s = String(dayKey), day = s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
    const out = [], names = [];
    for(const a of rows||[]){
      const r = Array.isArray(a) ? a : null; if(!r) continue;
      const on = +r[4]||0, dl = +r[5]||0;
      names.push({keeta_id:String(r[1]), keeta_name:r[2]||null});
      if(dl<=0 && on<=0) continue;
      out.push({day, keeta_id:String(r[1]), keeta_name:r[2]||null, vehicle:r[3]||null, online_hours:Math.round(on*100)/100, delivered:dl, cancelled:+r[6]||0,
                on_time:r[11]==null?null:+r[11], delivery_min:r[12]==null?null:+r[12], synced_at:new Date().toISOString()});
    }
    if(out.length) await upsert('keeta_daily', out, 'day,keeta_id');
    if(names.length){ try{ await api('keeta_map?on_conflict=keeta_id', {method:'POST', headers:H({Prefer:'resolution=ignore-duplicates,return=minimal'}), body:JSON.stringify(names)}); }catch(e){} }
  }

  function snapOf(docs){ return { docChanges: () => docs.map(d => ({type:d.removed?'removed':'added', doc:{id:d.id, data:()=>d.data}})) }; }
  function docSnap(data){ return { exists: data!=null, data: () => data }; }

  const listeners = { days:[], docs:{} };
  const known = new Map(); // path -> updated_at
  let lastPoll = null;

  async function fetchDays(since){
    const q = 'radar_store?select=path,data,updated_at&path=like.days%2F*' + (since ? '&updated_at=gt.'+encodeURIComponent(since) : '') + '&order=path.asc&limit=2000';
    return api(q, {headers:H()});
  }
  async function poll(){
    try{
      const rows = await fetchDays(lastPoll);
      if(rows && rows.length){
        const docs = [];
        for(const r of rows){ if(known.get(r.path) === r.updated_at) continue; known.set(r.path, r.updated_at); docs.push({id:r.path.slice(5), data:r.data}); if(!lastPoll || r.updated_at > lastPoll) lastPoll = r.updated_at; }
        if(docs.length) listeners.days.forEach(cb => cb(snapOf(docs)));
      }
      for(const p of Object.keys(listeners.docs)){
        const res = await api('radar_store?select=data,updated_at&path=eq.'+encodeURIComponent(p), {headers:H()});
        const row = res && res[0]; const stamp = row ? row.updated_at : null;
        if(known.get(p) !== stamp){ known.set(p, stamp); listeners.docs[p].forEach(cb => cb(docSnap(row ? row.data : null))); }
      }
    }catch(e){ console.warn('[radar-bridge] poll', e); }
  }

  /* أول تشغيل: لو المخزن فاضي، حمّل نسخة البيانات المنقولة من الرادار القديم */
  async function seedIfEmpty(){
    try{
      const head = await api('radar_store?select=path&path=like.days%2F*&limit=1', {headers:H()});
      if(head && head.length) return;
      const r = await fetch('radar_seed.json', {cache:'no-store'}); if(!r.ok) return;
      const seed = await r.json();
      const keys = Object.keys(seed.days||{}).sort();
      for(let i=0;i<keys.length;i+=4){
        const chunk = keys.slice(i,i+4);
        await upsert('radar_store', chunk.map(k => ({path:'days/'+k, data:seed.days[k]})), 'path');
        for(const k of chunk) await syncDaily(k, seed.days[k].rows);
      }
      if(seed.imports)  await upsert('radar_store', [{path:'meta/imports',  data:seed.imports}], 'path');
      if(seed.settings) await upsert('radar_store', [{path:'meta/settings', data:seed.settings}], 'path');
      console.log('[radar-bridge] seeded', keys.length, 'days');
    }catch(e){ console.warn('[radar-bridge] seed', e); }
  }

  const ready = seedIfEmpty();
  const DB = {
    collection(name){
      return {
        onSnapshot(cb, err){ listeners.days.push(cb); ready.then(poll).catch(e => err && err(e)); return () => {}; },
        doc(id){ return DB.doc(name+'/'+id); }
      };
    },
    doc(path){
      return {
        onSnapshot(cb){ (listeners.docs[path] = listeners.docs[path] || []).push(cb); ready.then(poll); return () => {}; },
        async set(data){
          await upsert('radar_store', [{path, data}], 'path');
          if(path.startsWith('days/') && data && Array.isArray(data.rows)) await syncDaily(path.slice(5), data.rows);
          try{ parent && parent !== window && parent.postMessage({type:'radar-updated', path}, '*'); }catch(e){}
        }
      };
    }
  };
  const DL = { async save({filename, data}){ const u = URL.createObjectURL(data); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); } };
  window.claude = { use: async cap => cap === 'db' ? DB : cap === 'downloads' ? DL : null };
  setInterval(poll, 60000);
})();
</script>

<script>
/* Al-Salasil Keeta analysis engine — same method as the Excel reports */
(function (root) {
  'use strict';
  // ---------- dates ----------
  const kd = k => { const s = String(k); return Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)); };
  const dayNo = k => Math.round(kd(k) / 864e5);
  const dow = k => new Date(kd(k)).getUTCDay(); // 0=Sun
  const keyFromDay = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); };
  const dd = k => +String(k).slice(6, 8);
  const ym = k => Math.floor(k / 100);

  // ---------- parsing ----------
  function hrs(s) {
    if (s == null) return 0;
    if (typeof s === 'number') return s;
    s = String(s);
    let h = 0;
    const m1 = s.match(/(\d+(?:\.\d+)?)\s*(?:hr|h|س)/); if (m1) h += +m1[1];
    const m2 = s.match(/(\d+(?:\.\d+)?)\s*(?:min|m(?!s)|د)/); if (m2) h += +m2[1] / 60;
    const m3 = s.match(/(\d+(?:\.\d+)?)\s*(?:sec|s|ث)/); if (m3) h += +m3[1] / 3600;
    return h;
  }
  const num = v => { if (v == null || v === '' || v === '-') return null; let t = String(v).trim().replace(/,/g, ''); let k = 1; if (t.endsWith('%')) { t = t.slice(0, -1); k = 100; } const n = +t / k; return isFinite(n) ? n : null; };
  const n0 = v => num(v) || 0;
  function titleCase(s) { return String(s || '').trim().toLowerCase().replace(/(^|[\s'-])([a-z])/g, (m, a, b) => a + b.toUpperCase()); }
  // shift schedule: "12:00-14:00,On-Shift,2 hr,qualified|..." → scheduled/qualified slots and hours
  function parseSched(s, flag) {
    const f = String(flag == null ? '' : flag).trim();
    const sch = /^(yes|نعم)$/i.test(f) ? 1 : /^(no|لا)$/i.test(f) ? 0 : null;
    const out = { sch, sl: 0, sq: 0, shr: 0, qhr: 0, son: 0 };
    if (s == null || s === '') return out;
    for (const p of String(s).split('|')) {
      const parts = p.split(',').map(x => x.trim()); if (parts.length < 3) continue;
      const m = parts[0].match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/); if (!m) continue;
      const len = (+m[3] + +m[4] / 60) - (+m[1] + +m[2] / 60);
      if (!/^on-?shift$/i.test(parts[1])) continue;
      const last = parts[parts.length - 1].toLowerCase();
      const q = last === 'qualified' ? 1 : last === 'unqualified' ? 0 : null;
      const dur = hrs(parts.slice(2, q == null ? parts.length : parts.length - 1).join(' '));
      out.sl++; out.shr += len; out.son += Math.min(len, dur); if (q === 1) { out.sq++; out.qhr += len; }
    }
    out.shr = Math.round(out.shr * 100) / 100; out.qhr = Math.round(out.qhr * 100) / 100; out.son = Math.round(out.son * 1000) / 1000;
    if (out.sl && sch == null) out.sch = 1;
    return out;
  }
  // Keeta "courier daily performance" export: 29 fixed columns (English or Arabic headers)
  function parseAoa(aoa) {
    let h = 0;
    while (h < aoa.length && !(aoa[h] && aoa[h].length >= 25 && /date|التاريخ/i.test(String(aoa[h][0] || '')))) h++;
    if (h >= aoa.length) throw new Error('format');
    const rows = [];
    for (let i = h + 1; i < aoa.length; i++) {
      const r = aoa[i]; if (!r || r[0] == null || r[1] == null || r[0] === '') continue;
      const key = Math.round(num(r[0])); if (!key || key < 20000101) continue;
      rows.push({
        d: key, id: String(r[1]).replace(/\.0+$/, '').trim(), n: titleCase((r[2] || '') + ' ' + (r[3] || '')),
        v: /motor/i.test(String(r[5])) ? 'M' : 'C', on: Math.round(hrs(r[11]) * 1000) / 1000,
        dl: n0(r[15]), cx: n0(r[17]), rj: n0(r[18]), rc: n0(r[19]), ra: n0(r[20]), dlb: n0(r[21]),
        ot: num(r[23]), dt: num(r[25]), o55: num(r[26]), od: n0(r[27]), sv: n0(r[28]),
        ...parseSched(r[7], r[8]), pk: Math.round(hrs(r[12]) * 1000) / 1000, app: Math.round(hrs(r[10]) * 1000) / 1000
      });
    }
    return rows;
  }

  // ---------- aggregation ----------
  let ABS = 4; // a roster day with fewer orders than this counts as an absence
  function agg(rows) {
    const m = new Map();
    for (const r of rows) {
      let a = m.get(r.id);
      if (!a) { a = { id: r.id, name: r.n, v: r.v, joined: r.d, last: r.d, roster: 0, active: 0, delivered: 0, online: 0, cancelled: 0, rejected: 0, rc: 0, ra: 0, dlb: 0, overdue: 0, sev: 0, otw: 0, dtw: 0, o55w: 0, dtD: 0, lastDeliv: null, lastWork: null, workDl: 0, absent: 0, schInfo: 0, schDays: 0, shr: 0, qhr: 0, son: 0, sl: 0, sq: 0, fullDays: 0, missDays: 0, pk: 0 }; m.set(r.id, a); }
      if (r.d >= a.last) { a.name = r.n; a.v = r.v; }
      a.joined = Math.min(a.joined, r.d); a.last = Math.max(a.last, r.d);
      a.roster++; if (r.dl > 0) a.lastDeliv = Math.max(a.lastDeliv || 0, r.d);
      if (r.dl >= ABS) { a.active++; a.workDl += r.dl; a.lastWork = Math.max(a.lastWork || 0, r.d); } else a.absent++;
      a.delivered += r.dl; a.online += r.on; a.cancelled += r.cx; a.rejected += r.rj; a.rc += r.rc; a.ra += r.ra; a.dlb += r.dlb; a.overdue += r.od; a.sev += r.sv;
      a.otw += (r.ot || 0) * r.dl; a.dtw += (r.dt || 0) * r.dl; a.o55w += (r.o55 || 0) * r.dl;
      a.pk += r.pk || 0;
      if (r.sch != null) { a.schInfo++; if (r.sch === 1 && r.sl) { a.schDays++; a.shr += r.shr || 0; a.qhr += r.qhr || 0; a.son += r.son || 0; a.sl += r.sl || 0; a.sq += r.sq || 0; if (r.sq === r.sl) a.fullDays++; else a.missDays++; } }
    }
    for (const a of m.values()) {
      const D = a.delivered || null;
      a.ontime = D ? a.otw / D : null; a.avgdt = D ? a.dtw / D : null; a.over55 = D ? a.o55w / D : null;
      a.perActive = a.active ? a.workDl / a.active : null; a.attend = a.roster ? a.active / a.roster : null; a.hrsDay = a.roster ? a.online / a.roster : null; a.adh = a.shr ? a.qhr / a.shr : null; a.perRoster = a.delivered / a.roster;
      a.perHr = a.online ? a.delivered / a.online : null;
      a.rejRate = (a.delivered + a.rejected) ? a.rejected / (a.delivered + a.rejected) : null;
    }
    return m;
  }
  const wavg = (rows, f) => { let s = 0, w = 0; for (const r of rows) { if (r.dl > 0) { s += (r[f] || 0) * r.dl; w += r.dl; } } return w ? s / w : null; };
  function pctRank(vals) { // pandas rank(pct=True, method='average'), ascending
    const idx = vals.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]); const out = new Array(vals.length); const n = vals.length;
    for (let i = 0; i < n;) { let j = i; while (j + 1 < n && idx[j + 1][0] === idx[i][0]) j++; const avg = (i + j) / 2 + 1; for (let k = i; k <= j; k++) out[idx[k][1]] = avg / n; i = j + 1; }
    return out;
  }
  const median = a => { const s = [...a].sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; };

  // status keys: normal | new | stopped | zero | left
  function classify(rows, end) {
    const upto = rows.filter(r => r.d <= end);
    const m = agg(upto); const e = dayNo(end);
    const l7 = new Map(), p7 = new Map();
    for (const r of upto) { const x = e - dayNo(r.d); if (x < 7) l7.set(r.id, (l7.get(r.id) || 0) + r.dl); else if (x < 14) p7.set(r.id, (p7.get(r.id) || 0) + r.dl); }
    const list = [...m.values()];
    for (const a of list) {
      a.last7 = l7.get(a.id) || 0; a.prev7 = p7.get(a.id) || 0;
      a.status = a.last < end ? 'left' : a.delivered === 0 ? 'zero' : (a.last7 === 0 || !a.lastWork || e - dayNo(a.lastWork) >= 7) ? 'stopped' : (a.active < 5 || a.roster < 8) ? 'new' : 'normal';
      a.score = null; a.green = false;
    }
    const rated = list.filter(a => a.status === 'normal');
    if (rated.length) {
      // productivity 70% (orders per roster day), delivery speed 20% (lower average time ranks higher), on-time 10%
      const p1 = pctRank(rated.map(a => a.perRoster)), p2 = pctRank(rated.map(a => a.perHr || 0)), p3 = pctRank(rated.map(a => a.ontime || 0)), p4 = pctRank(rated.map(a => a.attend || 0)), p5 = pctRank(rated.map(a => -(a.rejRate || 0)));
      const pdt = pctRank(rated.map(a => -(a.avgdt == null ? 99 : a.avgdt)));
      rated.forEach((a, i) => { a.score = 100 * (W.vol * p1[i] + W.dt * pdt[i] + W.ot * p3[i]); });
    }
    const volBar = 0.8 * median(rated.map(a => a.perRoster));
    for (const a of rated) a.green = a.score >= 50 && a.perRoster >= volBar;

/* ---------- auto-written findings & group messages ---------- */
function facts(M) {
  const list = M.C.list, rated = list.filter(a => a.status === 'normal');
  const by = (arr, f, dir = 1) => [...arr].sort((a, b) => dir * (f(a) - f(b)));
  const maxDel = Math.max(0, ...list.map(a => a.delivered));
  const act50 = rated.filter(a => a.delivered >= 50 && a.avgdt != null);
  const gain = a => (a.cmp.nPer != null && a.cmp.pPer != null) ? a.cmp.nPer - a.cmp.pPer : 0;
  const up = by(list.filter(a => a.cmp.verdict === 'up'), a => a.cmp.pts * 100 + gain(a), -1);
  const down = by(list.filter(a => a.cmp.verdict === 'down'), a => a.cmp.pts * 100 + gain(a));
  const climbers = by(list.filter(a => a.green && a.cmp.pRank && a.cmp.pRank - a.rank >= 3), a => a.cmp.pRank - a.rank, -1);
  const newJoin = list.filter(a => M.prevEnd && a.joined > M.prevEnd);
  return {
    list, rated, top: list.filter(a => a.green).slice(0, 5),
    most: list.filter(a => a.delivered === maxDel && maxDel > 0), maxDel,
    fastest: by(act50, a => a.avgdt)[0], fast5: by(act50, a => a.avgdt).slice(0, 5), slow5: by(act50, a => a.avgdt, -1).slice(0, 5),
    bottom: by(rated.filter(a => !a.green), a => a.score).slice(0, 5),
    up, down, climber: climbers[0],
    offs: [...new Map(M.offs.map(o => [o.id, o])).values()],
    zero: list.filter(a => a.status === 'zero'), stopped: list.filter(a => a.status === 'stopped'),
    rejTop: by(list.filter(a => a.rejected > 0), a => a.rejected, -1).slice(0, 4),
    motoUp: up.filter(a => a.v === 'M'), carUp: up.filter(a => a.v === 'C'), newJoin,
    onTrack: list.filter(a => a.fc && (a.fc.tStatus === 'ontrack' || a.fc.tStatus === 'done')).sort((x, y) => y.fc.proj - x.fc.proj),
    close: list.filter(a => a.fc && a.fc.tStatus === 'close').sort((x, y) => y.fc.proj - x.fc.proj),
    absTop: list.filter(a => (a.status === 'normal' || a.status === 'new') && a.absent >= 3).sort((x, y) => y.absent - x.absent).slice(0, 6),
    newDowNames: lang => { const ds = [...new Set(M.newDays.map(k => KE.dow(k)))]; const n = ds.map(d => DAYS_L[lang][d]); return lang === 'ar' ? n.join(' و') : n.join(' & '); }
  };
}
const ISO = s => '\u2068' + s + '\u2069';
const names = (arr, lang, f) => arr.map(f ? (a => ISO(f(a))) : (a => ISO(a.name))).join(lang === 'ar' ? '، ' : ', ');

function insights(M, lang = LANG) {
  const F = facts(M), ar = lang === 'ar', out = [];
  const K = M.K, sd = M.sameDow;
  // 1 overall
  let s = ar ? `${K.green} أخضر و${K.red} أحمر. الخضر بيوصّلوا ${pct(K.greenShare)} من الطلبات. إجمالي الشهر ${fmt(K.orders)} طلب، بمتوسط ${fmt(K.perDay)} طلب في اليوم.`
    : `${K.green} GREEN and ${K.red} RED drivers. GREEN drivers deliver ${pct(K.greenShare)} of all orders. ${fmt(K.orders)} orders month-to-date, ${fmt(K.perDay)} a day on average.`;
  if (M.prevEnd && sd.now != null && sd.before) {
    const ch = (sd.now - sd.before) / sd.before;
    s += ar ? ` أيام ${F.newDowNames('ar')} الجديدة متوسطها ${fmt(sd.now)} طلب/يوم مقابل ${fmt(sd.before)} في نفس الأيام قبل كده (${sgn(ch * 100, 0)}%).`
      : ` The new ${F.newDowNames('en')} averaged ${fmt(sd.now)} orders/day vs ${fmt(sd.before)} on the same weekdays before (${sgn(ch * 100, 0)}%).`;
  }
  out.push({ tag: 'ov', t: s });
  // forecast
  const FC = M.FC, cfg = M.cfg;
  if (FC.remaining.length) out.push({ tag: 'ov', t: ar ? `توقع نهاية الشهر: ${ISO(fmt(FC.projected))} طلب (المدى ${ISO(fmt(FC.low) + '–' + fmt(FC.high))}). مجموع توقعات السائقين ${ISO(fmt(FC.bottomUp))}. دقة التوقع اليومي في الاختبار الرجعي ${ISO(pct(FC.accuracy))}.` : `Month-end forecast: ${fmt(FC.projected)} orders (range ${fmt(FC.low)}–${fmt(FC.high)}). Sum of driver forecasts ${fmt(FC.bottomUp)}. Daily backtest accuracy ${pct(FC.accuracy)}.` });
  if (FC.remaining.length) out.push({ tag: F.onTrack.length ? 'up' : 'wt', t: ar ? `الهدف (سيارات ${cfg.targetC} · موتوسيكل ${cfg.targetM}): ${F.onTrack.length} في الطريق${F.onTrack.length ? ' (' + names(F.onTrack, lang, a => `${a.name} ${fmt(a.fc.proj)}`) + ')' : ''}، و${F.close.length} قريبين${F.close.length ? ' (' + names(F.close, lang, a => `${a.name} ${fmt(a.fc.proj)}، محتاج ${fmt(a.fc.need, 1)}/يوم`) + ')' : ''}.` : `Monthly target (cars ${cfg.targetC} · motorcycles ${cfg.targetM}): ${F.onTrack.length} on track${F.onTrack.length ? ' (' + names(F.onTrack, lang, a => `${a.name} ${fmt(a.fc.proj)}`) + ')' : ''}, ${F.close.length} close${F.close.length ? ' (' + names(F.close, lang, a => `${a.name} ${fmt(a.fc.proj)}, needs ${fmt(a.fc.need, 1)}/day`) + ')' : ''}.` });
  // absence
  const A = M.ATT;
  if (A.lastDay) out.push({ tag: 'wt', t: (ar ? `الغياب (يوم بأقل من ${cfg.absMin} طلبات) بين السائقين الشغالين: ${pct(A.rate, 1)} من أيام القائمة. آخر يوم (${dLabel(A.lastDay.k, 'ar')}) غاب ${A.lastDay.absent} من ${A.lastDay.roster}.` : `Absence (a day under ${cfg.absMin} orders) among working drivers: ${pct(A.rate, 1)} of roster days. On the last day (${dLabel(A.lastDay.k, 'en')}) ${A.lastDay.absent} of ${A.lastDay.roster} were absent.`) + (F.absTop.length ? (ar ? ' الأكثر غياباً: ' : ' Most absences: ') + names(F.absTop, lang, a => `${a.name} (${a.absent})`) + '.' : '') });
  // 2 best
  if (F.top.length) {
    const t1 = F.top[0];
    s = ar ? `الأفضل: ${ISO(t1.name)} الأول (درجة ${fmt(t1.score, 1)}). الأعلى في الطلبات: ${names(F.most, lang)} (${fmt(F.maxDel)}).` : `Best: ${ISO(t1.name)} is #1 (score ${fmt(t1.score, 1)}). Most orders: ${names(F.most, lang)} (${fmt(F.maxDel)}).`;
    if (F.fastest) s += ar ? ` الأسرع في الأسطول: ${ISO(F.fastest.name)} (${fmt(F.fastest.avgdt, 1)} دقيقة).` : ` Fastest in the fleet: ${ISO(F.fastest.name)} (${fmt(F.fastest.avgdt, 1)} min).`;
    if (F.climber) s += ar ? ` ${ISO(F.climber.name)} طلع من المركز ${F.climber.cmp.pRank} للمركز ${F.climber.rank}.` : ` ${ISO(F.climber.name)} climbed from #${F.climber.cmp.pRank} to #${F.climber.rank}.`;
    out.push({ tag: 'up', t: s });
  }
  // 3 worst
  if (F.bottom.length) out.push({ tag: 'dn', t: (ar ? 'الأضعف بين المُقيَّمين: ' : 'Weakest rated drivers: ') + names(F.bottom.slice(0, 5), lang, a => `${a.name} (${fmt(a.delivered)}${ar ? ' طلب' : ''})`) + '.' });
  if (M.prevEnd) {
    // 4 improved
    const u = F.up.slice(0, 5).map(a => ISO(a.cmp.nPer != null && a.cmp.pPer != null ? `${a.name} ${fmt(a.cmp.pPer, 1)} → ${fmt(a.cmp.nPer, 1)}` : a.name));
    out.push({ tag: 'up', t: ar ? `اتطوروا (${F.up.length} سائق) — طلبات لكل يوم عمل مقارنة بنفس الأيام قبل كده: ${u.join('، ')}.` : `Improved (${F.up.length} drivers) — orders per working day vs the same weekdays before: ${u.join(', ')}.` });
    // 5 declined
    if (F.down.length) out.push({ tag: 'dn', t: ar ? `تراجعوا (${F.down.length}): ${names(F.down.slice(0, 8), lang)}.` : `Declined (${F.down.length}): ${names(F.down.slice(0, 8), lang)}.` });
    // 6 days off
    if (F.offs.length) out.push({ tag: 'in', t: ar ? `أخدوا يوم راحة في الأيام الجديدة: ${names(F.offs.slice(0, 10), lang)}${F.offs.length > 10 ? '…' : ''} — علشان كده المقارنة لكل يوم عمل.` : `Took a day off in the new days: ${names(F.offs.slice(0, 10), lang)}${F.offs.length > 10 ? '…' : ''} — that is why the comparison is per working day.` });
    if (M.fleetDelta && Math.abs(M.fleetDelta) >= 1.5) out.push({ tag: 'wt', t: ar ? `الأسطول كله كان ${M.fleetDelta > 0 ? 'أبطأ' : 'أسرع'} في الأيام الجديدة (${fmt(M.baseDt, 1)} ← ${fmt(M.newDt, 1)} دقيقة)، فتغيّر زمن كل سائق اتحسب بالنسبة للأسطول.` : `The whole fleet was ${M.fleetDelta > 0 ? 'slower' : 'faster'} on the new days (${fmt(M.baseDt, 1)} → ${fmt(M.newDt, 1)} min), so each driver's time change is relative to the fleet.` });
  }
  // 7 delivery time
  out.push({ tag: 'wt', t: (ar ? `زمن التوصيل: متوسط الأسطول ${fmt(M.K.dt, 1)} دقيقة والالتزام ${pct(M.K.ot, 1)}. الأبطأ بين النشطين: ` : `Delivery time: fleet average ${fmt(M.K.dt, 1)} min, on-time ${pct(M.K.ot, 1)}. Slowest active drivers: `) + names(F.slow5.slice(0, 5), lang, a => `${a.name} (${fmt(a.avgdt, 1)})`) + '.' });
  // 8 motorcycles
  const V = M.veh;
  if (V.moto.n) out.push({ tag: 'in', t: ar ? `الموتوسيكل (${V.moto.n}): ${fmt(V.moto.orders)} طلب في ${fmt(V.moto.online)} ساعة — ${fmt(V.moto.perDay, 1)} طلب/يوم مقابل ${fmt(V.cars.perDay, 1)} للسيارات، ${fmt(V.moto.perHr, 2)} طلب/ساعة مقابل ${fmt(V.cars.perHr, 2)}، التزام ${pct(V.moto.ot)} مقابل ${pct(V.cars.ot)}، ومتأخر ${pct(V.moto.overdue, 1)} مقابل ${pct(V.cars.overdue, 1)}.`
    : `Motorcycles (${V.moto.n}): ${fmt(V.moto.orders)} orders in ${fmt(V.moto.online)} online hours — ${fmt(V.moto.perDay, 1)} orders/day vs ${fmt(V.cars.perDay, 1)} for cars, ${fmt(V.moto.perHr, 2)} orders/hr vs ${fmt(V.cars.perHr, 2)}, on-time ${pct(V.moto.ot)} vs ${pct(V.cars.ot)}, overdue ${pct(V.moto.overdue, 1)} vs ${pct(V.cars.overdue, 1)}.` });
  // 9 speed
  if (M.speed.fast != null && M.speed.slow != null) out.push({ tag: 'ov', t: ar ? `السرعة = طلبات أكتر: اللي متوسطه 38 دقيقة أو أقل بيعمل ${fmt(M.speed.fast, 1)} طلب في يوم العمل، مقابل ${fmt(M.speed.slow, 1)} للي فوق 38 دقيقة.` : `Speed drives volume: drivers averaging 38 min or less do ${fmt(M.speed.fast, 1)} orders per working day vs ${fmt(M.speed.slow, 1)} for drivers over 38 min.` });
  // 10 no output
  if (F.zero.length || F.stopped.length) out.push({ tag: 'dn', t: ar ? `بدون إنتاج: ${F.zero.length} صفر توصيلات (${names(F.zero, lang)}) و${F.stopped.length} متوقفين (${names(F.stopped, lang)}).` : `No output: ${F.zero.length} with zero deliveries (${names(F.zero, lang)}) and ${F.stopped.length} stopped (${names(F.stopped, lang)}).` });
  // 11 rejections
  out.push({ tag: 'wt', t: (ar ? `الرفض: ${fmt(M.totals.rej)} طلب مرفوض، منهم ${fmt(M.totals.rejAuto)} رفض تلقائي. الأعلى: ` : `Rejections: ${fmt(M.totals.rej)} rejected orders, ${fmt(M.totals.rejAuto)} auto-rejected. Highest: `) + names(F.rejTop, lang, a => `${a.name} (${a.rejected})`) + '.' });
  return out;
}

function messages(M, group, lang) {
  const F = facts(M), ar = lang === 'ar', V = M.veh;
  const endD = KE.dd(M.end), mon = MONTHS[lang][M.month % 100 - 1];
  const left = M.monthDays - endD;
  const L1 = [];
  if (group === 'cars') {
    L1.push(ar ? `*تحديث أداء كيتا | من 1 لـ ${endD} ${mon}*` : `*Keeta Performance Update | 1–${endD} ${MONTHS.en[M.month % 100 - 1]}*`, '');
    const sd = M.sameDow;
    if (M.prevEnd && sd.now != null && sd.before) {
      const better = sd.now >= sd.before;
      L1.push(ar ? `يا رجالة، أيام ${F.newDowNames('ar')} ${better ? 'كانت أحسن من الأسابيع اللي فاتت' : 'كانت أقل من الأسابيع اللي فاتت'}: *${fmt(sd.now)} أوردر في اليوم مقابل ${fmt(sd.before)}*. ${better ? 'برافو عليكم.' : 'محتاجين نرجع للمستوى بتاعنا.'}`
        : `Team, ${F.newDowNames('en')} ${better ? 'were stronger than previous weeks' : 'were below previous weeks'}: *${fmt(sd.now)} orders a day vs ${fmt(sd.before)}*. ${better ? 'Well done.' : "Let's get back to our level."}`, '');
    } else L1.push(ar ? `يا رجالة، ده ملخص أرقام الشهر لحد دلوقتي:` : `Team, here are this month's numbers so far:`, '');
    L1.push(ar ? '*الأوائل:*' : '*Top performers:*');
    const top = F.top[0];
    if (top) L1.push(ar ? `- *${top.name}* رقم 1 في الترتيب.` : `- *${top.name}* is #1 in the ranking.`);
    if (F.most.length) L1.push(ar ? `- *${F.most.map(a => a.name).join(' و')}* ${F.most.length > 1 ? 'أعلى ناس' : 'الأعلى'} في الأوردرات (${fmt(F.maxDel)}${F.most.length > 1 ? ' لكل واحد' : ''}).` : `- *${names(F.most, 'en')}* ${F.most.length > 1 ? 'share' : 'has'} the most orders (${fmt(F.maxDel)}${F.most.length > 1 ? ' each' : ''}).`);
    if (F.fastest) L1.push(ar ? `- *${ISO(F.fastest.name)}* أسرع واحد في الفريق (${fmt(F.fastest.avgdt, 1)} دقيقة).` : `- *${ISO(F.fastest.name)}* is the fastest on the team (${fmt(F.fastest.avgdt, 1)} min).`);
    if (F.climber) L1.push(ar ? `- *${ISO(F.climber.name)}* طلع من المركز ${F.climber.cmp.pRank} للمركز ${F.climber.rank}.` : `- *${ISO(F.climber.name)}* jumped from #${F.climber.cmp.pRank} to #${F.climber.rank}.`);
    const cu = F.carUp.filter(a => a.cmp.dPer != null && a.cmp.dPer > 0.1 && a.cmp.pPer >= 3).slice(0, 4);
    if (cu.length) {
      L1.push('', ar ? '*أكتر ناس اتطوروا:*' : '*Most improved:*');
      cu.forEach(a => L1.push(ar ? `- ${a.name}: من ${fmt(a.cmp.pPer, 1)} لـ ${fmt(a.cmp.nPer, 1)} أوردر في اليوم` : `- ${a.name}: ${fmt(a.cmp.pPer, 1)} → ${fmt(a.cmp.nPer, 1)} orders a day`));
      L1.push(ar ? 'شغل محترم.' : 'Great work.');
    }
    const oT = F.onTrack.filter(a => a.v === 'C'), cL = F.close.filter(a => a.v === 'C');
    if (M.FC.remaining.length && (oT.length || cL.length)) {
      L1.push('', ar ? `*هدف الـ${M.cfg.targetC} أوردر:*` : `*The ${M.cfg.targetC}-order target:*`);
      if (oT.length) L1.push(ar ? `- في الطريق: ${oT.map(a => a.name).join('، ')}` : `- On track: ${oT.map(a => a.name).join(', ')}`);
      if (cL.length) L1.push(ar ? `- قريبين جداً: ${cL.map(a => `${a.name} (محتاج ${fmt(a.fc.need, 0)} في اليوم)`).join('، ')}` : `- Very close: ${cL.map(a => `${a.name} (needs ${fmt(a.fc.need, 0)} a day)`).join(', ')}`);
      L1.push(ar ? 'لسه فيه وقت، اللي قريب يشد حيله.' : 'There is still time — if you are close, push now.');
    }
    if (M.speed.fast != null && M.speed.slow != null) L1.push('', ar ? `*افتكروا دايماً:* اللي بيوصّل في 38 دقيقة أو أقل بيعمل حوالي *${fmt(M.speed.fast, 1)} أوردر في اليوم*، واللي فوق 38 دقيقة حوالي *${fmt(M.speed.slow, 1)}*. السرعة فلوس.` : `*Remember:* drivers who deliver in 38 min or less do about *${fmt(M.speed.fast, 1)} orders a day*; over 38 min, about *${fmt(M.speed.slow, 1)}*. Speed = money.`);
    if (M.totals.rejAuto) L1.push('', ar ? `*الشهر ده اترفض ${fmt(M.totals.rejAuto)} أوردر لوحدهم* علشان محدش قبلهم في الوقت. اقبل الأوردر أول ما يظهر.` : `*${fmt(M.totals.rejAuto)} orders were auto-rejected this month* because nobody accepted them in time. Accept every order the moment it appears.`);
    L1.push('', ar ? `*تنبيه:* أي يوم أقل من ${M.cfg.absMin} أوردرات بيتحسب *غياب*.` : `*Note:* any day with fewer than ${M.cfg.absMin} orders counts as an *absence*.`);
    L1.push('', left > 0 ? (ar ? `فاضل ${left} أيام على آخر الشهر، يلا نقفل الشهر قوي.` : `${left} days left in the month. Let's finish strong.`) : (ar ? 'شكراً على مجهود الشهر.' : 'Thanks for a strong month.'));
  } else {
    L1.push(ar ? `*تحديث أداء سواقين الموتوسيكل | من 1 لـ ${endD} ${mon}*` : `*Motorcycle Riders Update | 1–${endD} ${MONTHS.en[M.month % 100 - 1]}*`, '');
    if (M.prevEnd && V.motoNew) {
      const better = V.motoNew.perHr >= V.motoOld.perHr;
      L1.push(ar ? `يا شباب، ${better ? 'فيه *تحسّن* في الأيام الجديدة' : 'الأيام الجديدة *كانت أضعف*'}:` : `Team, ${better ? 'we saw *improvement* on the new days' : 'the new days were *weaker*'}:`);
      L1.push(ar ? `- الأوردرات في الساعة: *${fmt(V.motoOld.perHr, 2)} ← ${fmt(V.motoNew.perHr, 2)}*` : `- Orders per hour: *${fmt(V.motoOld.perHr, 2)} → ${fmt(V.motoNew.perHr, 2)}*`);
      L1.push(ar ? `- الأوردرات المتأخرة: *${pct(V.motoOld.overdue, 1)} ← ${pct(V.motoNew.overdue, 1)}*` : `- Late orders: *${pct(V.motoOld.overdue, 1)} → ${pct(V.motoNew.overdue, 1)}*`, '');
    }
    const fastM = M.C.list.filter(a => a.v === 'M' && a.avgdt != null && a.avgdt <= M.K.dt && a.delivered >= 20 && (!a.n || a.n.avgdt == null || a.n.avgdt <= M.K.dt));
    const shout = F.motoUp.slice(0, 3);
    if (shout.length || fastM.length) {
