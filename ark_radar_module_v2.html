<!-- ════════ ARK-RADAR: رادار كيتا الكامل (radar.html) + الدفع بالأوردر (نوفمبر 2026) ════════ -->
<style>
#view-radar .rd-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#view-radar .rd-title{display:flex;align-items:center;gap:10px}
#view-radar .rd-title i{font-size:26px;color:#0e7490;background:rgba(14,116,144,.12);padding:8px;border-radius:12px}
#view-radar .rd-title b{font-size:18px;display:block}
#view-radar .rd-title span{font-size:12px;color:var(--muted)}
#view-radar .rd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
#view-radar .rd-k{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:12px 14px}
#view-radar .rd-k b{font-size:22px;display:block}
#view-radar .rd-k span{font-size:12px;color:var(--muted)}
#view-radar .rd-card{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:12px;margin-bottom:14px;overflow:auto}
#view-radar table{width:100%;border-collapse:collapse;font-size:12.5px}
#view-radar th{position:sticky;top:0;background:var(--s2);color:var(--muted);font-weight:800;font-size:11.5px;padding:8px;border-bottom:1px solid var(--br);white-space:nowrap;cursor:pointer}
#view-radar td{padding:7px 8px;border-bottom:1px solid var(--br);text-align:center;white-space:nowrap}
#view-radar td.l{text-align:right}
#view-radar .rd-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:6px 2px}
#view-radar .rd-bar{flex:1;background:#0e7490;border-radius:4px 4px 0 0;position:relative;min-width:8px}
#view-radar .rd-bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
#view-radar .rd-bl{display:flex;gap:4px;font-size:10px;color:var(--muted)}#view-radar .rd-bl div{flex:1;text-align:center}
#view-radar .rd-tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800}
#view-radar .rd-ctl{display:flex;gap:6px;align-items:center}
#view-radar .rd-ctl select,#view-radar .rd-ctl button{padding:6px 10px;border:1px solid var(--br);border-radius:10px;background:var(--s1);font:inherit}
</style>
<script>
(function(){
'use strict';
/* ── 1) الإعداد: سائقو الدفع بالأوردر ───────────────────────────────── */
const RADAR_PER_ORDER = [
  {id:'SA1024', rate:0.400, from:'2026-11-01'},   // CHANDRA DEV YADAV
  {id:'SA1016', rate:0.400, from:'2026-11-01'}    // SANTOSH PRASAD SAH
];
const KEETA = { cache:{}, loading:{} };   // { '2026-11': {rows:[...], byDrv:{SA..:{orders,days,...}}, at} }
window.KEETA_RADAR = KEETA;

function _p(m,y){ return String(y)+'-'+String(m).padStart(2,'0'); }
function _lastDay(m,y){ return new Date(y, m, 0).getDate(); }

/* ── 2) تحميل بيانات الرادار من Supabase ───────────────────────────── */
async function keetaLoad(m, y, force){
  const p = _p(m,y);
  if(KEETA.cache[p] && !force) return KEETA.cache[p];
  if(KEETA.loading[p]) return KEETA.loading[p];
  const from = p+'-01', to = p+'-'+String(_lastDay(m,y)).padStart(2,'0');
  KEETA.loading[p] = (async () => {
    try{
      const url = SUPA_URL + '/rest/v1/v_keeta_daily?select=day,keeta_id,keeta_name,driver_id,vehicle,online_hours,delivered,cancelled,on_time,delivery_min'
        + '&day=gte.' + from + '&day=lte.' + to + '&order=day.asc&limit=10000';
      const r = await fetch(url, {headers:{apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows = await r.json();
      const byDrv = {}, byKeeta = {}, byDay = {};
      rows.forEach(x => {
        const k = x.driver_id || ('K:'+x.keeta_id);
        const o = byDrv[k] || (byDrv[k] = {driver_id:x.driver_id, keeta_ids:new Set(), names:new Set(), vehicle:x.vehicle,
                                           orders:0, days:0, hours:0, cancelled:0, otSum:0, otN:0, dtSum:0, dtN:0, daily:{}});
        o.keeta_ids.add(x.keeta_id); if(x.keeta_name) o.names.add(x.keeta_name);
        const del = +x.delivered || 0;
        o.orders += del; o.hours += +x.online_hours || 0; o.cancelled += +x.cancelled || 0;
        o.daily[x.day] = (o.daily[x.day]||0) + del;
        if(del > 0){ if(x.on_time!=null){ o.otSum += (+x.on_time)*del; o.otN += del; } if(x.delivery_min!=null){ o.dtSum += (+x.delivery_min)*del; o.dtN += del; } }
        byDay[x.day] = (byDay[x.day]||0) + del;
      });
      Object.values(byDrv).forEach(o => { o.days = Object.values(o.daily).filter(v => v >= 1).length; });
      const res = {rows, byDrv, byDay, at:new Date()};
      KEETA.cache[p] = res;
      return res;
    }catch(e){
      console.warn('[radar] load failed', e);
      return null;
    }finally{ delete KEETA.loading[p]; }
  })();
  return KEETA.loading[p];
}
window.keetaLoad = keetaLoad;

function keetaOrdersFor(driverId, m, y){
  const c = KEETA.cache[_p(m,y)];
  if(!c) return null;
  const o = c.byDrv[driverId];
  return o ? o.orders : 0;
}
window.keetaOrdersFor = keetaOrdersFor;

/* ── 3) مكوّن «الدفع بالأوردر» + التعيينات (مرة واحدة، بلا لمس الشهور السابقة) ── */
function radarEnsurePayroll(){
  if(typeof PAY_COMPONENTS === 'undefined') return;
  if(!PAY_COMPONENTS.some(c => c.code === 'PER_ORDER')){
    PAY_COMPONENTS.push({code:'PER_ORDER', ar:'أجر بالأوردر (كيتا)', en:'Per-Order Pay (Keeta)', kind:'earning',
      method:'per_unit', rate:0.400, prorate:false, eos:false, gl:'salaries', ord:15, sys:false, active:true});
    _paySave(PAY_SK.comp, PAY_COMPONENTS);
  }
  let changed = false;
  RADAR_PER_ORDER.forEach(cfg => {
    const has = (code, from) => PAY_ASSIGNMENTS.some(a => a.driver_id === cfg.id && a.component_code === code && String(a.effective_from) === from && a.active !== false);
    const mk = (code, amount, from, to, note) => {
      const a = {id:'PA'+Date.now()+Math.random().toString(36).slice(2,6), driver_id:cfg.id, component_code:code,
        amount:amount, effective_from:from, effective_to:to||null, note:note, active:true,
        created_by:'ARK-RADAR', created_at:new Date().toISOString()};
      PAY_ASSIGNMENTS.push(a); changed = true;
      try{ paySyncAssignment(a); }catch(e){}
      try{ audit('create','payroll_assignment', a.id, null, a); }catch(e){}
    };
    /* أ) تثبيت الأساسي القديم حتى آخر الشهر السابق — كي لا يتغيّر أي شهر قبل التحويل */
    const prevEnd = (() => { const d = new Date(cfg.from); d.setDate(0); return fmtDate(d); })();
    const oldBasic = PAY_ASSIGNMENTS.some(a => a.driver_id === cfg.id && a.component_code === 'BASIC' && String(a.effective_from) < cfg.from && a.active !== false);
    if(!oldBasic){
      const sal = getSalData(cfg.id); const d = DRV.find(x => x.id === cfg.id) || {};
      const base = parseFloat(sal && sal.base) || 0;
      if(base > 0) mk('BASIC', base, (d.start_date || d.startDate || '2025-01-01'), prevEnd, 'تثبيت الأساسي قبل التحويل للدفع بالأوردر');
    }
    /* ب) من تاريخ التحويل: أساسي صفر + أجر بالأوردر */
    if(!has('BASIC', cfg.from))     mk('BASIC', 0, cfg.from, null, 'تحويل للدفع بالأوردر');
    if(!has('PER_ORDER', cfg.from)) mk('PER_ORDER', cfg.rate, cfg.from, null, 'سعر الأوردر — الكمية من رادار كيتا');
  });
  if(changed) payAsgSave();
}

/* ── 4) ربط المحرّك: الكمية = أوردرات كيتا المُسلَّمة في الشهر ───────────── */
function radarHookPayroll(){
  if(typeof payComputeEmployee !== 'function' || payComputeEmployee.__radar) return;
  const orig = payComputeEmployee;
  const wrapped = function(d, m, y){
    const line = orig(d, m, y);
    try{
      if(!line || line.not_started) return line;
      const asg = payAssignmentsFor(d.id, m, y).find(a => a.component_code === 'PER_ORDER');
      if(!asg) return line;
      line.components = line.components.filter(c => c.code !== 'PER_ORDER');
      const qty = keetaOrdersFor(d.id, m, y);
      const rate = parseFloat(asg.amount) || 0;
      const amt = _payRound((qty || 0) * rate);
      line.components.push({code:'PER_ORDER', name:'أجر بالأوردر (كيتا)', kind:'earning', method:'per_unit',
        qty:qty || 0, amount:amt,
        note: qty == null ? '⚠ بيانات الرادار لم تُحمَّل بعد' : (qty + ' أوردر × ' + rate.toFixed(3)),
        source:'radar'});
      line.per_order = {qty:qty, rate:rate, loaded: qty != null};
      line.gross = 0; line.total_ded = 0;
      line.components.forEach(c => { if(c.kind === 'earning') line.gross += c.amount; else line.total_ded += c.amount; });
      line.gross = _payRound(line.gross); line.total_ded = _payRound(line.total_ded);
      const net = line.gross - line.total_ded;
      line.net = _payRound(PAY_CFG.netFloorZero ? Math.max(0, net) : net);
      line.uncovered = PAY_CFG.netFloorZero && net < 0 ? _payRound(-net) : 0;
    }catch(e){ console.warn('[radar] payroll hook', e); }
    return line;
  };
  wrapped.__radar = true;
  payComputeEmployee = wrapped;
  window.payComputeEmployee = wrapped;

  /* مسيّر الرواتب ينتظر بيانات الرادار للشهر المعروض ثم يعيد الرسم مرة واحدة */
  if(typeof renderPayroll === 'function' && !renderPayroll.__radar){
    const origR = renderPayroll;
    const r2 = function(){
      const out = origR.apply(this, arguments);
      try{
        const p = _p(PAY_VIEW.m, PAY_VIEW.y);
        if(!KEETA.cache[p]) keetaLoad(PAY_VIEW.m, PAY_VIEW.y).then(res => { if(res && currentView === 'payroll') origR(); });
      }catch(e){}
      return out;
    };
    r2.__radar = true;
    renderPayroll = r2; window.renderPayroll = r2;
  }
}

/* ── 5) شاشة «رادار كيتا» داخل ARK ───────────────────────────────────── */
const RV = { m:(new Date()).getMonth()+1, y:(new Date()).getFullYear(), sort:'orders' };
function _esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _n(v,d){ return (v==null||isNaN(v)) ? '—' : (+v).toFixed(d==null?0:d); }

async function renderRadar(force){
  const el = document.getElementById('radarBody'); if(!el) return;
  el.innerHTML = '<div class="dx-empty"><i class="ti ti-loader"></i>جاري تحميل بيانات الرادار…</div>';
  const res = await keetaLoad(RV.m, RV.y, force);
  if(!res){ el.innerHTML = '<div class="dx-empty"><i class="ti ti-wifi-off"></i>تعذّر تحميل بيانات الرادار</div>'; return; }
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const list = Object.values(res.byDrv).filter(o => o.orders > 0 || o.hours > 1);
  const perOrder = {}; RADAR_PER_ORDER.forEach(c => perOrder[c.id] = c);
  list.forEach(o => {
    const d = o.driver_id ? DRV.find(x => x.id === o.driver_id) : null;
    o.name = d ? d.name : [...o.names][0] || '—';
    o.partner = d ? (d.partner||'') : '';
    o.avg = o.days ? o.orders / o.days : 0;
    o.ot = o.otN ? o.otSum / o.otN : null;
    o.dt = o.dtN ? o.dtSum / o.dtN : null;
    const po = o.driver_id && perOrder[o.driver_id];
    o.pay = po && (_p(RV.m,RV.y)+'-01') >= po.from ? o.orders * po.rate : null;
  });
  const key = RV.sort;
  list.sort((a,b) => (b[key]||0) - (a[key]||0));
  const days = Object.keys(res.byDay).sort();
  const tot = days.reduce((s,d) => s + res.byDay[d], 0);
  const active = list.filter(o => o.orders > 0).length;
  const lastDay = days[days.length-1] || '—';
  const unmapped = list.filter(o => !o.driver_id);
  const max = Math.max(1, ...days.map(d => res.byDay[d]));
  const mOpts = months.map((n,i) => '<option value="'+(i+1)+'"'+(i+1===RV.m?' selected':'')+'>'+n+'</option>').join('');
  const yOpts = [RV.y-1, RV.y, RV.y+1].map(y => '<option'+(y===RV.y?' selected':'')+'>'+y+'</option>').join('');
  const th = (k,t) => '<th onclick="radarSort(\''+k+'\')">'+t+(RV.sort===k?' ▼':'')+'</th>';
  el.innerHTML =
    '<div class="rd-head"><div class="rd-title"><i class="ti ti-radar-2"></i><div><b>رادار كيتا</b>' +
      '<span>أداء الكباتن من شيت كيتا اليومي · آخر يوم في البيانات: '+_esc(lastDay)+'</span></div></div>' +
      '<div class="rd-ctl"><select onchange="radarMonth(this.value,null)">'+mOpts+'</select>' +
      '<select onchange="radarMonth(null,this.value)">'+yOpts+'</select>' +
      '<button onclick="renderRadar(true)"><i class="ti ti-refresh"></i> تحديث</button></div></div>' +
    '<div class="rd-kpis">' +
      '<div class="rd-k"><b>'+tot.toLocaleString('en')+'</b><span>أوردر مُسلَّم</span></div>' +
      '<div class="rd-k"><b>'+(days.length? _n(tot/days.length,0):'—')+'</b><span>متوسط الأوردرات في اليوم</span></div>' +
      '<div class="rd-k"><b>'+active+'</b><span>كابتن اشتغل</span></div>' +
      '<div class="rd-k"><b>'+days.length+'</b><span>يوم في البيانات</span></div>' +
    '</div>' +
    '<div class="rd-card"><div style="font-weight:900;margin-bottom:18px">الأوردرات اليومية</div>' +
      '<div class="rd-bars">'+days.map(d => '<div class="rd-bar" style="height:'+(res.byDay[d]/max*100)+'%"><span>'+res.byDay[d]+'</span></div>').join('')+'</div>' +
      '<div class="rd-bl">'+days.map(d => '<div>'+(+d.slice(8))+'</div>').join('')+'</div></div>' +
    '<div class="rd-card"><table><thead><tr><th>#</th><th>الكابتن</th><th>الشريك</th><th>المركبة</th>' +
      th('orders','الأوردرات') + th('days','أيام العمل') + th('avg','متوسط/يوم') + th('hours','ساعات أونلاين') +
      th('cancelled','ملغي') + th('ot','في الوقت') + '<th>زمن التوصيل</th><th>أجر بالأوردر</th></tr></thead><tbody>' +
      list.map((o,i) => '<tr><td>'+(i+1)+'</td><td class="l"><b>'+_esc(o.name)+'</b>'+(o.driver_id?' <span class="dx-mut">'+_esc(o.driver_id)+'</span>':' <span class="rd-tag" style="background:#fef3c7;color:#92400e">غير مربوط</span>')+'</td>' +
        '<td>'+_esc(o.partner||'—')+'</td><td>'+(o.vehicle==='M'?'موتوسيكل':'سيارة')+'</td>' +
        '<td><b>'+o.orders+'</b></td><td>'+o.days+'</td>' +
        '<td><span class="rd-tag" style="background:'+(o.avg>=12?'#dcfce7;color:#166534':o.avg>=9?'#fef9c3;color:#854d0e':'#fee2e2;color:#991b1b')+'">'+_n(o.avg,1)+'</span></td>' +
        '<td>'+_n(o.hours,1)+'</td><td>'+o.cancelled+'</td><td>'+(o.ot==null?'—':_n(o.ot*100,0)+'٪')+'</td><td>'+(o.dt==null?'—':_n(o.dt,1)+' د')+'</td>' +
        '<td>'+(o.pay==null?'—':'<b>'+o.pay.toFixed(3)+'</b> د.ك')+'</td></tr>').join('') +
    '</tbody></table></div>' +
    (unmapped.length ? '<div class="dx-mut">كباتن في شيت كيتا غير مربوطين بسائق في ARK: '+unmapped.map(o => _esc(o.name)).join('، ')+'</div>' : '') +
    '<div class="dx-mut" style="margin-top:6px">الأجر بالأوردر: '+RADAR_PER_ORDER.map(c => { const d = DRV.find(x => x.id === c.id); return _esc(d?d.name:c.id)+' ('+c.rate.toFixed(3)+' من '+c.from+')'; }).join('، ')+' — يُحسب تلقائياً في مسيّر الرواتب من نفس البيانات.</div>';
}
window.renderRadar = renderRadar;
window.radarSort  = k => { RV.sort = k; renderRadar(); };
window.radarMonth = (m,y) => { if(m) RV.m = +m; if(y) RV.y = +y; renderRadar(); };

function radarMountUI(){
  if(!document.getElementById('nav-radar')){
    const ref = document.getElementById('nav-payroll');
    if(ref){
      const b = document.createElement('button');
      b.className = 'nav-tab'; b.id = 'nav-radar'; b.setAttribute('data-tip','رادار كيتا');
      b.onclick = () => setMainView('radar');
      b.innerHTML = '<i class="ti ti-radar-2"></i> <span>رادار كيتا</span>';
      ref.parentNode.insertBefore(b, ref);
    }
  }
  if(!document.getElementById('view-radar')){
    const ref = document.getElementById('view-payroll');
    const v = document.createElement('div');
    v.id = 'view-radar';
    v.style.cssText = 'display:none;padding:20px;overflow-y:auto;height:calc(100vh - 56px);background:var(--bg)';
    v.style.cssText = 'display:none;height:calc(100vh - 56px);background:var(--bg);padding:0;overflow:hidden';
    v.innerHTML = '<iframe id="radarFrame" title="رادار السلاسل" style="border:0;width:100%;height:100%;display:block" data-src="radar.html"></iframe>';
    (ref && ref.parentNode ? ref.parentNode : document.body).insertBefore(v, ref || null);
  }
  if(typeof setMainView === 'function' && !setMainView.__radar){
    const orig = setMainView;
    const sv = function(view){
      orig(view);
      const v = document.getElementById('view-radar'); if(v) v.style.display = view === 'radar' ? 'block' : 'none';
      const n = document.getElementById('nav-radar');  if(n) n.classList.toggle('on', view === 'radar');
      if(view === 'radar'){ const f = document.getElementById('radarFrame'); if(f && !f.getAttribute('src')) f.setAttribute('src', f.dataset.src + '?v=' + Date.now()); }
    };
    sv.__radar = true;
    setMainView = sv; window.setMainView = sv;
  }
}

function radarInit(){
  try{ radarEnsurePayroll(); }catch(e){ console.warn('[radar] payroll setup', e); }
  try{ radarHookPayroll(); }catch(e){ console.warn('[radar] hook', e); }
  try{ radarMountUI(); }catch(e){ console.warn('[radar] ui', e); }
  const now = new Date();
  keetaLoad(now.getMonth()+1, now.getFullYear());
  /* لما شيت جديد يتحمّل في الرادار: امسح الكاش وأعد حساب المسيّر */
  window.addEventListener('message', ev => {
    if(!ev.data || ev.data.type !== 'radar-updated') return;
    KEETA.cache = {};
    clearTimeout(window.__radarT);
    window.__radarT = setTimeout(() => { if(typeof currentView !== 'undefined' && currentView === 'payroll') renderPayroll(); }, 1500);
  });
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(radarInit, 300));
else setTimeout(radarInit, 300);
})();
</script>
